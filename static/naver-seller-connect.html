<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>서버 후기 수집 연결</title><style>body{font:16px sans-serif;margin:24px;background:#f5f7f4}button,input{padding:10px;margin:4px}img{width:100%;max-width:1440px;background:white;border:1px solid #bbb}#status{white-space:pre-wrap}</style><h1>서버 후기 수집 연결</h1><p>이 화면은 Railway 서버의 브라우저입니다. 연결 후에는 PC를 꺼도 예약 수집합니다. 네이버 추가 인증이나 계정 보호 안내가 나오면 중단하고 알려주세요.</p><p>연결 화면은 15분 후 종료됩니다. 로그인 완료 뒤 ‘검증 후 연결’을 눌러주세요. 비밀번호는 저장하지 않으며 검증에 성공한 로그인 상태만 서버 비공개 영역에 보관합니다.</p><button id="start">연결 화면 시작</button><button id="save">검증 후 연결</button><button id="close">닫기</button><button id="diagnose">목록 진단</button><p>아래 화면에서 입력칸을 클릭한 뒤 이 칸에 입력하고 ‘입력’을 누르세요.</p><input id="text" type="password" autocomplete="off"><button id="send">입력</button><button data-key="Control+A">전체 선택</button><button data-key="Backspace">지우기</button><button data-key="Tab">다음 입력칸</button><button data-key="Enter">엔터</button><button data-scroll="-700">위로</button><button data-scroll="700">아래로</button><p id="status">연결 대기</p><img id="screen" alt="서버 로그인 화면"><script>
let token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let timer,busy=false;
const status=document.getElementById('status'),screen=document.getElementById('screen');
async function call(action,extra={}){const r=await fetch('/api/naver-seller/connect',{method:'POST',headers:{'Content-Type':'application/json','X-Naver-Connect':token},body:JSON.stringify({action,...extra})});if(!r.ok){const e=await r.json();throw Error(e.detail||'연결 실패')}return r}
async function image(){if(busy)return;busy=true;try{const r=await call('image');const url=URL.createObjectURL(await r.blob());const old=screen.src;screen.src=url;if(old.startsWith('blob:'))URL.revokeObjectURL(old)}catch(e){clearInterval(timer);status.textContent=e.message}finally{busy=false}}
async function act(action,extra){try{await call(action,extra);await image()}catch(e){status.textContent=e.message}}
document.getElementById('start').onclick=async()=>{try{await call('start');status.textContent='서버 브라우저에서 직접 로그인해 주세요.';await image();timer=setInterval(image,1600)}catch(e){status.textContent=e.message}};
screen.onclick=e=>act('click',{x:e.offsetX*1440/screen.clientWidth,y:e.offsetY*1000/screen.clientHeight});
document.getElementById('send').onclick=()=>{const el=document.getElementById('text');const value=el.value;el.value='';act('text',{text:value})};
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>act('key',{key:b.dataset.key}));document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>act('scroll',{y:Number(b.dataset.scroll)}));
document.getElementById('save').onclick=async()=>{clearInterval(timer);status.textContent='리뷰 전체 건수를 검증하고 있습니다…';try{const r=await(await call('save')).json();status.textContent=`검증 완료: ${r.received}건 확인, ${r.added}건 추가. 서버 연결 완료.`;screen.removeAttribute('src');token=''}catch(e){status.textContent=e.message;timer=setInterval(image,1600)}};
document.getElementById('diagnose').onclick=async()=>{status.textContent=JSON.stringify(await(await call('diagnostics')).json())};
document.getElementById('close').onclick=async()=>{clearInterval(timer);await call('close');screen.removeAttribute('src');status.textContent='연결 화면을 닫았습니다.'};
</script></html>
