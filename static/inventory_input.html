<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>재고 입력 — 백년화편</title>
  <style>
/* =====================================================
   백년화편 디자인 시스템 — 토스 스타일
   모든 페이지 공통 적용
   ===================================================== */

/* ─── 라이트 모드 ─── */
[data-theme="day"], :root {
  --bg:           #F9FAFB;
  --bg2:          #F2F4F6;
  --surface:      #FFFFFF;
  --surface2:     #F2F4F6;
  --border:       #E5E8EB;
  --border2:      #CDD1D8;
  --text:         #191F28;
  --text2:        #333D4B;
  --text3:        #6B7684;
  --text4:        #B0B8C1;
  --muted:        #6B7684;

  /* 퍼스널 컬러 — 브랜드 앰버·오렌지 */
  --brand:        #F5820D;
  --brand-dark:   #D96E00;
  --brand-bg:     #FFF4E6;
  --brand-light:  #FFF4E6;
  --brand-rgb:    245,130,13;
  --accent-d:     #F5820D;

  --blue:         #3182F6;
  --blue-bg:      #EBF3FE;
  --blue-light:   #EBF3FE;
  --blue-rgb:     49,130,246;

  --red:          #F04452;
  --red-bg:       #FFF0F0;
  --red-light:    #FFF0F0;
  --danger:       #F04452;
  --danger-bg:    #FFF0F0;

  --green:        #00A86B;
  --green-bg:     #E8FAF4;
  --green-light:  #E8FAF4;
  --positive:     #00A86B;
  --positive-bg:  #E8FAF4;

  --purple:       #6C47FF;
  --purple-bg:    #F3F0FF;
  --purple-light: #F3F0FF;

  --teal:         #00BCD4;
  --teal-bg:      #E6F9FC;
  --teal-light:   #E6F9FC;

  --amber:        #F59E0B;
  --amber-bg:     #FFFAEB;
  --amber-light:  #FFFAEB;

  --mono:         'SF Mono','JetBrains Mono',monospace;
  --r-pill:       50px;

  /* 그림자 — 두 세트 동시 지원 */
  --sh-xs:        0 1px 2px rgba(0,0,0,.05);
  --sh-sm:        0 2px 8px rgba(0,0,0,.07);
  --sh-md:        0 4px 16px rgba(0,0,0,.09);
  --sh-lg:        0 8px 32px rgba(0,0,0,.11);
  --sh-xl:        0 20px 56px rgba(0,0,0,.13);
  --sh-brand:     0 4px 14px rgba(245,130,13,.28);
  --sh-blue:      0 4px 14px rgba(49,130,246,.25);
  --shadow-xs:0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 2px 10px rgba(0,0,0,.5);
  --shadow-md:0 4px 20px rgba(0,0,0,.6);
  --shadow-xl:0 20px 56px rgba(0,0,0,.8);
  --shadow-brand: 0 4px 14px rgba(245,130,13,.28);
  --shadow-blue:  0 4px 14px rgba(49,130,246,.25);
}

/* ─── 다크 모드 ─── */
[data-theme="night"]{
  --bg:#111111;--bg2:#1C1C1E;--surface:#1C1C1E;--surface2:#2C2C2E;
  --border:#3A3A3C;--border2:#48484A;
  --text:#F5F5F5;--text2:#EBEBF0;--text3:#8E8E93;--text4:#48484A;
  --brand:#FF9A30;--brand-bg:rgba(255,154,48,.18);--brand-dark:#FFB558;--brand-rgb:255,154,48;
  --blue:#4D9BFF;--blue-bg:rgba(77,155,255,.2);--blue-rgb:77,155,255;
  --red:#FF6B75;--red-bg:rgba(255,107,117,.18);
  --green:#1FC791;--green-bg:rgba(31,199,145,.2);
  --purple:#8B6FFF;--purple-bg:rgba(139,111,255,.2);
  --teal:#22D3EE;--teal-bg:rgba(34,211,238,.18);
  --amber:#FBB928;--amber-bg:rgba(251,185,40,.18);
  --muted:#8E8E93;--r-pill:50px;
  --sh-xs:0 1px 3px rgba(0,0,0,.4);--sh-sm:0 2px 10px rgba(0,0,0,.5);
  --sh-md:0 4px 20px rgba(0,0,0,.6);--sh-lg:0 8px 32px rgba(0,0,0,.7);
  --sh-xl:0 20px 56px rgba(0,0,0,.8);
  --sh-brand:0 4px 14px rgba(255,154,48,.28);--sh-blue:0 4px 14px rgba(77,155,255,.28);
  --shadow-xs:0 1px 3px rgba(0,0,0,.4);--shadow-sm:0 2px 10px rgba(0,0,0,.5);
  --shadow-md:0 4px 20px rgba(0,0,0,.6);--shadow-xl:0 20px 56px rgba(0,0,0,.8);
  --shadow-brand:0 4px 14px rgba(255,154,48,.28);--shadow-blue:0 4px 14px rgba(77,155,255,.28);
  --danger:#FF6B75;--danger-bg:rgba(255,107,117,.18);
  --positive:#1FC791;--positive-bg:rgba(31,199,145,.2);
  --bg2:#1C1C1E;--accent-d:#FF9A30;
}

/* ─── 리셋 ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s ease, color .2s ease;
}

/* ─── 키프레임 ─── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
@keyframes spin     { to{transform:rotate(360deg)} }
@keyframes dotBlink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
@keyframes shimmer  { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.72)} }
@keyframes spring   { 0%{transform:scale(.88) translateY(14px);opacity:0} 100%{transform:scale(1) translateY(0);opacity:1} }

/* ─── 공통 컴포넌트 ─── */

/* 스켈레톤 */
.skeleton {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 400px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}

/* 스피너 */
.spinner {
  width: 26px; height: 26px;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}

/* 프로그레스 바 */
.progress-wrap { position:fixed; top:0; left:0; width:100%; height:3px; z-index:9999; pointer-events:none; }
.progress-bar  {
  height:100%; width:0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* 토스트 */
#toast {
  position:fixed; bottom:32px; left:50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg);
  font-size:13px; font-weight:700;
  padding:10px 22px; border-radius:50px;
  opacity:0; pointer-events:none; z-index:9999;
  white-space:nowrap;
  transition: opacity 200ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 테마 버튼 */
.theme-toggle {
  position:fixed; bottom:22px; left:20px; z-index:999;
  width:40px; height:40px; border-radius:50%;
  border:1.5px solid var(--border); background:var(--surface);
  color:var(--text3); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sh-sm);
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 150ms ease;
  -webkit-tap-highlight-color:transparent;
}
.theme-toggle:hover  { transform:scale(1.1); box-shadow:var(--sh-md); }
.theme-toggle:active { transform:scale(.92); }

/* 메모 FAB */
#memoFab {
  position:fixed; bottom:22px; right:22px; z-index:900;
  width:52px; height:52px; border-radius:50%;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  color:#fff; border:none; cursor:pointer; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--sh-brand);
  transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color:transparent;
}
#memoFab:hover  { transform:scale(1.1) rotate(-6deg); box-shadow:0 8px 28px rgba(var(--brand-rgb),.45); }
#memoFab:active { transform:scale(.94); }

.mp-badge {
  position:absolute; top:5px; right:5px;
  min-width:17px; height:17px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9px; font-weight:800; border-radius:50px;
  border:2.5px solid var(--surface);
  display:none; align-items:center; justify-content:center;
}
.mp-badge.show { display:flex; }

/* 메모 패널 */
#memoPanel {
  position:fixed; bottom:84px; right:22px; z-index:901;
  width:320px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:20px; box-shadow:var(--sh-xl); overflow:hidden;
  transform:scale(.88) translateY(14px); transform-origin:bottom right;
  opacity:0; pointer-events:none;
  transition: transform 280ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease;
}
#memoPanel.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }

.mp-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--border);
  font-size:14px; font-weight:700;
}
.mp-close-btn {
  width:26px; height:26px; border-radius:50%;
  border:none; background:var(--surface2); color:var(--text3);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-close-btn:hover { background:var(--border); color:var(--text); }

.mp-body { padding:14px 18px; }
.mp-input-row { display:flex; gap:8px; margin-bottom:12px; }
.mp-input {
  flex:1; padding:10px 12px;
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:12px; color:var(--text);
  font-family:inherit; font-size:13px; line-height:1.6;
  resize:none; outline:none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }

.mp-save-btn {
  height:36px; padding:0 14px; align-self:flex-end;
  border-radius:50px; border:none;
  background:var(--brand); color:#fff;
  font-family:inherit; font-size:12px; font-weight:700;
  cursor:pointer; flex-shrink:0;
  transition:all 150ms ease;
}
.mp-save-btn:hover   { background:var(--brand-dark); }
.mp-save-btn:active  { transform:scale(.96); }
.mp-save-btn:disabled { opacity:.5; cursor:not-allowed; }

.mp-list { max-height:260px; overflow-y:auto; scrollbar-width:thin; }

.mp-card { padding:10px 0; border-bottom:1px solid var(--border); position:relative; }
.mp-card:last-child { border-bottom:none; }
.mp-card-text { font-size:12px; color:var(--text2); line-height:1.6; padding-right:28px; }
.mp-card-date { font-size:10px; color:var(--text4); margin-top:4px; font-variant-numeric:tabular-nums; }
.mp-del-btn {
  position:absolute; top:10px; right:0;
  width:22px; height:22px; border-radius:50%;
  border:none; background:transparent; color:var(--text4);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-del-btn:hover { background:var(--red-bg); color:var(--red); }
.mp-empty { font-size:12px; color:var(--text4); text-align:center; padding:20px 0; }

.mp-toast {
  position:fixed; bottom:88px; right:80px; z-index:902;
  background:var(--text); color:var(--bg);
  font-size:12px; font-weight:700;
  padding:8px 16px; border-radius:50px;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:all 200ms ease;
}
.mp-toast.show { opacity:1; transform:translateY(0); }

@media (max-width:480px) {
  #memoPanel { width:calc(100vw - 28px); right:14px; bottom:78px; }
  #memoFab   { width:48px; height:48px; right:16px; bottom:18px; }
}


.app-header,.header { position:sticky; top:0; z-index:100; height:56px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:12px; box-shadow:var(--sh-xs); }
.header-info { display:flex; align-items:center; gap:10px; flex:1; }
.header-title,.title { font-size:15px; font-weight:800; letter-spacing:-.4px; }
.sub { font-size:12px; color:var(--text3); margin-bottom:14px; }
.content,.new-product-form,.product-grid,.soldout-grid { max-width:560px; margin:0 auto; }
.content { padding:24px 20px 80px; }
.section { margin-bottom:20px; }
.section-title { font-size:13px; font-weight:700; color:var(--text2); margin-bottom:12px; }
.back-btn,.back-link { display:inline-flex; align-items:center; gap:5px; height:32px; padding:0 12px; border-radius:50px; border:1.5px solid var(--border); background:transparent; font-size:12px; font-weight:600; color:var(--text3); text-decoration:none; cursor:pointer; transition:all 150ms ease; }
.back-btn:hover,.back-link:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-bg); }
.form-group { margin-bottom:13px; }
.form-label { display:block; font-size:12px; font-weight:700; color:var(--text2); margin-bottom:5px; }
.form-input { width:100%; height:42px; padding:0 12px; border:1.5px solid var(--border); border-radius:11px; background:var(--surface); color:var(--text); font-family:inherit; font-size:13px; outline:none; transition:border-color 150ms ease, box-shadow 150ms ease; }
.form-input:focus { border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-bg); }
.btn-primary { height:44px; padding:0 22px; border-radius:50px; border:none; background:var(--teal); color:#fff; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:all 150ms ease; box-shadow:0 2px 10px rgba(0,188,212,.3); }
.btn-primary:hover { filter:brightness(1.08); transform:translateY(-1px); }
.btn-primary:active { transform:scale(.97); }
.new-product-form { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:20px; margin-bottom:14px; }
.empty { text-align:center; padding:40px 20px; color:var(--text3); }
.toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--text); color:var(--bg); font-size:13px; font-weight:700; padding:10px 22px; border-radius:50px; opacity:0; pointer-events:none; z-index:9999; white-space:nowrap; transition:all 200ms ease; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
@media(max-width:400px){.content{padding:16px 14px 80px;}}


/* ─── inventory_input 동적 렌더 ─── */

/* 상품 행 */
.product-row {
  display:flex; align-items:center; gap:10px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.product-row:last-child { border-bottom:none; }
.product-row.low-stock .prow-name { color:var(--red); }

.prow-name  { font-size:13px; font-weight:600; color:var(--text2); }
.prow-stock { font-size:11px; color:var(--text4); margin-top:2px; font-variant-numeric:tabular-nums; }

/* 수량 입력 */
.qty-input {
  width:72px; height:38px; padding:0 10px; text-align:center;
  border:1.5px solid var(--border); border-radius:10px;
  background:var(--surface); color:var(--text);
  font-family:inherit; font-size:14px; font-weight:700;
  outline:none; flex-shrink:0;
  transition:border-color 150ms ease, box-shadow 150ms ease;
  font-variant-numeric:tabular-nums;
}
.qty-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }

/* 적용 버튼 */
.apply-btn {
  height:38px; padding:0 16px; border-radius:50px; border:none;
  font-family:inherit; font-size:12px; font-weight:700;
  cursor:pointer; transition:all 150ms ease; white-space:nowrap; flex-shrink:0;
}
.apply-btn.add { background:var(--green); color:#fff; box-shadow:0 2px 8px rgba(0,168,107,.25); }
.apply-btn.add:hover { filter:brightness(1.08); }
.apply-btn.set { background:var(--blue); color:#fff; box-shadow:0 2px 8px rgba(49,130,246,.25); }
.apply-btn.set:hover { filter:brightness(1.08); }
.apply-btn:active { transform:scale(.97); }

/* 매진 임박 아이템 */
.soldout-item {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.soldout-item:last-child { border-bottom:none; }
.soldout-name  { font-size:13px; font-weight:600; color:var(--text2); }
.soldout-stock { font-size:11px; font-weight:700; margin-top:2px; }
.soldout-stock.danger  { color:var(--red); }
.soldout-stock.warning { color:var(--amber); }

/* 매진 처리 버튼 */
.btn-soldout {
  height:32px; padding:0 14px; border-radius:50px;
  border:1.5px solid rgba(240,68,82,.3); background:var(--red-bg);
  font-family:inherit; font-size:11px; font-weight:700; color:var(--red);
  cursor:pointer; transition:all 150ms ease; flex-shrink:0;
}
.btn-soldout:hover { background:var(--red); color:#fff; border-color:var(--red); }
.btn-soldout:active { transform:scale(.97); }

/* 공통 반응형 */
@media(max-width:420px) {
  .qty-input { width:60px; }
  .apply-btn { padding:0 12px; font-size:11px; }
}
</style>
<script>
(function(){var DS=6,DE=20;function auto(){var h=new Date().getHours();return(h>=DS&&h<DE)?'day':'night';}function apply(m,save){document.documentElement.setAttribute('data-theme',m);var b=document.getElementById('themeToggle');if(b)b.textContent=m==='night'?'☀️':'🌙';if(save){try{localStorage.setItem('bnh_theme',m);}catch(e){}}}window.__toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme')||'day';apply(c==='day'?'night':'day',true);};setInterval(function(){try{if(!localStorage.getItem('bnh_theme'))apply(auto(),false);}catch(e){}},60000);(function(){var m=null;try{m=localStorage.getItem('bnh_theme');}catch(e){}apply(m||auto(),false);})();})();})();
})();
</script>
</head>
<body>

<header>
  <div class="header-info">
    <div class="title">📝 재고 입력</div>
    <div class="sub">수량 입력 후 적용 버튼을 눌러주세요</div>
  </div>
</header>

<div class="content">

  <!-- 빠른 추가 입력 -->
  <div class="section">
    <div class="section-title">⚡ 빠른 추가 입력</div>
    <div class="product-grid" id="quickGrid">
      <div class="empty">상품을 불러오는 중...</div>
    </div>
  </div>

  <!-- 재고 직접 설정 (초기화/덮어쓰기) -->
  <div class="section">
    <div class="section-title">🔧 재고 직접 설정 <span style="font-size:11px;color:var(--text3);font-weight:400">현재 수량을 해당 숫자로 교체</span></div>
    <div class="product-grid" id="setGrid">
      <div class="empty">상품을 불러오는 중...</div>
    </div>
  </div>

  <!-- 매진 임박 상품 -->
  <div class="section" id="alertSection" style="display:none">
    <div class="section-title">⚠️ 매진 임박 / 매진 상품</div>
    <div class="soldout-grid" id="alertGrid"></div>
  </div>

  <!-- 신규 상품 등록 -->
  <div class="section">
    <div class="section-title">➕ 신규 상품 등록</div>
    <div class="new-product-form">
      <div class="form-group">
        <label class="form-label">상품명 *</label>
        <input class="form-input" id="np-name" placeholder="예: 백설기" autocomplete="off" />
      </div>
      <div style="display:flex;gap:8px">
        <div class="form-group">
          <label class="form-label">상품 코드 (선택)</label>
          <input class="form-input" id="np-code" placeholder="EasyPOS 코드" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label">초기 재고</label>
          <input class="form-input" type="number" id="np-stock" placeholder="0" min="0" inputmode="numeric" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">매진 임박 기준 (개) — 비우면 기본값</label>
        <input class="form-input" type="number" id="np-threshold" placeholder="기본값 사용" min="1" inputmode="numeric" />
      </div>
      <button class="btn-primary" onclick="addNewProduct()">상품 등록</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
function nowStr() {
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const DEFAULT_STATE = () => ({ products:[], history:[], settings:{ hd_code:'HYW', sp_code:'', alert_threshold:10, warning_threshold:20 } });
let state = DEFAULT_STATE();

function getPid(p) { return p.item_code || p._id; }

async function loadData() {
  try {
    const r = await fetch('/api/inventory');
    if (!r.ok) throw new Error();
    const d = await r.json();
    (d.products||[]).forEach((p,i) => { if (!p._id) p._id='p_'+Date.now()+'_'+i; });
    state = { ...DEFAULT_STATE(), ...d };
    state.settings = { ...DEFAULT_STATE().settings, ...(d.settings||{}) };
  } catch(e) {}
}

async function saveData() {
  try {
    await fetch('/api/inventory', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state) });
  } catch(e) {}
}

function addHistory(entry) {
  if (!state.history) state.history=[];
  state.history.push({...entry, datetime:nowStr()});
  if (state.history.length>500) state.history=state.history.slice(-500);
}

function renderAll() {
  const def = state.settings.alert_threshold||10;
  const warn = state.settings.warning_threshold||(def*2);

  // 빠른 추가 입력
  const qg = document.getElementById('quickGrid');
  if (!state.products.length) {
    qg.innerHTML = '<div class="empty">등록된 상품이 없습니다. 아래에서 신규 상품을 등록해주세요.</div>';
  } else {
    qg.innerHTML = state.products.map(p => {
      const pid = getPid(p);
      const th = p.threshold!=null?p.threshold:def;
      const cls = p.current_stock<=0?'no-stock':p.current_stock<=th?'low-stock':'';
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="product-row ${cls}">
        <div>
          <div class="prow-name">${p.item_name}</div>
          <div class="prow-stock">현재: ${p.current_stock}개</div>
        </div>
        <input class="qty-input" type="number" id="qadd-${pid_esc}" placeholder="수량" min="1" inputmode="numeric" />
        <button class="apply-btn add" onclick="quickAdd('${pid_esc}')">추가</button>
      </div>`;
    }).join('');
  }

  // 직접 설정
  const sg = document.getElementById('setGrid');
  if (!state.products.length) {
    sg.innerHTML = '<div class="empty">등록된 상품이 없습니다.</div>';
  } else {
    sg.innerHTML = state.products.map(p => {
      const pid = getPid(p);
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="product-row">
        <div>
          <div class="prow-name">${p.item_name}</div>
          <div class="prow-stock">현재: ${p.current_stock}개</div>
        </div>
        <input class="qty-input" type="number" id="qset-${pid_esc}" placeholder="${p.current_stock}" min="0" inputmode="numeric" />
        <button class="apply-btn set" onclick="quickSet('${pid_esc}')">설정</button>
      </div>`;
    }).join('');
  }

  // 매진 임박
  const alertItems = state.products.filter(p => p.current_stock >= 0 && p.current_stock <= (p.threshold!=null?p.threshold:def)*2);
  const as = document.getElementById('alertSection');
  const ag = document.getElementById('alertGrid');
  if (alertItems.length) {
    as.style.display='block';
    ag.innerHTML = alertItems.map(p => {
      const pid = getPid(p);
      const th = p.threshold!=null?p.threshold:def;
      const cls = p.current_stock<=th?'danger':'warning';
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="soldout-item">
        <div>
          <div class="soldout-name">${p.item_name}</div>
          <div class="soldout-stock ${cls}">${p.current_stock<=0?'매진':`${p.current_stock}개 남음`}</div>
        </div>
        <button class="btn-soldout" onclick="markSoldout('${pid_esc}')">매진 처리</button>
      </div>`;
    }).join('');
  } else { as.style.display='none'; }
}

async function quickAdd(pid) {
  const inp = document.getElementById('qadd-' + pid);
  const qty = parseInt(inp?.value);
  if (!qty||qty<=0) { showToast('수량을 입력해주세요'); return; }
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  p.current_stock += qty;
  if (p.current_stock>0) p.soldout_at=null;
  addHistory({ type:'add', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty, note:'입력 페이지' });
  await saveData();
  renderAll();
  showToast(`${p.item_name} +${qty}개 추가됨`);
}

async function quickSet(pid) {
  const inp = document.getElementById('qset-' + pid);
  const qty = parseInt(inp?.value);
  if (qty===undefined||isNaN(qty)||qty<0) { showToast('수량을 입력해주세요'); return; }
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  const prev = p.current_stock;
  p.current_stock = qty;
  if (qty>0) p.soldout_at=null;
  const diff = qty - prev;
  addHistory({ type: diff>=0?'add':'minus', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:Math.abs(diff), note:`직접 설정 (${prev}→${qty})` });
  await saveData();
  renderAll();
  showToast(`${p.item_name} → ${qty}개로 설정됨`);
}

async function markSoldout(pid) {
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  p.current_stock = 0;
  p.soldout_at = nowStr();
  addHistory({ type:'soldout', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:0, note:'매진 처리' });
  await saveData();
  renderAll();
  showToast(`${p.item_name} 매진 처리됨`);
}

async function addNewProduct() {
  const name = document.getElementById('np-name').value.trim();
  const code = document.getElementById('np-code').value.trim();
  const stock = parseInt(document.getElementById('np-stock').value)||0;
  const thVal = document.getElementById('np-threshold').value;
  const threshold = thVal!==''?parseInt(thVal):null;
  if (!name) { showToast('상품명을 입력해주세요'); return; }
  if (code && state.products.find(p => p.item_code&&p.item_code===code)) {
    showToast('이미 등록된 상품 코드입니다'); return;
  }
  const newP = { _id:'p_'+Date.now(), item_code:code, item_name:name, current_stock:stock, threshold, soldout_at:null };
  state.products.push(newP);
  addHistory({ type:'init', _id:newP._id, item_code:code, item_name:name, qty:stock, note:'신규 등록' });
  await saveData();
  ['np-name','np-code','np-threshold'].forEach(id => document.getElementById(id).value='');
  document.getElementById('np-stock').value='';
  renderAll();
  showToast(`'${name}' 등록 완료`);
}

let toastTimer=null;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

async function init() { await loadData(); renderAll(); }
init();
</script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>
</body>
</html>
