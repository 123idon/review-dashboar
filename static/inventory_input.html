<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>재고 입력 — 백년화편</title>
  <style>
/* ═══════════════════════════════════════════════════════════
   토스 디자인 시스템 — 백년화편 퍼스널 컬러
   퍼스널 컬러: 따뜻한 떡 브랜드 → 오렌지/앰버 계열 accent
   ═══════════════════════════════════════════════════════════ */

/* ── 라이트 모드 ── */
[data-theme="day"] {
  --bg:           #F9FAFB;
  --bg2:          #F2F4F6;
  --surface:      #FFFFFF;
  --surface2:     #F9FAFB;
  --border:       #E5E8EB;
  --border2:      #CDD1D8;

  --text:         #191F28;
  --text2:        #333D4B;
  --text3:        #6B7684;
  --text4:        #B0B8C1;

  /* 퍼스널 컬러: 백년화편 = 따뜻한 앰버/오렌지 */
  --brand:        #F5820D;
  --brand-light:  #FFF4E6;
  --brand-dark:   #D96E00;
  --brand-rgb:    245,130,13;

  --blue:         #3182F6;
  --blue-light:   #EBF3FE;
  --blue-rgb:     49,130,246;

  --red:          #F04452;
  --red-light:    #FFF0F0;
  --green:        #00A86B;
  --green-light:  #E8FAF4;
  --purple:       #6C47FF;
  --purple-light: #F3F0FF;
  --teal:         #00BCD4;
  --teal-light:   #E6F9FC;
  --amber:        #F59E0B;
  --amber-light:  #FFFAEB;

  --shadow-xs: 0 1px 2px rgba(0,0,0,.05);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.10), 0 4px 12px rgba(0,0,0,.06);
  --shadow-xl: 0 20px 60px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08);
  --shadow-brand: 0 4px 16px rgba(var(--brand-rgb),.25);
  --shadow-blue:  0 4px 16px rgba(var(--blue-rgb),.25);
}

/* ── 다크 모드 ── */
[data-theme="night"] {
  --bg:           #0E1117;
  --bg2:          #161B25;
  --surface:      #1A2130;
  --surface2:     #212B3D;
  --border:       #2A3547;
  --border2:      #3A4A60;

  --text:         #F2F4F6;
  --text2:        #C8D0DA;
  --text3:        #7A8899;
  --text4:        #3F5068;

  --brand:        #FF9A30;
  --brand-light:  rgba(255,154,48,.14);
  --brand-dark:   #FFB558;
  --brand-rgb:    255,154,48;

  --blue:         #4D9BFF;
  --blue-light:   rgba(77,155,255,.14);
  --blue-rgb:     77,155,255;

  --red:          #FF6B75;
  --red-light:    rgba(255,107,117,.14);
  --green:        #1FC791;
  --green-light:  rgba(31,199,145,.14);
  --purple:       #8B6FFF;
  --purple-light: rgba(139,111,255,.14);
  --teal:         #22D3EE;
  --teal-light:   rgba(34,211,238,.14);
  --amber:        #FBB928;
  --amber-light:  rgba(251,185,40,.14);

  --shadow-xs: 0 1px 2px rgba(0,0,0,.2);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.5);
  --shadow-xl: 0 20px 60px rgba(0,0,0,.6);
  --shadow-brand: 0 4px 16px rgba(var(--brand-rgb),.3);
  --shadow-blue:  0 4px 16px rgba(var(--blue-rgb),.3);
}

/* ── 기본 리셋 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s ease, color 0.2s ease;
}

/* ── 타이포 스케일 ── */
.t-hero  { font-size: clamp(28px,5vw,42px); font-weight: 800; letter-spacing: -1.4px; line-height: 1.15; }
.t-title { font-size: 22px; font-weight: 800; letter-spacing: -.7px; }
.t-head  { font-size: 17px; font-weight: 700; letter-spacing: -.4px; }
.t-body  { font-size: 14px; font-weight: 400; line-height: 1.7; }
.t-label { font-size: 12px; font-weight: 600; }
.t-caption{ font-size: 11px; color: var(--text3); }
.t-mono  { font-family: 'SF Mono','JetBrains Mono','Fira Code',monospace; }
.t-num   { font-variant-numeric: tabular-nums; }

/* ── 토스 스탯 숫자 ── */
.stat-num {
  font-size: 32px; font-weight: 800;
  letter-spacing: -1.8px; line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* ── 레이아웃 ── */
.page-wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
.section   { margin-bottom: 24px; }
.grid-2    { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3    { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.grid-4    { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

/* ── 카드 ── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  transition:
    border-color 200ms ease,
    box-shadow 200ms ease,
    transform 200ms cubic-bezier(0.34,1.56,0.64,1);
}
.card:hover {
  border-color: var(--border2);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.card-title {
  font-size: 13px; font-weight: 700;
  color: var(--text2); margin-bottom: 14px; letter-spacing: -.2px;
}

/* ── 버튼 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 22px;
  border-radius: 50px; border: none;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: all 150ms cubic-bezier(0.16,1,0.3,1);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--brand); color: #fff;
  box-shadow: var(--shadow-brand);
}
.btn-primary:hover { background: var(--brand-dark); box-shadow: 0 6px 20px rgba(var(--brand-rgb),.4); transform: translateY(-1px); }
.btn-blue { background: var(--blue); color: #fff; box-shadow: var(--shadow-blue); }
.btn-blue:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
.btn-ghost:hover { border-color: var(--border2); background: var(--surface2); }
.btn-sm { height: 32px; padding: 0 14px; font-size: 12px; border-radius: 50px; }
.btn-xs { height: 26px; padding: 0 10px; font-size: 11px; border-radius: 50px; }

/* ── 입력 ── */
.input {
  width: 100%; height: 48px; padding: 0 14px;
  background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
.input-sm { height: 36px; font-size: 13px; border-radius: 10px; }
textarea.input { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.6; }

/* ── 배지/칩 ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 9px; border-radius: 50px;
  font-size: 10px; font-weight: 700; letter-spacing: .4px;
}
.badge-brand  { background: var(--brand-light);  color: var(--brand); }
.badge-blue   { background: var(--blue-light);   color: var(--blue); }
.badge-green  { background: var(--green-light);  color: var(--green); }
.badge-red    { background: var(--red-light);    color: var(--red); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-amber  { background: var(--amber-light);  color: var(--amber); }
.badge-teal   { background: var(--teal-light);   color: var(--teal); }
.badge-gray   { background: var(--surface2);     color: var(--text3); }

/* ── 라이브 배지 ── */
.live-dot {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 9px; border-radius: 50px;
  background: var(--green-light); color: var(--green);
  font-size: 10px; font-weight: 700;
}
.live-dot::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.5; transform:scale(.75); }
}

/* ── 공통 네비 헤더 ── */
.app-header {
  position: sticky; top: 0; z-index: 200;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  box-shadow: var(--shadow-xs);
  transition: background .2s ease, border-color .2s ease;
}
.app-header-left  { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.app-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  box-shadow: 0 2px 8px rgba(var(--brand-rgb),.35);
}
.brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.4px; }
.brand-sub  { font-size: 10px; color: var(--text4); letter-spacing: .5px; text-transform: uppercase; }

/* 뒤로가기 버튼 */
.back-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 12px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-size: 12px; font-weight: 600; color: var(--text3);
  text-decoration: none; cursor: pointer;
  transition: all 150ms ease;
  flex-shrink: 0;
}
.back-link:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
.back-link svg { width: 14px; height: 14px; stroke: currentColor; flex-shrink: 0; }

/* ── 탭 ── */
.tab-group {
  display: flex; background: var(--bg2);
  border-radius: 10px; padding: 3px; gap: 2px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-group::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; height: 30px; padding: 0 14px;
  border-radius: 8px; border: none; background: transparent;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--text3); cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}
.tab:hover { color: var(--text2); }
.tab.active {
  background: var(--surface); color: var(--brand);
  box-shadow: var(--shadow-sm);
}

/* ── 필터 바 ── */
.filter-pill {
  height: 30px; padding: 0 13px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--text3); cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}
.filter-pill:hover { border-color: var(--brand); color: var(--brand); }
.filter-pill.active {
  background: var(--brand); border-color: var(--brand); color: #fff;
  box-shadow: var(--shadow-brand);
}

/* ── 토스트 ── */
.toast-msg {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg);
  font-size: 13px; font-weight: 600;
  padding: 11px 22px; border-radius: 50px;
  opacity: 0; pointer-events: none; z-index: 9999;
  white-space: nowrap;
  transition: opacity 200ms ease, transform 200ms cubic-bezier(0.34,1.56,0.64,1);
}
.toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 테마 버튼 ── */
.theme-btn {
  position: fixed; bottom: 22px; left: 20px; z-index: 999;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text3);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: transform 200ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 150ms ease;
  -webkit-tap-highlight-color: transparent;
}
.theme-btn:hover  { transform: scale(1.1); box-shadow: var(--shadow-md); }
.theme-btn:active { transform: scale(0.93); }

/* ── 플로팅 메모 버튼 ── */
.memo-fab {
  position: fixed; bottom: 22px; right: 22px; z-index: 900;
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-brand);
  transition: transform 250ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color: transparent;
}
.memo-fab:hover  { transform: scale(1.08) rotate(-5deg); box-shadow: 0 8px 24px rgba(var(--brand-rgb),.45); }
.memo-fab:active { transform: scale(0.94); }
.mp-badge {
  position: absolute; top: 5px; right: 5px;
  min-width: 17px; height: 17px; padding: 0 4px;
  background: var(--red); color: #fff;
  font-size: 9px; font-weight: 800; border-radius: 50px;
  border: 2.5px solid var(--surface);
  display: none; align-items: center; justify-content: center;
}
.mp-badge.show { display: flex; }

/* ── 메모 패널 ── */
.memo-panel {
  position: fixed; bottom: 84px; right: 22px; z-index: 901;
  width: 340px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-xl);
  overflow: hidden;
  transform: scale(.88) translateY(14px);
  transform-origin: bottom right;
  opacity: 0; pointer-events: none;
  transition:
    transform 280ms cubic-bezier(0.34,1.56,0.64,1),
    opacity 200ms ease;
}
.memo-panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
.mp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.mp-title { font-size: 14px; font-weight: 700; letter-spacing: -.3px; }
.mp-close {
  width: 26px; height: 26px; border-radius: 50%;
  border: none; background: var(--bg2); color: var(--text3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 150ms ease;
}
.mp-close:hover { background: var(--border); color: var(--text); }
.mp-body { padding: 14px 18px; }
.mp-textarea {
  width: 100%; padding: 11px 13px;
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-family: inherit; font-size: 13px; line-height: 1.6;
  resize: none; outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
.mp-save {
  width: 100%; height: 38px; margin-top: 8px;
  border-radius: 50px; border: none;
  background: var(--brand); color: #fff;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: all 150ms ease;
}
.mp-save:hover   { background: var(--brand-dark); }
.mp-save:active  { transform: scale(.98); }
.mp-save:disabled{ opacity: .5; cursor: not-allowed; }
.mp-list { max-height: 260px; overflow-y: auto; margin-top: 10px; scrollbar-width: thin; }
.mp-card { padding: 10px 0; border-bottom: 1px solid var(--border); }
.mp-card:last-child { border-bottom: none; }
.mp-card-text  { font-size: 13px; color: var(--text2); line-height: 1.6; }
.mp-card-footer{ display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
.mp-card-date  { font-size: 10px; color: var(--text4); font-variant-numeric: tabular-nums; }
.mp-del-btn {
  height: 22px; padding: 0 9px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-size: 10px; font-weight: 600; color: var(--text4); cursor: pointer;
  transition: all 150ms ease;
}
.mp-del-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
.mp-empty { font-size: 12px; color: var(--text4); text-align: center; padding: 20px 0; }
.mp-toast {
  position: fixed; bottom: 88px; right: 80px; z-index: 902;
  background: var(--text); color: var(--bg);
  font-size: 12px; font-weight: 700;
  padding: 8px 16px; border-radius: 50px;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: all 200ms ease;
}
.mp-toast.show { opacity: 1; transform: translateY(0); }

/* ── 스켈레톤 ── */
.skeleton {
  border-radius: 8px;
  background: linear-gradient(
    90deg,
    var(--surface2) 25%,
    var(--border) 50%,
    var(--surface2) 75%
  );
  background-size: 400px 100%;
  animation: skeleton-shine 1.4s ease-in-out infinite;
}
@keyframes skeleton-shine {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}

/* ── 프로그레스 바 ── */
.progress-rail { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 9999; pointer-events: none; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* ── 분리선 ── */
.divider { height: 1px; background: var(--border); margin: 0; }

/* ── 공통 애니메이션 ── */
@keyframes fade-up   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-down { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-in   { from { opacity:0; } to { opacity:1; } }
@keyframes scale-in  { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:scale(1); } }
@keyframes spin      { to { transform: rotate(360deg); } }

.anim-up   { animation: fade-up   280ms cubic-bezier(0.16,1,0.3,1) both; }
.anim-down { animation: fade-down 280ms cubic-bezier(0.16,1,0.3,1) both; }
.anim-in   { animation: fade-in   220ms ease both; }

/* 순차 딜레이 */
.d1 { animation-delay: .06s; }
.d2 { animation-delay: .12s; }
.d3 { animation-delay: .18s; }
.d4 { animation-delay: .24s; }
.d5 { animation-delay: .30s; }

/* ── 스피너 ── */
.spinner {
  width: 24px; height: 24px;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* ── 모바일 공통 ── */
@media (max-width: 480px) {
  .memo-panel { width: calc(100vw - 28px); right: 14px; bottom: 78px; }
  .memo-fab   { width: 48px; height: 48px; right: 16px; bottom: 18px; }
  .page-wrap  { padding: 16px 14px 80px; }
}

/* inventory_input 전용 */
.ii-body { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }
.form-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 14px; transition: box-shadow .2s ease; }
.form-card:hover { box-shadow: var(--shadow-sm); }
.form-title { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 16px; letter-spacing: -.3px; }
.form-group { margin-bottom: 13px; }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 5px; }
.form-input { width: 100%; height: 42px; padding: 0 13px; border: 1.5px solid var(--border); border-radius: 11px; background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; }
.form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-light); }
select.form-input { cursor: pointer; }
.form-row { display: flex; gap: 8px; }
.form-btn { height: 44px; padding: 0 22px; border-radius: 50px; border: none; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 150ms ease; }
.fb-primary { background: var(--teal); color: #fff; box-shadow: 0 2px 10px rgba(0,188,212,.3); }
.fb-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
.fb-primary:active { transform: scale(.97); }
.fb-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
.fb-ghost:hover { border-color: var(--border2); background: var(--surface2); }
.prod-table { width: 100%; }
.prod-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.prod-row:last-child { border-bottom: none; }
.prod-name  { flex: 1; font-size: 13px; font-weight: 600; }
.prod-stock { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.prod-stock.low { color: var(--red); }
.prod-actions { display: flex; gap: 5px; }
.mini-btn { height: 28px; padding: 0 11px; border-radius: 50px; border: 1.5px solid var(--border); background: transparent; font-size: 11px; font-weight: 700; color: var(--text3); cursor: pointer; transition: all 150ms ease; }
.mini-btn:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }
.mini-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
.toast-msg { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; padding: 10px 22px; border-radius: 50px; opacity: 0; pointer-events: none; z-index: 9999; transition: all 200ms ease; }
.toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width:400px) { .ii-body { padding: 16px 14px 80px; } }

</style>
<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function __themeInit() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>
</head>
<body>

<header>
  <div class="header-info">
    <div class="title">📝 재고 입력</div>
    <div class="sub">수량 입력 후 적용 버튼을 눌러주세요</div>
  </div>
</header>

<div class="content">

  <!-- 빠른 추가 입력 -->
  <div class="section">
    <div class="section-title">⚡ 빠른 추가 입력</div>
    <div class="product-grid" id="quickGrid">
      <div class="empty">상품을 불러오는 중...</div>
    </div>
  </div>

  <!-- 재고 직접 설정 (초기화/덮어쓰기) -->
  <div class="section">
    <div class="section-title">🔧 재고 직접 설정 <span style="font-size:11px;color:var(--text3);font-weight:400">현재 수량을 해당 숫자로 교체</span></div>
    <div class="product-grid" id="setGrid">
      <div class="empty">상품을 불러오는 중...</div>
    </div>
  </div>

  <!-- 매진 임박 상품 -->
  <div class="section" id="alertSection" style="display:none">
    <div class="section-title">⚠️ 매진 임박 / 매진 상품</div>
    <div class="soldout-grid" id="alertGrid"></div>
  </div>

  <!-- 신규 상품 등록 -->
  <div class="section">
    <div class="section-title">➕ 신규 상품 등록</div>
    <div class="new-product-form">
      <div class="form-group">
        <label class="form-label">상품명 *</label>
        <input class="form-input" id="np-name" placeholder="예: 백설기" autocomplete="off" />
      </div>
      <div style="display:flex;gap:8px">
        <div class="form-group">
          <label class="form-label">상품 코드 (선택)</label>
          <input class="form-input" id="np-code" placeholder="EasyPOS 코드" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label">초기 재고</label>
          <input class="form-input" type="number" id="np-stock" placeholder="0" min="0" inputmode="numeric" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">매진 임박 기준 (개) — 비우면 기본값</label>
        <input class="form-input" type="number" id="np-threshold" placeholder="기본값 사용" min="1" inputmode="numeric" />
      </div>
      <button class="btn-primary" onclick="addNewProduct()">상품 등록</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
function nowStr() {
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const DEFAULT_STATE = () => ({ products:[], history:[], settings:{ hd_code:'HYW', sp_code:'', alert_threshold:10, warning_threshold:20 } });
let state = DEFAULT_STATE();

function getPid(p) { return p.item_code || p._id; }

async function loadData() {
  try {
    const r = await fetch('/api/inventory');
    if (!r.ok) throw new Error();
    const d = await r.json();
    (d.products||[]).forEach((p,i) => { if (!p._id) p._id='p_'+Date.now()+'_'+i; });
    state = { ...DEFAULT_STATE(), ...d };
    state.settings = { ...DEFAULT_STATE().settings, ...(d.settings||{}) };
  } catch(e) {}
}

async function saveData() {
  try {
    await fetch('/api/inventory', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state) });
  } catch(e) {}
}

function addHistory(entry) {
  if (!state.history) state.history=[];
  state.history.push({...entry, datetime:nowStr()});
  if (state.history.length>500) state.history=state.history.slice(-500);
}

function renderAll() {
  const def = state.settings.alert_threshold||10;
  const warn = state.settings.warning_threshold||(def*2);

  // 빠른 추가 입력
  const qg = document.getElementById('quickGrid');
  if (!state.products.length) {
    qg.innerHTML = '<div class="empty">등록된 상품이 없습니다. 아래에서 신규 상품을 등록해주세요.</div>';
  } else {
    qg.innerHTML = state.products.map(p => {
      const pid = getPid(p);
      const th = p.threshold!=null?p.threshold:def;
      const cls = p.current_stock<=0?'no-stock':p.current_stock<=th?'low-stock':'';
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="product-row ${cls}">
        <div>
          <div class="prow-name">${p.item_name}</div>
          <div class="prow-stock">현재: ${p.current_stock}개</div>
        </div>
        <input class="qty-input" type="number" id="qadd-${pid_esc}" placeholder="수량" min="1" inputmode="numeric" />
        <button class="apply-btn add" onclick="quickAdd('${pid_esc}')">추가</button>
      </div>`;
    }).join('');
  }

  // 직접 설정
  const sg = document.getElementById('setGrid');
  if (!state.products.length) {
    sg.innerHTML = '<div class="empty">등록된 상품이 없습니다.</div>';
  } else {
    sg.innerHTML = state.products.map(p => {
      const pid = getPid(p);
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="product-row">
        <div>
          <div class="prow-name">${p.item_name}</div>
          <div class="prow-stock">현재: ${p.current_stock}개</div>
        </div>
        <input class="qty-input" type="number" id="qset-${pid_esc}" placeholder="${p.current_stock}" min="0" inputmode="numeric" />
        <button class="apply-btn set" onclick="quickSet('${pid_esc}')">설정</button>
      </div>`;
    }).join('');
  }

  // 매진 임박
  const alertItems = state.products.filter(p => p.current_stock >= 0 && p.current_stock <= (p.threshold!=null?p.threshold:def)*2);
  const as = document.getElementById('alertSection');
  const ag = document.getElementById('alertGrid');
  if (alertItems.length) {
    as.style.display='block';
    ag.innerHTML = alertItems.map(p => {
      const pid = getPid(p);
      const th = p.threshold!=null?p.threshold:def;
      const cls = p.current_stock<=th?'danger':'warning';
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="soldout-item">
        <div>
          <div class="soldout-name">${p.item_name}</div>
          <div class="soldout-stock ${cls}">${p.current_stock<=0?'매진':`${p.current_stock}개 남음`}</div>
        </div>
        <button class="btn-soldout" onclick="markSoldout('${pid_esc}')">매진 처리</button>
      </div>`;
    }).join('');
  } else { as.style.display='none'; }
}

async function quickAdd(pid) {
  const inp = document.getElementById('qadd-' + pid);
  const qty = parseInt(inp?.value);
  if (!qty||qty<=0) { showToast('수량을 입력해주세요'); return; }
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  p.current_stock += qty;
  if (p.current_stock>0) p.soldout_at=null;
  addHistory({ type:'add', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty, note:'입력 페이지' });
  await saveData();
  renderAll();
  showToast(`${p.item_name} +${qty}개 추가됨`);
}

async function quickSet(pid) {
  const inp = document.getElementById('qset-' + pid);
  const qty = parseInt(inp?.value);
  if (qty===undefined||isNaN(qty)||qty<0) { showToast('수량을 입력해주세요'); return; }
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  const prev = p.current_stock;
  p.current_stock = qty;
  if (qty>0) p.soldout_at=null;
  const diff = qty - prev;
  addHistory({ type: diff>=0?'add':'minus', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:Math.abs(diff), note:`직접 설정 (${prev}→${qty})` });
  await saveData();
  renderAll();
  showToast(`${p.item_name} → ${qty}개로 설정됨`);
}

async function markSoldout(pid) {
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  p.current_stock = 0;
  p.soldout_at = nowStr();
  addHistory({ type:'soldout', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:0, note:'매진 처리' });
  await saveData();
  renderAll();
  showToast(`${p.item_name} 매진 처리됨`);
}

async function addNewProduct() {
  const name = document.getElementById('np-name').value.trim();
  const code = document.getElementById('np-code').value.trim();
  const stock = parseInt(document.getElementById('np-stock').value)||0;
  const thVal = document.getElementById('np-threshold').value;
  const threshold = thVal!==''?parseInt(thVal):null;
  if (!name) { showToast('상품명을 입력해주세요'); return; }
  if (code && state.products.find(p => p.item_code&&p.item_code===code)) {
    showToast('이미 등록된 상품 코드입니다'); return;
  }
  const newP = { _id:'p_'+Date.now(), item_code:code, item_name:name, current_stock:stock, threshold, soldout_at:null };
  state.products.push(newP);
  addHistory({ type:'init', _id:newP._id, item_code:code, item_name:name, qty:stock, note:'신규 등록' });
  await saveData();
  ['np-name','np-code','np-threshold'].forEach(id => document.getElementById(id).value='');
  document.getElementById('np-stock').value='';
  renderAll();
  showToast(`'${name}' 등록 완료`);
}

let toastTimer=null;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

async function init() { await loadData(); renderAll(); }
init();
</script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>
</body>
</html>
