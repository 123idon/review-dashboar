<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>재고 입력 — 백년화편</title>
  <style>
:root {
  /* ── 토스 컬러 시스템 ── */
  --bg:        #f9fafb;
  --surface:   #ffffff;
  --surface2:  #f2f4f6;
  --border:    #e5e8eb;
  --border2:   #d1d6db;

  --text:      #191f28;
  --text2:     #333d4b;
  --text3:     #6b7684;
  --text4:     #b0b8c1;

  --primary:        #3182f6;
  --primary-light:  #ebf3fe;
  --primary-dark:   #1b64da;

  --red:        #f04452;
  --red-light:  #fff0f0;
  --green:      #00a86b;
  --green-light:#e8faf4;
  --orange:     #ff6b00;
  --orange-light:#fff4eb;
  --yellow:     #f5a623;
  --yellow-light:#fffaeb;
  --purple:     #6c47ff;
  --purple-light:#f3f0ff;
  --teal:       #00bcd4;
  --teal-light: #e6f9fc;

  /* ── 그림자 ── */
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md:  0 4px 16px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
  --shadow-xl:  0 16px 48px rgba(0,0,0,.14), 0 8px 24px rgba(0,0,0,.08);

  /* ── 반경 ── */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-pill:50px;

  /* ── 폰트 ── */
  --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* ── 애니메이션 ── */
  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-in-out: cubic-bezier(0.45,0,0.55,1);
  --duration-fast:  150ms;
  --duration-base:  220ms;
  --duration-slow:  350ms;
}

html.night {
  --bg:        #131820;
  --surface:   #1c2330;
  --surface2:  #242e3d;
  --border:    #2d3a4a;
  --border2:   #3d4e62;
  --text:      #f2f4f6;
  --text2:     #d0d7e0;
  --text3:     #8b95a1;
  --text4:     #4e5968;
  --primary:        #4593fc;
  --primary-light:  rgba(69,147,252,0.15);
  --primary-dark:   #6aadff;
  --red:        #ff6b6b;
  --red-light:  rgba(240,68,82,0.15);
  --green:      #20c997;
  --green-light:rgba(0,168,107,0.15);
  --shadow-sm:  0 1px 4px rgba(0,0,0,.3);
  --shadow-md:  0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.5);
}

    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);gap:10px;}
    .header-left{display:flex;align-items:center;gap:10px;}
    .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--teal),var(--primary));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;}
    .page-title{font-size:15px;font-weight:800;letter-spacing:-.4px;}
    .back-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text3);text-decoration:none;padding:6px 14px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface);transition:all var(--duration-fast) var(--ease-out);flex-shrink:0;}
    .back-btn:hover{border-color:var(--primary);color:var(--primary);}
    .main{max-width:560px;margin:0 auto;padding:24px 20px 64px;}
    .card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;transition:box-shadow var(--duration-base) var(--ease-out);}
    .card:hover{box-shadow:var(--shadow-sm);}
    .card-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;letter-spacing:-.2px;}
    .form-group{margin-bottom:14px;}
    label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;}
    input,select{width:100%;height:40px;padding:0 12px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out);}
    input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .btn{height:44px;padding:0 20px;border-radius:var(--r-pill);border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all var(--duration-fast) var(--ease-out);}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(49,130,246,.25);}
    .btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 16px rgba(49,130,246,.35);transform:translateY(-1px);}
    .btn-primary:active{transform:scale(.97);}
    .btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border);}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .product-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
    .product-item:last-child{border-bottom:none;}
    .product-name{font-size:13px;font-weight:600;}
    .product-stock{font-size:12px;color:var(--text3);font-family:var(--mono);}
    .stock-low{color:var(--red);font-weight:700;}
    .action-btns{display:flex;gap:6px;}
    .mini-btn{height:28px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface);font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;font-family:var(--font);transition:all var(--duration-fast) var(--ease-out);}
    .mini-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
    .mini-btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-light);}
    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:10px 20px;border-radius:var(--r-pill);opacity:0;transition:all var(--duration-base) var(--ease-out);z-index:9000;white-space:nowrap;pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .theme-toggle{position:fixed;bottom:20px;left:20px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:999;box-shadow:var(--shadow-sm);transition:transform var(--duration-fast) var(--spring),box-shadow var(--duration-fast) var(--ease-out);-webkit-tap-highlight-color:transparent;}
    .theme-toggle:hover{transform:scale(1.08);box-shadow:var(--shadow-md);}
    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:400px){.main{padding:16px 14px 64px;}}

</style>
<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function __themeInit() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>
</head>
<body>

<header>
  <div class="header-info">
    <div class="title">📝 재고 입력</div>
    <div class="sub">수량 입력 후 적용 버튼을 눌러주세요</div>
  </div>
</header>

<div class="content">

  <!-- 빠른 추가 입력 -->
  <div class="section">
    <div class="section-title">⚡ 빠른 추가 입력</div>
    <div class="product-grid" id="quickGrid">
      <div class="empty">상품을 불러오는 중...</div>
    </div>
  </div>

  <!-- 재고 직접 설정 (초기화/덮어쓰기) -->
  <div class="section">
    <div class="section-title">🔧 재고 직접 설정 <span style="font-size:11px;color:var(--text3);font-weight:400">현재 수량을 해당 숫자로 교체</span></div>
    <div class="product-grid" id="setGrid">
      <div class="empty">상품을 불러오는 중...</div>
    </div>
  </div>

  <!-- 매진 임박 상품 -->
  <div class="section" id="alertSection" style="display:none">
    <div class="section-title">⚠️ 매진 임박 / 매진 상품</div>
    <div class="soldout-grid" id="alertGrid"></div>
  </div>

  <!-- 신규 상품 등록 -->
  <div class="section">
    <div class="section-title">➕ 신규 상품 등록</div>
    <div class="new-product-form">
      <div class="form-group">
        <label class="form-label">상품명 *</label>
        <input class="form-input" id="np-name" placeholder="예: 백설기" autocomplete="off" />
      </div>
      <div style="display:flex;gap:8px">
        <div class="form-group">
          <label class="form-label">상품 코드 (선택)</label>
          <input class="form-input" id="np-code" placeholder="EasyPOS 코드" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label">초기 재고</label>
          <input class="form-input" type="number" id="np-stock" placeholder="0" min="0" inputmode="numeric" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">매진 임박 기준 (개) — 비우면 기본값</label>
        <input class="form-input" type="number" id="np-threshold" placeholder="기본값 사용" min="1" inputmode="numeric" />
      </div>
      <button class="btn-primary" onclick="addNewProduct()">상품 등록</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
function nowStr() {
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const DEFAULT_STATE = () => ({ products:[], history:[], settings:{ hd_code:'HYW', sp_code:'', alert_threshold:10, warning_threshold:20 } });
let state = DEFAULT_STATE();

function getPid(p) { return p.item_code || p._id; }

async function loadData() {
  try {
    const r = await fetch('/api/inventory');
    if (!r.ok) throw new Error();
    const d = await r.json();
    (d.products||[]).forEach((p,i) => { if (!p._id) p._id='p_'+Date.now()+'_'+i; });
    state = { ...DEFAULT_STATE(), ...d };
    state.settings = { ...DEFAULT_STATE().settings, ...(d.settings||{}) };
  } catch(e) {}
}

async function saveData() {
  try {
    await fetch('/api/inventory', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state) });
  } catch(e) {}
}

function addHistory(entry) {
  if (!state.history) state.history=[];
  state.history.push({...entry, datetime:nowStr()});
  if (state.history.length>500) state.history=state.history.slice(-500);
}

function renderAll() {
  const def = state.settings.alert_threshold||10;
  const warn = state.settings.warning_threshold||(def*2);

  // 빠른 추가 입력
  const qg = document.getElementById('quickGrid');
  if (!state.products.length) {
    qg.innerHTML = '<div class="empty">등록된 상품이 없습니다. 아래에서 신규 상품을 등록해주세요.</div>';
  } else {
    qg.innerHTML = state.products.map(p => {
      const pid = getPid(p);
      const th = p.threshold!=null?p.threshold:def;
      const cls = p.current_stock<=0?'no-stock':p.current_stock<=th?'low-stock':'';
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="product-row ${cls}">
        <div>
          <div class="prow-name">${p.item_name}</div>
          <div class="prow-stock">현재: ${p.current_stock}개</div>
        </div>
        <input class="qty-input" type="number" id="qadd-${pid_esc}" placeholder="수량" min="1" inputmode="numeric" />
        <button class="apply-btn add" onclick="quickAdd('${pid_esc}')">추가</button>
      </div>`;
    }).join('');
  }

  // 직접 설정
  const sg = document.getElementById('setGrid');
  if (!state.products.length) {
    sg.innerHTML = '<div class="empty">등록된 상품이 없습니다.</div>';
  } else {
    sg.innerHTML = state.products.map(p => {
      const pid = getPid(p);
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="product-row">
        <div>
          <div class="prow-name">${p.item_name}</div>
          <div class="prow-stock">현재: ${p.current_stock}개</div>
        </div>
        <input class="qty-input" type="number" id="qset-${pid_esc}" placeholder="${p.current_stock}" min="0" inputmode="numeric" />
        <button class="apply-btn set" onclick="quickSet('${pid_esc}')">설정</button>
      </div>`;
    }).join('');
  }

  // 매진 임박
  const alertItems = state.products.filter(p => p.current_stock >= 0 && p.current_stock <= (p.threshold!=null?p.threshold:def)*2);
  const as = document.getElementById('alertSection');
  const ag = document.getElementById('alertGrid');
  if (alertItems.length) {
    as.style.display='block';
    ag.innerHTML = alertItems.map(p => {
      const pid = getPid(p);
      const th = p.threshold!=null?p.threshold:def;
      const cls = p.current_stock<=th?'danger':'warning';
      const pid_esc = pid.replace(/'/g,"\\'");
      return `<div class="soldout-item">
        <div>
          <div class="soldout-name">${p.item_name}</div>
          <div class="soldout-stock ${cls}">${p.current_stock<=0?'매진':`${p.current_stock}개 남음`}</div>
        </div>
        <button class="btn-soldout" onclick="markSoldout('${pid_esc}')">매진 처리</button>
      </div>`;
    }).join('');
  } else { as.style.display='none'; }
}

async function quickAdd(pid) {
  const inp = document.getElementById('qadd-' + pid);
  const qty = parseInt(inp?.value);
  if (!qty||qty<=0) { showToast('수량을 입력해주세요'); return; }
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  p.current_stock += qty;
  if (p.current_stock>0) p.soldout_at=null;
  addHistory({ type:'add', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty, note:'입력 페이지' });
  await saveData();
  renderAll();
  showToast(`${p.item_name} +${qty}개 추가됨`);
}

async function quickSet(pid) {
  const inp = document.getElementById('qset-' + pid);
  const qty = parseInt(inp?.value);
  if (qty===undefined||isNaN(qty)||qty<0) { showToast('수량을 입력해주세요'); return; }
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  const prev = p.current_stock;
  p.current_stock = qty;
  if (qty>0) p.soldout_at=null;
  const diff = qty - prev;
  addHistory({ type: diff>=0?'add':'minus', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:Math.abs(diff), note:`직접 설정 (${prev}→${qty})` });
  await saveData();
  renderAll();
  showToast(`${p.item_name} → ${qty}개로 설정됨`);
}

async function markSoldout(pid) {
  const p = state.products.find(p => getPid(p)===pid);
  if (!p) return;
  p.current_stock = 0;
  p.soldout_at = nowStr();
  addHistory({ type:'soldout', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:0, note:'매진 처리' });
  await saveData();
  renderAll();
  showToast(`${p.item_name} 매진 처리됨`);
}

async function addNewProduct() {
  const name = document.getElementById('np-name').value.trim();
  const code = document.getElementById('np-code').value.trim();
  const stock = parseInt(document.getElementById('np-stock').value)||0;
  const thVal = document.getElementById('np-threshold').value;
  const threshold = thVal!==''?parseInt(thVal):null;
  if (!name) { showToast('상품명을 입력해주세요'); return; }
  if (code && state.products.find(p => p.item_code&&p.item_code===code)) {
    showToast('이미 등록된 상품 코드입니다'); return;
  }
  const newP = { _id:'p_'+Date.now(), item_code:code, item_name:name, current_stock:stock, threshold, soldout_at:null };
  state.products.push(newP);
  addHistory({ type:'init', _id:newP._id, item_code:code, item_name:name, qty:stock, note:'신규 등록' });
  await saveData();
  ['np-name','np-code','np-threshold'].forEach(id => document.getElementById(id).value='');
  document.getElementById('np-stock').value='';
  renderAll();
  showToast(`'${name}' 등록 완료`);
}

let toastTimer=null;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

async function init() { await loadData(); renderAll(); }
init();
</script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>
</body>
</html>
