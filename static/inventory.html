<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>재고 현황 — 백년화편</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --surface: #1a1f2e;
      --border: #1e293b;
      --border2: #334155;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --text4: #475569;
      --orange: #f97316;
      --green: #4ade80;
      --green-bg: rgba(34,197,94,0.1);
      --red: #f87171;
      --red-bg: rgba(239,68,68,0.1);
      --yellow: #fbbf24;
      --yellow-bg: rgba(251,191,36,0.1);
      --purple: #a78bfa;
      --purple-bg: rgba(139,92,246,0.08);
      --blue: #60a5fa;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      color: var(--text);
      overscroll-behavior: none;
    }

    /* ── 헤더 ── */
    header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      min-height: 56px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 5px;
      color: var(--text3); text-decoration: none; font-size: 13px;
      padding: 6px 10px; border-radius: 8px; flex-shrink: 0;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:hover, .back-btn:active { background: var(--border); color: var(--text); }
    .header-info { flex: 1; min-width: 0; }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .icon-btn {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text2); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover, .icon-btn:active { background: var(--border); color: var(--text); }
    .icon-btn.spinning svg { animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .api-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
      white-space: nowrap;
    }
    .api-pill.off { background: var(--red-bg); color: var(--red); }
    .api-pill.on  { background: var(--green-bg); color: var(--green); }

    /* ── 탭 ── */
    .tabs {
      display: flex; overflow-x: auto;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 12px 18px; font-size: 13px; font-weight: 600;
      color: var(--text3); cursor: pointer; border: none; background: none;
      white-space: nowrap; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--orange); }
    .tab:not(.active):hover { color: var(--text2); }

    /* ── 컨텐츠 ── */
    .content { padding: 20px; max-width: 1100px; margin: 0 auto; padding-bottom: 90px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── 요약 카드 ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-bottom: 20px;
    }
    .sum-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
    }
    .sum-card.c-green { border-color: rgba(34,197,94,.25); }
    .sum-card.c-red   { border-color: rgba(239,68,68,.25); }
    .sum-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .sum-value { font-size: 22px; font-weight: 800; }
    .sum-card.c-green .sum-value { color: var(--green); }
    .sum-card.c-red   .sum-value { color: var(--red); }

    /* ── 섹션 헤더 ── */
    .section-hd {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 10px;
    }
    .section-title { font-size: 13px; font-weight: 700; color: var(--text2); }
    .search-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px;
      color: var(--text); font-size: 13px; outline: none;
      width: 180px; transition: border-color .15s;
    }
    .search-box:focus { border-color: var(--border2); }

    /* ── 재고 카드형 (모바일) / 테이블형 (데스크톱) ── */
    .stock-table { width: 100%; border-collapse: collapse; }
    .stock-table th {
      text-align: left; padding: 9px 14px;
      font-size: 10px; font-weight: 600; color: var(--text4);
      letter-spacing: .5px; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .stock-table td {
      padding: 11px 14px; font-size: 13px;
      border-bottom: 1px solid rgba(30,41,59,.5);
      vertical-align: middle;
    }
    .stock-table tr:last-child td { border-bottom: none; }
    .stock-table tbody tr:hover td { background: rgba(255,255,255,.02); }

    .pname { font-weight: 600; font-size: 13px; }
    .pcode { font-size: 11px; color: var(--text4); margin-top: 1px; }

    .stock-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 700;
      padding: 3px 9px; border-radius: 20px;
    }
    .stock-badge.normal  { background: var(--green-bg); color: var(--green); }
    .stock-badge.warning { background: var(--yellow-bg); color: var(--yellow); }
    .stock-badge.danger  { background: var(--red-bg); color: var(--red); }
    .stock-badge.soldout { background: rgba(100,116,139,.12); color: var(--text3); }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    .th-badge { font-size: 11px; color: var(--text4); background: var(--border); border-radius: 4px; padding: 2px 6px; }
    .soldout-time { font-size: 11px; color: var(--red); margin-top: 2px; }

    .row-actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn-xs {
      padding: 4px 10px; border-radius: 6px; font-size: 11px;
      font-weight: 700; cursor: pointer; border: none;
      transition: opacity .15s; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-xs:active { opacity: .7; }
    .bxa { background: rgba(34,197,94,.15); color: var(--green); }
    .bxm { background: rgba(239,68,68,.15); color: var(--red); }
    .bxe { background: rgba(100,116,139,.15); color: var(--text2); }

    /* ── 모달 ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.65); z-index: 300;
      align-items: flex-end; justify-content: center;
      padding: 0;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px 20px 0 0; padding: 24px 20px 32px;
      width: 100%; max-width: 480px;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 11px; color: var(--text3); font-weight: 600; margin-bottom: 5px; display: block; letter-spacing: .3px; }
    .form-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 9px; padding: 11px 13px; color: var(--text);
      font-size: 14px; outline: none; transition: border-color .15s;
      -webkit-appearance: none;
    }
    .form-input:focus { border-color: var(--border2); }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .form-hint { font-size: 11px; color: var(--text4); margin-top: 4px; }

    .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
    .btn-primary {
      flex: 1; padding: 12px; border-radius: 10px;
      background: var(--orange); color: #fff; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: opacity .15s; -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { opacity: .85; }
    .btn-secondary {
      padding: 12px 20px; border-radius: 10px;
      background: var(--border); color: var(--text2); border: none;
      font-size: 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:active { opacity: .8; }

    /* ── 이력 ── */
    .filter-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-btn {
      padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text3);
      transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .filter-btn.active { border-color: var(--orange); color: var(--orange); background: rgba(249,115,22,.08); }

    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .h-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .h-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .h-dot.add    { background: var(--green); }
    .h-dot.minus  { background: var(--red); }
    .h-dot.soldout{ background: var(--text3); }
    .h-dot.init   { background: var(--blue); }
    .h-dot.pos    { background: var(--purple); }
    .h-info { flex: 1; min-width: 0; }
    .h-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-note { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .h-qty { font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .h-qty.p { color: var(--green); }
    .h-qty.m { color: var(--red); }
    .h-time { font-size: 10px; color: var(--text4); text-align: right; flex-shrink: 0; min-width: 70px; line-height: 1.4; }

    /* ── 차트 ── */
    .chart-controls { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .period-btn {
      padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text3);
      transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .period-btn.active { border-color: var(--purple); color: var(--purple); background: var(--purple-bg); }
    .product-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px;
      color: var(--text); font-size: 12px; outline: none;
      -webkit-appearance: none; cursor: pointer;
    }
    .chart-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 14px;
    }
    .chart-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 14px; }

    /* ── 설정 ── */
    .settings-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; margin-bottom: 14px;
    }
    .settings-block-title {
      font-size: 13px; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 7px;
    }
    .btn-save {
      padding: 10px 22px; border-radius: 9px;
      background: var(--orange); color: #fff; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-save:active { opacity: .85; }

    /* ── 빈 상태 ── */
    .empty { text-align: center; padding: 48px 20px; color: var(--text4); }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-text { font-size: 13px; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 24px; right: 20px;
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--orange); border: none; cursor: pointer;
      font-size: 22px; color: #fff;
      box-shadow: 0 4px 18px rgba(249,115,22,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .fab:active { transform: scale(.93); }

    /* ── 토스트 ── */
    .toast {
      position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
      background: #2d3748; color: var(--text); padding: 9px 18px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
      z-index: 400; opacity: 0; transition: opacity .25s;
      pointer-events: none; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    .toast.show { opacity: 1; }

    /* ── 데스크톱 모달 중앙 정렬 ── */
    @media (min-width: 600px) {
      .modal-overlay { align-items: center; padding: 20px; }
      .modal { border-radius: 20px; padding: 28px; max-height: 90vh; overflow-y: auto; }
      .modal-handle { display: none; }
    }

    /* ── 모바일 최적화 ── */
    @media (max-width: 599px) {
      .content { padding: 16px; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .sum-value { font-size: 20px; }
      /* 테이블 → 카드 변환 */
      .stock-table thead { display: none; }
      .stock-table, .stock-table tbody, .stock-table tr, .stock-table td { display: block; width: 100%; }
      .stock-table tr {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; margin-bottom: 8px; padding: 12px 14px;
      }
      .stock-table tr:hover td { background: none; }
      .stock-table td { border: none; padding: 2px 0; }
      .stock-table td::before {
        content: attr(data-label);
        font-size: 10px; color: var(--text4); font-weight: 600;
        text-transform: uppercase; letter-spacing: .4px;
        display: block; margin-bottom: 3px;
      }
      .stock-table td[data-label=""] { margin-top: 10px; }
      .row-actions { gap: 6px; }
      .btn-xs { padding: 6px 14px; font-size: 12px; }
      .search-box { width: 140px; }
      .api-pill { display: none; }
      .h-time { min-width: 60px; }
    }
  
  /* ── 주간/야간 자동 테마 ── */
  html.night {
    --th-bg:      #0f1117;
    --th-surface: #1a1f2e;
    --th-border:  #1e293b;
    --th-border2: #334155;
    --th-text:    #e2e8f0;
    --th-text2:   #94a3b8;
    --th-text3:   #64748b;
    --th-text4:   #475569;
  }
  html.day {
    --th-bg:      #f8f5f0;
    --th-surface: #ffffff;
    --th-border:  #e2d9cf;
    --th-border2: #c8b9a8;
    --th-text:    #1e1a14;
    --th-text2:   #5c4e3a;
    --th-text3:   #8a7a65;
    --th-text4:   #a8998a;
  }
  .theme-toggle {
    position: fixed; bottom: 20px; left: 20px;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--th-border, #1e293b);
    background: var(--th-surface, #1a1f2e);
    color: var(--th-text2, #94a3b8);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; z-index: 999;
    box-shadow: 0 2px 12px rgba(0,0,0,.2);
    transition: transform .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-toggle:active { transform: scale(.9); }
  .theme-toggle:hover  { opacity: .85; }

  
  /* ── 공통 메모 패널 ── */
  #memoFab {
    position: fixed; bottom: 24px; right: 24px; z-index: 900;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #eab308, #f59e0b);
    border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(234,179,8,.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; transition: transform .2s, box-shadow .2s;
  }
  #memoFab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(234,179,8,.55); }
  #memoFab .fab-badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; border-radius: 9px;
    background: #ef4444; color: #fff; font-size: 10px; font-weight: 700;
    display: none; align-items: center; justify-content: center; padding: 0 4px;
  }
  #memoFab .fab-badge.show { display: flex; }

  #memoPanel {
    position: fixed; bottom: 88px; right: 24px; z-index: 901;
    width: 340px; max-height: 520px;
    background: #1a1f2e; border: 1px solid #2d3748;
    border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
    transform: scale(.9) translateY(16px); opacity: 0;
    pointer-events: none; transition: transform .22s ease, opacity .22s ease;
    transform-origin: bottom right;
  }
  #memoPanel.open {
    transform: scale(1) translateY(0); opacity: 1; pointer-events: all;
  }
  .mp-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid #1e293b;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .mp-title {
    font-size: 14px; font-weight: 700; color: #e2e8f0;
    display: flex; align-items: center; gap: 6px;
  }
  .mp-title small { font-size: 10px; color: #475569; font-weight: 400; }
  .mp-close {
    width: 26px; height: 26px; border-radius: 8px;
    background: #2d3748; border: none; color: #94a3b8;
    cursor: pointer; font-size: 14px; display: flex;
    align-items: center; justify-content: center; transition: background .15s;
  }
  .mp-close:hover { background: #374151; color: #e2e8f0; }
  .mp-input-area {
    padding: 12px 14px; border-bottom: 1px solid #1e293b; flex-shrink: 0;
  }
  .mp-textarea {
    width: 100%; background: #0f1117; border: 1px solid #2d3748;
    border-radius: 10px; color: #e2e8f0; font-size: 13px;
    font-family: inherit; resize: none; outline: none;
    padding: 10px 12px; line-height: 1.6; min-height: 72px;
    transition: border-color .15s;
  }
  .mp-textarea:focus { border-color: rgba(234,179,8,.5); }
  .mp-textarea::placeholder { color: #334155; }
  .mp-input-footer {
    display: flex; align-items: center; justify-content: flex-end;
    margin-top: 8px; gap: 8px;
  }
  .mp-hint { font-size: 11px; color: #334155; flex: 1; }
  .mp-save-btn {
    padding: 6px 16px; border-radius: 8px;
    background: linear-gradient(135deg, #eab308, #f59e0b);
    border: none; color: #0f1117; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: opacity .15s;
  }
  .mp-save-btn:hover { opacity: .85; }
  .mp-save-btn:disabled { opacity: .4; cursor: not-allowed; }
  .mp-list {
    overflow-y: auto; flex: 1; padding: 10px 12px;
  }
  .mp-list::-webkit-scrollbar { width: 4px; }
  .mp-list::-webkit-scrollbar-track { background: transparent; }
  .mp-list::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
  .mp-empty {
    text-align: center; padding: 28px 0; color: #334155; font-size: 13px;
  }
  .mp-card {
    background: #0f1117; border: 1px solid #1e293b;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    position: relative;
  }
  .mp-card-text {
    font-size: 13px; color: #cbd5e1; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
    margin-right: 20px;
  }
  .mp-card-date { font-size: 11px; color: #334155; margin-top: 5px; }
  .mp-del-btn {
    position: absolute; top: 8px; right: 8px;
    width: 20px; height: 20px; border-radius: 5px;
    background: transparent; border: none; color: #475569;
    cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .mp-del-btn:hover { background: rgba(239,68,68,.15); color: #f87171; }
  .mp-toast {
    position: fixed; bottom: 88px; right: 82px; z-index: 902;
    background: #1e293b; border: 1px solid #2d3748;
    color: #94a3b8; font-size: 12px; font-weight: 600;
    padding: 7px 14px; border-radius: 9px;

<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function init() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── 유틸 ──
function nowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── 상태 ──
const DEFAULT_STATE = () => ({
  products: [],
  history: [],
  settings: { hd_code:'HYW', sp_code:'', alert_threshold:10, warning_threshold:20, sync_interval:30 }
});
let state = DEFAULT_STATE();
let historyFilter = 'all';
let chartPeriod = 'daily';
let chartObj = null;
let editingId = null; // 상품 고유 id

// ── 상품 고유 ID ── item_code 있으면 사용, 없으면 _id(uuid-like)
function getPid(p) { return p.item_code || p._id; }

// ── 데이터 로드/저장 ──
async function loadData() {
  try {
    const r = await fetch('/api/inventory');
    if (!r.ok) throw new Error('fetch fail');
    const d = await r.json();
    // _id 없는 기존 상품 마이그레이션
    (d.products||[]).forEach((p,i) => { if (!p._id) p._id = 'p_' + Date.now() + '_' + i; });
    state = { ...DEFAULT_STATE(), ...d };
    state.settings = { ...DEFAULT_STATE().settings, ...(d.settings||{}) };
  } catch(e) { console.warn('loadData error', e); }
}

async function saveData() {
  try {
    await fetch('/api/inventory', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
  } catch(e) { console.warn('saveData error', e); }
}

// ── 새로고침 ──
async function handleRefresh(btn) {
  btn.classList.add('spinning');
  await loadData();
  renderAll();
  syncSettingsForm();
  btn.classList.remove('spinning');
  updateLastSync();
  showToast('새로고침 완료');
}

function updateLastSync() {
  document.getElementById('lastSync').textContent = '마지막 동기화: ' + nowStr();
}

// ── 탭 전환 ── (event 객체 대신 el 파라미터 사용)
function switchTab(name, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'chart') renderChart();
}

// ── 렌더 전체 ──
function renderAll() {
  renderTable();
  renderHistory();
  updateSummary();
  updateChartSelect();
}

// ── 요약 ──
function updateSummary() {
  const def = state.settings.alert_threshold || 10;
  let total=0, normal=0, alert=0, sold=0;
  state.products.forEach(p => {
    total++;
    const th = p.threshold != null ? p.threshold : def;
    if (p.current_stock <= 0) sold++;
    else if (p.current_stock <= th) alert++;
    else normal++;
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-normal').textContent = normal;
  document.getElementById('s-alert').textContent = alert;
  document.getElementById('s-sold').textContent = sold;
}

// ── 테이블 ──
function renderTable() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const def = state.settings.alert_threshold || 10;
  const warn = state.settings.warning_threshold || (def * 2);
  const tbody = document.getElementById('stockBody');
  const list = state.products.filter(p => !kw || p.item_name.toLowerCase().includes(kw));

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">📦</div><div class="empty-text">${kw?'검색 결과 없음':'상품을 추가해주세요 (우측 하단 + 버튼)'}</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(p => {
    const pid = getPid(p);
    const th = p.threshold != null ? p.threshold : def;
    const wn = p.threshold != null ? th * 2 : warn;
    let badge;
    if (p.current_stock <= 0)        badge = `<span class="stock-badge soldout">● 매진</span>`;
    else if (p.current_stock <= th)  badge = `<span class="stock-badge danger blink">⚠ ${p.current_stock}개</span>`;
    else if (p.current_stock <= wn)  badge = `<span class="stock-badge warning">▲ ${p.current_stock}개</span>`;
    else                             badge = `<span class="stock-badge normal">✓ ${p.current_stock}개</span>`;

    const pid_esc = pid.replace(/'/g,"\\'");
    return `<tr>
      <td data-label="상품명">
        <div class="pname">${p.item_name}</div>
        <div class="pcode">${p.item_code||'코드 없음'}</div>
      </td>
      <td data-label="재고">${badge}</td>
      <td data-label="임박 기준"><span class="th-badge">${th}개 이하</span></td>
      <td data-label="매진 시각">${p.soldout_at?`<div class="soldout-time">🕐 ${p.soldout_at}</div>`:'<span style="color:var(--border2);font-size:12px">—</span>'}</td>
      <td data-label="">
        <div class="row-actions">
          <button class="btn-xs bxa" onclick="openAdjust('${pid_esc}','add')">+ 추가</button>
          <button class="btn-xs bxm" onclick="openAdjust('${pid_esc}','minus')">− 차감</button>
          <button class="btn-xs bxe" onclick="openEditModal('${pid_esc}')">수정</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── 이력 ──
function renderHistory() {
  const list = document.getElementById('historyList');
  let items = [...state.history].reverse();
  if (historyFilter !== 'all') items = items.filter(h => h.type === historyFilter);
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">이력이 없습니다</div></div>`;
    return;
  }
  const typeLabel = { add:'추가', minus:'차감', soldout:'매진', init:'초기설정', pos:'POS차감' };
  list.innerHTML = items.slice(0, 100).map(h => {
    const isPlus = h.type === 'add' || h.type === 'init';
    const qtyStr = h.type === 'soldout' ? '매진' : `${isPlus?'+':'-'}${h.qty}`;
    return `<div class="h-item">
      <div class="h-dot ${h.type==='pos'?'pos':h.type}"></div>
      <div class="h-info">
        <div class="h-name">${h.item_name||h.item_code||'—'}</div>
        <div class="h-note">${typeLabel[h.type]||h.type}${h.note?' · '+h.note:''}</div>
      </div>
      <div class="h-qty ${isPlus?'p':'m'}">${qtyStr}</div>
      <div class="h-time">${(h.datetime||'').replace(' ','<br>')}</div>
    </div>`;
  }).join('');
}

function setHFilter(f, el) {
  historyFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderHistory();
}

// ── 차트 ──
function updateChartSelect() {
  const sel = document.getElementById('chartProduct');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">전체 상품</option>' +
    state.products.map(p => `<option value="${getPid(p)}">${p.item_name}</option>`).join('');
  sel.value = cur || 'all';
}

function setPeriod(p, el) {
  chartPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderChart();
}

function renderChart() {
  const canvas = document.getElementById('salesCanvas');
  const empty = document.getElementById('chartEmpty');
  const titleEl = document.getElementById('chartTitle');
  const pf = document.getElementById('chartProduct').value;

  let items = state.history.filter(h => h.type === 'minus' || h.type === 'pos');
  if (pf !== 'all') items = items.filter(h => getPid(h) === pf || h.item_code === pf || h._id === pf);

  if (!items.length) {
    canvas.style.display = 'none'; empty.style.display = 'block'; return;
  }
  canvas.style.display = 'block'; empty.style.display = 'none';

  const buckets = {};
  items.forEach(h => {
    if (!h.datetime) return;
    const dt = h.datetime.replace(' ','T');
    const d = new Date(dt);
    if (isNaN(d)) return;
    let key;
    if (chartPeriod === 'daily') key = h.datetime.slice(0,10);
    else if (chartPeriod === 'weekly') {
      const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
      key = mon.toISOString().slice(0,10);
    } else key = h.datetime.slice(0,7);
    buckets[key] = (buckets[key]||0) + (h.qty||0);
  });

  const labels = Object.keys(buckets).sort();
  const data = labels.map(k => buckets[k]);
  const pmap = { daily:'일별', weekly:'주별', monthly:'월별' };
  titleEl.textContent = `${pmap[chartPeriod]} 판매량 추이`;

  if (chartObj) { chartObj.destroy(); chartObj = null; }
  chartObj = new Chart(canvas, {
    type:'bar',
    data: { labels, datasets:[{ label:'판매 수량', data, backgroundColor:'rgba(139,92,246,.45)', borderColor:'#8b5cf6', borderWidth:2, borderRadius:5 }] },
    options: {
      responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false } },
      scales: {
        x:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'#1e293b' } },
        y:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'#1e293b' }, beginAtZero:true }
      }
    }
  });
}

// ── 상품 추가/수정 ──
function openAddModal() {
  editingId = null;
  document.getElementById('m-product-title').textContent = '상품 추가';
  ['f-name','f-code','f-threshold'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-stock').value = '';
  document.getElementById('m-product').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 200);
}

function openEditModal(pid) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  editingId = pid;
  document.getElementById('m-product-title').textContent = '상품 수정';
  document.getElementById('f-name').value = p.item_name;
  document.getElementById('f-code').value = p.item_code||'';
  document.getElementById('f-stock').value = p.current_stock;
  document.getElementById('f-threshold').value = p.threshold != null ? p.threshold : '';
  document.getElementById('m-product').classList.add('open');
}

async function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  const code = document.getElementById('f-code').value.trim();
  const stock = parseInt(document.getElementById('f-stock').value)||0;
  const thVal = document.getElementById('f-threshold').value;
  const threshold = thVal !== '' ? parseInt(thVal) : null;
  if (!name) { showToast('상품명을 입력해주세요'); return; }

  if (editingId) {
    const p = state.products.find(p => getPid(p) === editingId);
    if (p) { p.item_name=name; p.item_code=code; p.current_stock=stock; p.threshold=threshold; }
  } else {
    // 중복 체크 (코드 있을 때만)
    if (code && state.products.find(p => p.item_code && p.item_code === code)) {
      showToast('이미 등록된 상품 코드입니다'); return;
    }
    const newP = { _id:'p_'+Date.now(), item_code:code, item_name:name, current_stock:stock, threshold, soldout_at:null };
    state.products.push(newP);
    addHistory({ type:'init', _id:newP._id, item_code:code, item_name:name, qty:stock, note:'초기 설정' });
    updateChartSelect();
  }
  await saveData();
  closeModal('m-product');
  renderTable(); updateSummary();
  showToast(editingId ? '수정되었습니다' : '상품이 추가되었습니다');
}

// ── 재고 조정 ──
function openAdjust(pid, type) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  document.getElementById('m-adjust-title').textContent = (type==='add'?'재고 추가':'재고 차감') + ` — ${p.item_name}`;
  document.getElementById('adj-id').value = pid;
  document.getElementById('adj-type').value = type;
  document.getElementById('adj-qty').value = '';
  document.getElementById('adj-note').value = '';
  document.getElementById('m-adjust').classList.add('open');
  setTimeout(() => document.getElementById('adj-qty').focus(), 200);
}

async function applyAdjust() {
  const pid = document.getElementById('adj-id').value;
  const type = document.getElementById('adj-type').value;
  const qty = parseInt(document.getElementById('adj-qty').value);
  const note = document.getElementById('adj-note').value.trim();
  if (!qty || qty <= 0) { showToast('수량을 입력해주세요'); return; }

  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;

  if (type === 'add') {
    p.current_stock += qty;
    if (p.current_stock > 0) p.soldout_at = null;
  } else {
    p.current_stock = Math.max(0, p.current_stock - qty);
    if (p.current_stock === 0 && !p.soldout_at) {
      p.soldout_at = nowStr();
      addHistory({ type:'soldout', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:0, note:'매진' });
    }
  }
  addHistory({ type, _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty, note });
  await saveData();
  closeModal('m-adjust');
  renderTable(); renderHistory(); updateSummary();
  showToast(type==='add' ? `+${qty}개 추가됨` : `−${qty}개 차감됨`);
}

function addHistory(entry) {
  if (!state.history) state.history = [];
  state.history.push({ ...entry, datetime: nowStr() });
  // 이력 최대 500건 유지
  if (state.history.length > 500) state.history = state.history.slice(-500);
}

// ── 설정 ──
function syncSettingsForm() {
  document.getElementById('s-hd').value = state.settings.hd_code||'HYW';
  document.getElementById('s-sp').value = state.settings.sp_code||'';
  document.getElementById('s-interval').value = state.settings.sync_interval||30;
  document.getElementById('s-th').value = state.settings.alert_threshold||10;
  document.getElementById('s-warn').value = state.settings.warning_threshold||20;
  const pill = document.getElementById('apiPill');
  if (state.settings.sp_code) { pill.textContent='● 연결됨'; pill.className='api-pill on'; }
  else { pill.textContent='● 미연결'; pill.className='api-pill off'; }
}

async function saveApiSettings() {
  state.settings.hd_code = document.getElementById('s-hd').value.trim();
  state.settings.sp_code = document.getElementById('s-sp').value.trim();
  state.settings.sync_interval = parseInt(document.getElementById('s-interval').value)||30;
  await saveData(); syncSettingsForm(); showToast('저장되었습니다');
}

async function saveThreshold() {
  state.settings.alert_threshold = parseInt(document.getElementById('s-th').value)||10;
  state.settings.warning_threshold = parseInt(document.getElementById('s-warn').value)||20;
  await saveData(); renderTable(); updateSummary(); showToast('기준 수량 저장됨');
}

// ── 모달 ──
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function overlayClose(el) { el.classList.remove('open'); }

// ── 토스트 ──

function copyInputUrl(btn) {
  const url = window.location.origin + '/100yearinventory';
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'rgba(74,222,128,.4)';
    showToast('입력 페이지 주소가 복사됐습니다');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  }).catch(() => {
    // clipboard API 실패 시 fallback
    const ta = document.createElement('textarea');
    ta.value = window.location.origin + '/100yearinventory';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('입력 페이지 주소가 복사됐습니다');
  });
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 초기화 ──
async function init() {
  await loadData();
  renderAll();
  syncSettingsForm();
  updateLastSync();
}

init();
</script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel('' + m.id + '')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
