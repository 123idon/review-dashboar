<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>재고 현황 — 백년화편</title>
  <style>
/* ═══════════════════════════════════════════════════════════
   토스 디자인 시스템 — 백년화편 퍼스널 컬러
   퍼스널 컬러: 따뜻한 떡 브랜드 → 오렌지/앰버 계열 accent
   ═══════════════════════════════════════════════════════════ */

/* ── 라이트 모드 ── */
[data-theme="day"] {
  --bg:           #F9FAFB;
  --bg2:          #F2F4F6;
  --surface:      #FFFFFF;
  --surface2:     #F9FAFB;
  --border:       #E5E8EB;
  --border2:      #CDD1D8;

  --text:         #191F28;
  --text2:        #333D4B;
  --text3:        #6B7684;
  --text4:        #B0B8C1;

  /* 퍼스널 컬러: 백년화편 = 따뜻한 앰버/오렌지 */
  --brand:        #F5820D;
  --brand-light:  #FFF4E6;
  --brand-dark:   #D96E00;
  --brand-rgb:    245,130,13;

  --blue:         #3182F6;
  --blue-light:   #EBF3FE;
  --blue-rgb:     49,130,246;

  --red:          #F04452;
  --red-light:    #FFF0F0;
  --green:        #00A86B;
  --green-light:  #E8FAF4;
  --purple:       #6C47FF;
  --purple-light: #F3F0FF;
  --teal:         #00BCD4;
  --teal-light:   #E6F9FC;
  --amber:        #F59E0B;
  --amber-light:  #FFFAEB;

  --shadow-xs: 0 1px 2px rgba(0,0,0,.05);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.10), 0 4px 12px rgba(0,0,0,.06);
  --shadow-xl: 0 20px 60px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08);
  --shadow-brand: 0 4px 16px rgba(var(--brand-rgb),.25);
  --shadow-blue:  0 4px 16px rgba(var(--blue-rgb),.25);
}

/* ── 다크 모드 ── */
[data-theme="night"] {
  --bg:           #0E1117;
  --bg2:          #161B25;
  --surface:      #1A2130;
  --surface2:     #212B3D;
  --border:       #2A3547;
  --border2:      #3A4A60;

  --text:         #F2F4F6;
  --text2:        #C8D0DA;
  --text3:        #7A8899;
  --text4:        #3F5068;

  --brand:        #FF9A30;
  --brand-light:  rgba(255,154,48,.14);
  --brand-dark:   #FFB558;
  --brand-rgb:    255,154,48;

  --blue:         #4D9BFF;
  --blue-light:   rgba(77,155,255,.14);
  --blue-rgb:     77,155,255;

  --red:          #FF6B75;
  --red-light:    rgba(255,107,117,.14);
  --green:        #1FC791;
  --green-light:  rgba(31,199,145,.14);
  --purple:       #8B6FFF;
  --purple-light: rgba(139,111,255,.14);
  --teal:         #22D3EE;
  --teal-light:   rgba(34,211,238,.14);
  --amber:        #FBB928;
  --amber-light:  rgba(251,185,40,.14);

  --shadow-xs: 0 1px 2px rgba(0,0,0,.2);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.5);
  --shadow-xl: 0 20px 60px rgba(0,0,0,.6);
  --shadow-brand: 0 4px 16px rgba(var(--brand-rgb),.3);
  --shadow-blue:  0 4px 16px rgba(var(--blue-rgb),.3);
}

/* ── 기본 리셋 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s ease, color 0.2s ease;
}

/* ── 타이포 스케일 ── */
.t-hero  { font-size: clamp(28px,5vw,42px); font-weight: 800; letter-spacing: -1.4px; line-height: 1.15; }
.t-title { font-size: 22px; font-weight: 800; letter-spacing: -.7px; }
.t-head  { font-size: 17px; font-weight: 700; letter-spacing: -.4px; }
.t-body  { font-size: 14px; font-weight: 400; line-height: 1.7; }
.t-label { font-size: 12px; font-weight: 600; }
.t-caption{ font-size: 11px; color: var(--text3); }
.t-mono  { font-family: 'SF Mono','JetBrains Mono','Fira Code',monospace; }
.t-num   { font-variant-numeric: tabular-nums; }

/* ── 토스 스탯 숫자 ── */
.stat-num {
  font-size: 32px; font-weight: 800;
  letter-spacing: -1.8px; line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* ── 레이아웃 ── */
.page-wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
.section   { margin-bottom: 24px; }
.grid-2    { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3    { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.grid-4    { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

/* ── 카드 ── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  transition:
    border-color 200ms ease,
    box-shadow 200ms ease,
    transform 200ms cubic-bezier(0.34,1.56,0.64,1);
}
.card:hover {
  border-color: var(--border2);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.card-title {
  font-size: 13px; font-weight: 700;
  color: var(--text2); margin-bottom: 14px; letter-spacing: -.2px;
}

/* ── 버튼 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 22px;
  border-radius: 50px; border: none;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: all 150ms cubic-bezier(0.16,1,0.3,1);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--brand); color: #fff;
  box-shadow: var(--shadow-brand);
}
.btn-primary:hover { background: var(--brand-dark); box-shadow: 0 6px 20px rgba(var(--brand-rgb),.4); transform: translateY(-1px); }
.btn-blue { background: var(--blue); color: #fff; box-shadow: var(--shadow-blue); }
.btn-blue:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
.btn-ghost:hover { border-color: var(--border2); background: var(--surface2); }
.btn-sm { height: 32px; padding: 0 14px; font-size: 12px; border-radius: 50px; }
.btn-xs { height: 26px; padding: 0 10px; font-size: 11px; border-radius: 50px; }

/* ── 입력 ── */
.input {
  width: 100%; height: 48px; padding: 0 14px;
  background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
.input-sm { height: 36px; font-size: 13px; border-radius: 10px; }
textarea.input { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.6; }

/* ── 배지/칩 ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 9px; border-radius: 50px;
  font-size: 10px; font-weight: 700; letter-spacing: .4px;
}
.badge-brand  { background: var(--brand-light);  color: var(--brand); }
.badge-blue   { background: var(--blue-light);   color: var(--blue); }
.badge-green  { background: var(--green-light);  color: var(--green); }
.badge-red    { background: var(--red-light);    color: var(--red); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-amber  { background: var(--amber-light);  color: var(--amber); }
.badge-teal   { background: var(--teal-light);   color: var(--teal); }
.badge-gray   { background: var(--surface2);     color: var(--text3); }

/* ── 라이브 배지 ── */
.live-dot {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 9px; border-radius: 50px;
  background: var(--green-light); color: var(--green);
  font-size: 10px; font-weight: 700;
}
.live-dot::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.5; transform:scale(.75); }
}

/* ── 공통 네비 헤더 ── */
.app-header {
  position: sticky; top: 0; z-index: 200;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  box-shadow: var(--shadow-xs);
  transition: background .2s ease, border-color .2s ease;
}
.app-header-left  { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.app-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  box-shadow: 0 2px 8px rgba(var(--brand-rgb),.35);
}
.brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.4px; }
.brand-sub  { font-size: 10px; color: var(--text4); letter-spacing: .5px; text-transform: uppercase; }

/* 뒤로가기 버튼 */
.back-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 12px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-size: 12px; font-weight: 600; color: var(--text3);
  text-decoration: none; cursor: pointer;
  transition: all 150ms ease;
  flex-shrink: 0;
}
.back-link:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
.back-link svg { width: 14px; height: 14px; stroke: currentColor; flex-shrink: 0; }

/* ── 탭 ── */
.tab-group {
  display: flex; background: var(--bg2);
  border-radius: 10px; padding: 3px; gap: 2px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-group::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; height: 30px; padding: 0 14px;
  border-radius: 8px; border: none; background: transparent;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--text3); cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}
.tab:hover { color: var(--text2); }
.tab.active {
  background: var(--surface); color: var(--brand);
  box-shadow: var(--shadow-sm);
}

/* ── 필터 바 ── */
.filter-pill {
  height: 30px; padding: 0 13px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--text3); cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}
.filter-pill:hover { border-color: var(--brand); color: var(--brand); }
.filter-pill.active {
  background: var(--brand); border-color: var(--brand); color: #fff;
  box-shadow: var(--shadow-brand);
}

/* ── 토스트 ── */
.toast-msg {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg);
  font-size: 13px; font-weight: 600;
  padding: 11px 22px; border-radius: 50px;
  opacity: 0; pointer-events: none; z-index: 9999;
  white-space: nowrap;
  transition: opacity 200ms ease, transform 200ms cubic-bezier(0.34,1.56,0.64,1);
}
.toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 테마 버튼 ── */
.theme-btn {
  position: fixed; bottom: 22px; left: 20px; z-index: 999;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text3);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: transform 200ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 150ms ease;
  -webkit-tap-highlight-color: transparent;
}
.theme-btn:hover  { transform: scale(1.1); box-shadow: var(--shadow-md); }
.theme-btn:active { transform: scale(0.93); }

/* ── 플로팅 메모 버튼 ── */
.memo-fab {
  position: fixed; bottom: 22px; right: 22px; z-index: 900;
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-brand);
  transition: transform 250ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color: transparent;
}
.memo-fab:hover  { transform: scale(1.08) rotate(-5deg); box-shadow: 0 8px 24px rgba(var(--brand-rgb),.45); }
.memo-fab:active { transform: scale(0.94); }
.mp-badge {
  position: absolute; top: 5px; right: 5px;
  min-width: 17px; height: 17px; padding: 0 4px;
  background: var(--red); color: #fff;
  font-size: 9px; font-weight: 800; border-radius: 50px;
  border: 2.5px solid var(--surface);
  display: none; align-items: center; justify-content: center;
}
.mp-badge.show { display: flex; }

/* ── 메모 패널 ── */
.memo-panel {
  position: fixed; bottom: 84px; right: 22px; z-index: 901;
  width: 340px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-xl);
  overflow: hidden;
  transform: scale(.88) translateY(14px);
  transform-origin: bottom right;
  opacity: 0; pointer-events: none;
  transition:
    transform 280ms cubic-bezier(0.34,1.56,0.64,1),
    opacity 200ms ease;
}
.memo-panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
.mp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.mp-title { font-size: 14px; font-weight: 700; letter-spacing: -.3px; }
.mp-close {
  width: 26px; height: 26px; border-radius: 50%;
  border: none; background: var(--bg2); color: var(--text3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 150ms ease;
}
.mp-close:hover { background: var(--border); color: var(--text); }
.mp-body { padding: 14px 18px; }
.mp-textarea {
  width: 100%; padding: 11px 13px;
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-family: inherit; font-size: 13px; line-height: 1.6;
  resize: none; outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
.mp-save {
  width: 100%; height: 38px; margin-top: 8px;
  border-radius: 50px; border: none;
  background: var(--brand); color: #fff;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: all 150ms ease;
}
.mp-save:hover   { background: var(--brand-dark); }
.mp-save:active  { transform: scale(.98); }
.mp-save:disabled{ opacity: .5; cursor: not-allowed; }
.mp-list { max-height: 260px; overflow-y: auto; margin-top: 10px; scrollbar-width: thin; }
.mp-card { padding: 10px 0; border-bottom: 1px solid var(--border); }
.mp-card:last-child { border-bottom: none; }
.mp-card-text  { font-size: 13px; color: var(--text2); line-height: 1.6; }
.mp-card-footer{ display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
.mp-card-date  { font-size: 10px; color: var(--text4); font-variant-numeric: tabular-nums; }
.mp-del-btn {
  height: 22px; padding: 0 9px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-size: 10px; font-weight: 600; color: var(--text4); cursor: pointer;
  transition: all 150ms ease;
}
.mp-del-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
.mp-empty { font-size: 12px; color: var(--text4); text-align: center; padding: 20px 0; }
.mp-toast {
  position: fixed; bottom: 88px; right: 80px; z-index: 902;
  background: var(--text); color: var(--bg);
  font-size: 12px; font-weight: 700;
  padding: 8px 16px; border-radius: 50px;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: all 200ms ease;
}
.mp-toast.show { opacity: 1; transform: translateY(0); }

/* ── 스켈레톤 ── */
.skeleton {
  border-radius: 8px;
  background: linear-gradient(
    90deg,
    var(--surface2) 25%,
    var(--border) 50%,
    var(--surface2) 75%
  );
  background-size: 400px 100%;
  animation: skeleton-shine 1.4s ease-in-out infinite;
}
@keyframes skeleton-shine {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}

/* ── 프로그레스 바 ── */
.progress-rail { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 9999; pointer-events: none; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* ── 분리선 ── */
.divider { height: 1px; background: var(--border); margin: 0; }

/* ── 공통 애니메이션 ── */
@keyframes fade-up   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-down { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-in   { from { opacity:0; } to { opacity:1; } }
@keyframes scale-in  { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:scale(1); } }
@keyframes spin      { to { transform: rotate(360deg); } }

.anim-up   { animation: fade-up   280ms cubic-bezier(0.16,1,0.3,1) both; }
.anim-down { animation: fade-down 280ms cubic-bezier(0.16,1,0.3,1) both; }
.anim-in   { animation: fade-in   220ms ease both; }

/* 순차 딜레이 */
.d1 { animation-delay: .06s; }
.d2 { animation-delay: .12s; }
.d3 { animation-delay: .18s; }
.d4 { animation-delay: .24s; }
.d5 { animation-delay: .30s; }

/* ── 스피너 ── */
.spinner {
  width: 24px; height: 24px;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* ── 모바일 공통 ── */
@media (max-width: 480px) {
  .memo-panel { width: calc(100vw - 28px); right: 14px; bottom: 78px; }
  .memo-fab   { width: 48px; height: 48px; right: 16px; bottom: 18px; }
  .page-wrap  { padding: 16px 14px 80px; }
}

/* inventory 전용 */
.inv-tab-bar { display: flex; gap: 3px; padding: 14px 20px 0; max-width: 960px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.inv-tab-bar::-webkit-scrollbar { display: none; }
.inv-tab {
  height: 36px; padding: 0 18px; border-radius: 12px 12px 0 0;
  border: 1.5px solid var(--border); border-bottom: none;
  background: var(--bg2); font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--text3); cursor: pointer; white-space: nowrap;
  transition: all 150ms ease; flex-shrink: 0;
}
.inv-tab:hover { color: var(--text2); }
.inv-tab.active { background: var(--surface); color: var(--teal); border-color: var(--border); border-bottom-color: var(--surface); position: relative; z-index: 1; }

.inv-body { max-width: 960px; margin: 0 auto; padding: 0 20px 80px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 0 14px 14px 14px; position: relative; z-index: 0; }

.summary-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; padding: 20px 0 6px; }
.summary-card { background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; transition: transform 250ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease; animation: fade-up 270ms cubic-bezier(0.16,1,0.3,1) both; }
.summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.summary-card.s-warn   { background: var(--brand-light); border-color: rgba(var(--brand-rgb),.2); }
.summary-card.s-danger { background: var(--red-light);   border-color: rgba(240,68,82,.2); }
.sum-label { font-size: 11px; color: var(--text3); margin-bottom: 7px; font-weight: 500; }
.sum-val { font-size: 28px; font-weight: 900; letter-spacing: -1.4px; line-height: 1; font-variant-numeric: tabular-nums; }
.sum-sub { font-size: 11px; color: var(--text4); margin-top: 4px; }

.inv-filter-row { display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; flex-wrap: wrap; }
.inv-search { height: 32px; padding: 0 12px; border: 1.5px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; min-width: 130px; }
.inv-search:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-light); }

.table-wrap { overflow-x: auto; border-radius: 12px; border: 1.5px solid var(--border); margin-bottom: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg2); }
th { padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 700; color: var(--text4); letter-spacing: .7px; text-transform: uppercase; white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--border); color: var(--text2); }
tr:hover td { background: var(--bg); }
.stock-n { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.s-ok     { color: var(--green); }
.s-warn   { color: var(--brand); }
.s-danger { color: var(--red); }
.s-zero   { color: var(--text4); }
.status-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 50px; letter-spacing: .3px; }
.st-ok     { background: var(--green-light); color: var(--green); }
.st-warn   { background: var(--brand-light); color: var(--brand); }
.st-danger { background: var(--red-light);   color: var(--red); }
.st-soldout{ background: var(--bg2);         color: var(--text4); }
.act-btn { height: 26px; padding: 0 10px; border-radius: 50px; border: 1.5px solid var(--border); background: transparent; font-size: 10px; font-weight: 700; color: var(--text3); cursor: pointer; transition: all 150ms ease; }
.act-btn:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }

.history-list { display: flex; flex-direction: column; }
.history-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); animation: fade-up 200ms ease both; }
.history-row:last-child { border-bottom: none; }
.h-time { font-size: 10px; color: var(--text4); white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.h-type { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 50px; flex-shrink: 0; }
.ht-in      { background: var(--green-light); color: var(--green); }
.ht-out     { background: var(--red-light);   color: var(--red); }
.ht-set     { background: var(--blue-light);  color: var(--blue); }
.ht-soldout { background: var(--bg2);         color: var(--text4); }
.h-detail { font-size: 12px; color: var(--text2); flex: 1; }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 0; }
.chart-box { background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; }
.chart-box-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }
.chart-box-wrap  { position: relative; height: 180px; }

.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 0; }
.settings-box { background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; }
.settings-box-title { font-size: 11px; font-weight: 700; color: var(--text4); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 12px; }
.settings-row { margin-bottom: 10px; }
.settings-row label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 4px; }
.settings-inp { width: 100%; height: 36px; padding: 0 11px; border: 1.5px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; outline: none; transition: border-color 150ms ease; }
.settings-inp:focus { border-color: var(--teal); }
.settings-save { height: 36px; padding: 0 18px; border-radius: 50px; border: none; background: var(--teal); color: #fff; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 150ms ease; }
.settings-save:hover { filter: brightness(1.08); }

.toast-msg { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; padding: 10px 22px; border-radius: 50px; opacity: 0; pointer-events: none; z-index: 9999; white-space: nowrap; transition: opacity 200ms ease, transform 200ms cubic-bezier(0.34,1.56,0.64,1); }
.toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width:600px)  { .summary-grid { grid-template-columns: repeat(4,1fr); } }
@media (max-width:599px)  { .summary-grid { grid-template-columns: 1fr 1fr; } .chart-grid { grid-template-columns: 1fr; } .settings-grid { grid-template-columns: 1fr; } .inv-body { padding: 0 14px 80px; } .inv-tab-bar { padding: 14px 14px 0; } }
@media (max-width:480px)  { .inv-tab { padding: 0 12px; font-size: 12px; } }

<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function __themeInit() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>

<script>
// ── 유틸 ──
function nowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── 상태 ──
const DEFAULT_STATE = () => ({
  products: [],
  history: [],
  settings: { hd_code:'HYW', sp_code:'', alert_threshold:10, warning_threshold:20, sync_interval:30 }
});
let state = DEFAULT_STATE();
let historyFilter = 'all';
let chartPeriod = 'daily';
let chartObj = null;
let editingId = null; // 상품 고유 id

// ── 상품 고유 ID ── item_code 있으면 사용, 없으면 _id(uuid-like)
function getPid(p) { return p.item_code || p._id; }

// ── 데이터 로드/저장 ──
async function loadData() {
  try {
    const r = await fetch('/api/inventory');
    if (!r.ok) throw new Error('fetch fail');
    const d = await r.json();
    // _id 없는 기존 상품 마이그레이션
    (d.products||[]).forEach((p,i) => { if (!p._id) p._id = 'p_' + Date.now() + '_' + i; });
    state = { ...DEFAULT_STATE(), ...d };
    state.settings = { ...DEFAULT_STATE().settings, ...(d.settings||{}) };
  } catch(e) { console.warn('loadData error', e); }
}

async function saveData() {
  try {
    await fetch('/api/inventory', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
  } catch(e) { console.warn('saveData error', e); }
}

// ── 새로고침 ──
async function handleRefresh(btn) {
  btn.classList.add('spinning');
  await loadData();
  renderAll();
  syncSettingsForm();
  btn.classList.remove('spinning');
  updateLastSync();
  showToast('새로고침 완료');
}

function updateLastSync() {
  document.getElementById('lastSync').textContent = '마지막 동기화: ' + nowStr();
}

// ── 탭 전환 ── (event 객체 대신 el 파라미터 사용)
function switchTab(name, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'chart') renderChart();
}

// ── 렌더 전체 ──
function renderAll() {
  renderTable();
  renderHistory();
  updateSummary();
  updateChartSelect();
}

// ── 요약 ──
function updateSummary() {
  const def = state.settings.alert_threshold || 10;
  let total=0, normal=0, alert=0, sold=0;
  state.products.forEach(p => {
    total++;
    const th = p.threshold != null ? p.threshold : def;
    if (p.current_stock <= 0) sold++;
    else if (p.current_stock <= th) alert++;
    else normal++;
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-normal').textContent = normal;
  document.getElementById('s-alert').textContent = alert;
  document.getElementById('s-sold').textContent = sold;
}

// ── 테이블 ──
function renderTable() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const def = state.settings.alert_threshold || 10;
  const warn = state.settings.warning_threshold || (def * 2);
  const tbody = document.getElementById('stockBody');
  const list = state.products.filter(p => !kw || p.item_name.toLowerCase().includes(kw));

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">📦</div><div class="empty-text">${kw?'검색 결과 없음':'상품을 추가해주세요 (우측 하단 + 버튼)'}</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(p => {
    const pid = getPid(p);
    const th = p.threshold != null ? p.threshold : def;
    const wn = p.threshold != null ? th * 2 : warn;
    let badge;
    if (p.current_stock <= 0)        badge = `<span class="stock-badge soldout">● 매진</span>`;
    else if (p.current_stock <= th)  badge = `<span class="stock-badge danger blink">⚠ ${p.current_stock}개</span>`;
    else if (p.current_stock <= wn)  badge = `<span class="stock-badge warning">▲ ${p.current_stock}개</span>`;
    else                             badge = `<span class="stock-badge normal">✓ ${p.current_stock}개</span>`;

    const pid_esc = pid.replace(/'/g,"\\'");
    return `<tr>
      <td data-label="상품명">
        <div class="pname">${p.item_name}</div>
        <div class="pcode">${p.item_code||'코드 없음'}</div>
      </td>
      <td data-label="재고">${badge}</td>
      <td data-label="임박 기준"><span class="th-badge">${th}개 이하</span></td>
      <td data-label="매진 시각">${p.soldout_at?`<div class="soldout-time">🕐 ${p.soldout_at}</div>`:'<span style="color:var(--border2);font-size:12px">—</span>'}</td>
      <td data-label="">
        <div class="row-actions">
          <button class="btn-xs bxa" onclick="openAdjust('${pid_esc}','add')">+ 추가</button>
          <button class="btn-xs bxm" onclick="openAdjust('${pid_esc}','minus')">− 차감</button>
          <button class="btn-xs bxe" onclick="openEditModal('${pid_esc}')">수정</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── 이력 ──
function renderHistory() {
  const list = document.getElementById('historyList');
  let items = [...state.history].reverse();
  if (historyFilter !== 'all') items = items.filter(h => h.type === historyFilter);
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">이력이 없습니다</div></div>`;
    return;
  }
  const typeLabel = { add:'추가', minus:'차감', soldout:'매진', init:'초기설정', pos:'POS차감' };
  list.innerHTML = items.slice(0, 100).map(h => {
    const isPlus = h.type === 'add' || h.type === 'init';
    const qtyStr = h.type === 'soldout' ? '매진' : `${isPlus?'+':'-'}${h.qty}`;
    return `<div class="h-item">
      <div class="h-dot ${h.type==='pos'?'pos':h.type}"></div>
      <div class="h-info">
        <div class="h-name">${h.item_name||h.item_code||'—'}</div>
        <div class="h-note">${typeLabel[h.type]||h.type}${h.note?' · '+h.note:''}</div>
      </div>
      <div class="h-qty ${isPlus?'p':'m'}">${qtyStr}</div>
      <div class="h-time">${(h.datetime||'').replace(' ','<br>')}</div>
    </div>`;
  }).join('');
}

function setHFilter(f, el) {
  historyFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderHistory();
}

// ── 차트 ──
function updateChartSelect() {
  const sel = document.getElementById('chartProduct');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">전체 상품</option>' +
    state.products.map(p => `<option value="${getPid(p)}">${p.item_name}</option>`).join('');
  sel.value = cur || 'all';
}

function setPeriod(p, el) {
  chartPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderChart();
}

function renderChart() {
  const canvas = document.getElementById('salesCanvas');
  const empty = document.getElementById('chartEmpty');
  const titleEl = document.getElementById('chartTitle');
  const pf = document.getElementById('chartProduct').value;

  let items = state.history.filter(h => h.type === 'minus' || h.type === 'pos');
  if (pf !== 'all') items = items.filter(h => getPid(h) === pf || h.item_code === pf || h._id === pf);

  if (!items.length) {
    canvas.style.display = 'none'; empty.style.display = 'block'; return;
  }
  canvas.style.display = 'block'; empty.style.display = 'none';

  const buckets = {};
  items.forEach(h => {
    if (!h.datetime) return;
    const dt = h.datetime.replace(' ','T');
    const d = new Date(dt);
    if (isNaN(d)) return;
    let key;
    if (chartPeriod === 'daily') key = h.datetime.slice(0,10);
    else if (chartPeriod === 'weekly') {
      const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
      key = mon.toISOString().slice(0,10);
    } else key = h.datetime.slice(0,7);
    buckets[key] = (buckets[key]||0) + (h.qty||0);
  });

  const labels = Object.keys(buckets).sort();
  const data = labels.map(k => buckets[k]);
  const pmap = { daily:'일별', weekly:'주별', monthly:'월별' };
  titleEl.textContent = `${pmap[chartPeriod]} 판매량 추이`;

  if (chartObj) { chartObj.destroy(); chartObj = null; }
  chartObj = new Chart(canvas, {
    type:'bar',
    data: { labels, datasets:[{ label:'판매 수량', data, backgroundColor:'rgba(139,92,246,.45)', borderColor:'#8b5cf6', borderWidth:2, borderRadius:5 }] },
    options: {
      responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false } },
      scales: {
        x:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'var(--border)' } },
        y:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'var(--border)' }, beginAtZero:true }
      }
    }
  });
}

// ── 상품 추가/수정 ──
function openAddModal() {
  editingId = null;
  document.getElementById('m-product-title').textContent = '상품 추가';
  ['f-name','f-code','f-threshold'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-stock').value = '';
  document.getElementById('m-product').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 200);
}

function openEditModal(pid) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  editingId = pid;
  document.getElementById('m-product-title').textContent = '상품 수정';
  document.getElementById('f-name').value = p.item_name;
  document.getElementById('f-code').value = p.item_code||'';
  document.getElementById('f-stock').value = p.current_stock;
  document.getElementById('f-threshold').value = p.threshold != null ? p.threshold : '';
  document.getElementById('m-product').classList.add('open');
}

async function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  const code = document.getElementById('f-code').value.trim();
  const stock = parseInt(document.getElementById('f-stock').value)||0;
  const thVal = document.getElementById('f-threshold').value;
  const threshold = thVal !== '' ? parseInt(thVal) : null;
  if (!name) { showToast('상품명을 입력해주세요'); return; }

  if (editingId) {
    const p = state.products.find(p => getPid(p) === editingId);
    if (p) { p.item_name=name; p.item_code=code; p.current_stock=stock; p.threshold=threshold; }
  } else {
    // 중복 체크 (코드 있을 때만)
    if (code && state.products.find(p => p.item_code && p.item_code === code)) {
      showToast('이미 등록된 상품 코드입니다'); return;
    }
    const newP = { _id:'p_'+Date.now(), item_code:code, item_name:name, current_stock:stock, threshold, soldout_at:null };
    state.products.push(newP);
    addHistory({ type:'init', _id:newP._id, item_code:code, item_name:name, qty:stock, note:'초기 설정' });
    updateChartSelect();
  }
  await saveData();
  closeModal('m-product');
  renderTable(); updateSummary();
  showToast(editingId ? '수정되었습니다' : '상품이 추가되었습니다');
}

// ── 재고 조정 ──
function openAdjust(pid, type) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  document.getElementById('m-adjust-title').textContent = (type==='add'?'재고 추가':'재고 차감') + ` — ${p.item_name}`;
  document.getElementById('adj-id').value = pid;
  document.getElementById('adj-type').value = type;
  document.getElementById('adj-qty').value = '';
  document.getElementById('adj-note').value = '';
  document.getElementById('m-adjust').classList.add('open');
  setTimeout(() => document.getElementById('adj-qty').focus(), 200);
}

async function applyAdjust() {
  const pid = document.getElementById('adj-id').value;
  const type = document.getElementById('adj-type').value;
  const qty = parseInt(document.getElementById('adj-qty').value);
  const note = document.getElementById('adj-note').value.trim();
  if (!qty || qty <= 0) { showToast('수량을 입력해주세요'); return; }

  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;

  if (type === 'add') {
    p.current_stock += qty;
    if (p.current_stock > 0) p.soldout_at = null;
  } else {
    p.current_stock = Math.max(0, p.current_stock - qty);
    if (p.current_stock === 0 && !p.soldout_at) {
      p.soldout_at = nowStr();
      addHistory({ type:'soldout', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:0, note:'매진' });
    }
  }
  addHistory({ type, _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty, note });
  await saveData();
  closeModal('m-adjust');
  renderTable(); renderHistory(); updateSummary();
  showToast(type==='add' ? `+${qty}개 추가됨` : `−${qty}개 차감됨`);
}

function addHistory(entry) {
  if (!state.history) state.history = [];
  state.history.push({ ...entry, datetime: nowStr() });
  // 이력 최대 500건 유지
  if (state.history.length > 500) state.history = state.history.slice(-500);
}

// ── 설정 ──
function syncSettingsForm() {
  document.getElementById('s-hd').value = state.settings.hd_code||'HYW';
  document.getElementById('s-sp').value = state.settings.sp_code||'';
  document.getElementById('s-interval').value = state.settings.sync_interval||30;
  document.getElementById('s-th').value = state.settings.alert_threshold||10;
  document.getElementById('s-warn').value = state.settings.warning_threshold||20;
  const pill = document.getElementById('apiPill');
  if (state.settings.sp_code) { pill.textContent='● 연결됨'; pill.className='api-pill on'; }
  else { pill.textContent='● 미연결'; pill.className='api-pill off'; }
}

async function saveApiSettings() {
  state.settings.hd_code = document.getElementById('s-hd').value.trim();
  state.settings.sp_code = document.getElementById('s-sp').value.trim();
  state.settings.sync_interval = parseInt(document.getElementById('s-interval').value)||30;
  await saveData(); syncSettingsForm(); showToast('저장되었습니다');
}

async function saveThreshold() {
  state.settings.alert_threshold = parseInt(document.getElementById('s-th').value)||10;
  state.settings.warning_threshold = parseInt(document.getElementById('s-warn').value)||20;
  await saveData(); renderTable(); updateSummary(); showToast('기준 수량 저장됨');
}

// ── 모달 ──
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function overlayClose(el) { el.classList.remove('open'); }

// ── 토스트 ──

function copyInputUrl(btn) {
  const url = window.location.origin + '/100yearinventory';
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'rgba(74,222,128,.4)';
    showToast('입력 페이지 주소가 복사됐습니다');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  }).catch(() => {
    // clipboard API 실패 시 fallback
    const ta = document.createElement('textarea');
    ta.value = window.location.origin + '/100yearinventory';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('입력 페이지 주소가 복사됐습니다');
  });
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 초기화 ──
async function init() {
  await loadData();
  renderAll();
  syncSettingsForm();
  updateLastSync();
}

init();
</script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel('' + m.id + '')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
