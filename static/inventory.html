<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>재고 현황 — 백년화편</title>
  <style>
:root {
  /* ── 토스 컬러 시스템 ── */
  --bg:        #f9fafb;
  --surface:   #ffffff;
  --surface2:  #f2f4f6;
  --border:    #e5e8eb;
  --border2:   #d1d6db;

  --text:      #191f28;
  --text2:     #333d4b;
  --text3:     #6b7684;
  --text4:     #b0b8c1;

  --primary:        #3182f6;
  --primary-light:  #ebf3fe;
  --primary-dark:   #1b64da;

  --red:        #f04452;
  --red-light:  #fff0f0;
  --green:      #00a86b;
  --green-light:#e8faf4;
  --orange:     #ff6b00;
  --orange-light:#fff4eb;
  --yellow:     #f5a623;
  --yellow-light:#fffaeb;
  --purple:     #6c47ff;
  --purple-light:#f3f0ff;
  --teal:       #00bcd4;
  --teal-light: #e6f9fc;

  /* ── 그림자 ── */
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md:  0 4px 16px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
  --shadow-xl:  0 16px 48px rgba(0,0,0,.14), 0 8px 24px rgba(0,0,0,.08);

  /* ── 반경 ── */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-pill:50px;

  /* ── 폰트 ── */
  --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* ── 애니메이션 ── */
  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-in-out: cubic-bezier(0.45,0,0.55,1);
  --duration-fast:  150ms;
  --duration-base:  220ms;
  --duration-slow:  350ms;
}

html.night {
  --bg:        #131820;
  --surface:   #1c2330;
  --surface2:  #242e3d;
  --border:    #2d3a4a;
  --border2:   #3d4e62;
  --text:      #f2f4f6;
  --text2:     #d0d7e0;
  --text3:     #8b95a1;
  --text4:     #4e5968;
  --primary:        #4593fc;
  --primary-light:  rgba(69,147,252,0.15);
  --primary-dark:   #6aadff;
  --red:        #ff6b6b;
  --red-light:  rgba(240,68,82,0.15);
  --green:      #20c997;
  --green-light:rgba(0,168,107,0.15);
  --shadow-sm:  0 1px 4px rgba(0,0,0,.3);
  --shadow-md:  0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.5);
}

    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

    header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);gap:10px;}
    .header-left{display:flex;align-items:center;gap:10px;}
    .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--teal),var(--primary));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;}
    .page-title{font-size:15px;font-weight:800;letter-spacing:-.4px;}
    .header-right{display:flex;align-items:center;gap:8px;}
    .last-sync{font-size:11px;color:var(--text4);font-family:var(--mono);}
    .back-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text3);text-decoration:none;padding:6px 12px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface);transition:all var(--duration-fast) var(--ease-out);}
    .back-btn:hover{border-color:var(--primary);color:var(--primary);}
    .refresh-btn{height:34px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface);font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font);font-weight:600;display:flex;align-items:center;gap:5px;transition:all var(--duration-fast) var(--ease-out);}
    .refresh-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(49,130,246,.3);}
    .refresh-btn:active{transform:scale(.97);}
    .spin{display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spinning{animation:spin .6s linear infinite;}

    .tab-bar{display:flex;gap:4px;padding:14px 20px 0;max-width:960px;margin:0 auto;}
    .tab-btn{height:36px;padding:0 16px;border-radius:var(--r-pill) var(--r-pill) 0 0;border:1.5px solid var(--border);border-bottom:none;background:var(--surface2);font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;font-family:var(--font);transition:all var(--duration-fast) var(--ease-out);}
    .tab-btn:hover{color:var(--text2);}
    .tab-btn.active{background:var(--surface);color:var(--primary);border-color:var(--primary) var(--primary) var(--surface);position:relative;z-index:1;}

    .main{max-width:960px;margin:0 auto;padding:0 20px 64px;background:var(--surface);border:1.5px solid var(--border);border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg);margin-top:-1px;}

    /* 요약 */
    .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px 0 0;}
    .summary-card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:16px;transition:transform var(--duration-base) var(--spring),box-shadow var(--duration-base) var(--ease-out);}
    .summary-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
    .summary-card.warn{background:var(--orange-light);border-color:rgba(255,107,0,.2);}
    .summary-card.danger{background:var(--red-light);border-color:rgba(240,68,82,.2);}
    .summary-label{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:500;}
    .summary-val{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;line-height:1;}
    .summary-sub{font-size:11px;color:var(--text4);margin-top:4px;}

    /* 필터 */
    .filter-row{display:flex;align-items:center;gap:8px;padding:16px 0;flex-wrap:wrap;}
    .filter-btn{height:28px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface);font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;font-family:var(--font);transition:all var(--duration-fast) var(--ease-out);}
    .filter-btn:hover{border-color:var(--primary);color:var(--primary);}
    .filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(49,130,246,.2);}
    .search-input{height:32px;padding:0 12px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-family:var(--font);font-size:12px;outline:none;transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out);min-width:140px;}
    .search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}

    /* 테이블 */
    .table-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1.5px solid var(--border);margin-bottom:16px;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    thead{background:var(--surface2);}
    th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text4);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;}
    td{padding:12px 14px;border-top:1px solid var(--border);color:var(--text2);}
    tr:hover td{background:var(--bg);}
    .stock-num{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:-.3px;}
    .stock-ok{color:var(--green);}
    .stock-warn{color:var(--orange);}
    .stock-danger{color:var(--red);}
    .stock-zero{color:var(--text4);}
    .status-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);letter-spacing:.3px;}
    .status-ok{background:var(--green-light);color:var(--green);}
    .status-warn{background:var(--orange-light);color:var(--orange);}
    .status-danger{background:var(--red-light);color:var(--red);}
    .status-soldout{background:var(--surface2);color:var(--text4);}
    .action-btn{height:26px;padding:0 10px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:transparent;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all var(--duration-fast) var(--ease-out);color:var(--text3);}
    .action-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}

    /* 히스토리 */
    .history-list{display:flex;flex-direction:column;gap:0;padding:8px 0;}
    .history-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
    .history-item:last-child{border-bottom:none;}
    .history-time{font-size:10px;color:var(--text4);font-family:var(--mono);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;}
    .history-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);flex-shrink:0;}
    .badge-in{background:var(--green-light);color:var(--green);}
    .badge-out{background:var(--red-light);color:var(--red);}
    .badge-set{background:var(--primary-light);color:var(--primary);}
    .badge-soldout{background:var(--surface2);color:var(--text4);}
    .history-detail{font-size:12px;color:var(--text2);flex:1;}

    /* 차트 */
    .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 0;}
    .chart-card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:16px;}
    .chart-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;letter-spacing:-.2px;}
    .chart-wrap{position:relative;height:180px;}

    /* 설정 */
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 0;}
    .settings-group{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:16px;}
    .settings-label{font-size:11px;font-weight:700;color:var(--text4);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;}
    .settings-field{margin-bottom:10px;}
    .settings-field label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px;}
    .settings-input{width:100%;height:36px;padding:0 10px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-family:var(--font);font-size:12px;outline:none;transition:border-color var(--duration-fast) var(--ease-out);}
    .settings-input:focus{border-color:var(--primary);}
    .save-btn{height:36px;padding:0 18px;border-radius:var(--r-pill);border:none;background:var(--primary);font-size:12px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--font);transition:all var(--duration-fast) var(--ease-out);}
    .save-btn:hover{background:var(--primary-dark);}

    /* 메모 플로팅 패널 */
    #memoFab{position:fixed;bottom:24px;right:24px;z-index:900;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--yellow),var(--orange));border:none;cursor:pointer;font-size:20px;box-shadow:0 4px 16px rgba(255,107,0,.4);transition:transform var(--duration-base) var(--spring),box-shadow var(--duration-base) var(--ease-out);display:flex;align-items:center;justify-content:center;}
    #memoFab:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(255,107,0,.5);}
    .mp-badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:var(--r-pill);display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface);}
    .mp-badge.show{display:flex;}
    #memoPanel{position:fixed;bottom:86px;right:24px;z-index:901;width:320px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);transform:scale(.9) translateY(12px);opacity:0;pointer-events:none;transform-origin:bottom right;transition:transform var(--duration-base) var(--spring),opacity var(--duration-base) var(--ease-out);overflow:hidden;}
    #memoPanel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}
    .mp-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
    .mp-close-btn{width:24px;height:24px;border-radius:50%;border:none;background:var(--surface2);color:var(--text3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all var(--duration-fast) var(--ease-out);}
    .mp-close-btn:hover{background:var(--border);color:var(--text);}
    .mp-body{padding:14px;}
    .mp-input-row{display:flex;gap:8px;margin-bottom:12px;}
    .mp-input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;resize:none;outline:none;transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out);}
    .mp-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .mp-save-btn{height:36px;padding:0 14px;align-self:flex-end;border-radius:var(--r-md);border:none;background:var(--primary);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);flex-shrink:0;transition:all var(--duration-fast) var(--ease-out);}
    .mp-save-btn:hover{background:var(--primary-dark);}
    .mp-list{max-height:240px;overflow-y:auto;}
    .mp-card{padding:10px 0;border-bottom:1px solid var(--border);position:relative;}
    .mp-card:last-child{border-bottom:none;}
    .mp-card-text{font-size:12px;color:var(--text2);line-height:1.6;padding-right:28px;}
    .mp-card-date{font-size:10px;color:var(--text4);margin-top:4px;font-family:var(--mono);}
    .mp-del-btn{position:absolute;top:10px;right:0;width:20px;height:20px;border-radius:50%;border:none;background:transparent;color:var(--text4);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all var(--duration-fast) var(--ease-out);}
    .mp-del-btn:hover{background:var(--red-light);color:var(--red);}
    .mp-empty{font-size:12px;color:var(--text4);text-align:center;padding:20px 0;}
    .mp-toast{position:fixed;bottom:90px;right:80px;z-index:902;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:8px 16px;border-radius:var(--r-pill);opacity:0;transform:translateY(8px);transition:all var(--duration-base) var(--ease-out);pointer-events:none;}
    .mp-toast.show{opacity:1;transform:translateY(0);}

    /* 토스트 */
    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:10px 20px;border-radius:var(--r-pill);opacity:0;transition:all var(--duration-base) var(--ease-out);z-index:9000;white-space:nowrap;pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    .theme-toggle{position:fixed;bottom:20px;left:20px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:999;box-shadow:var(--shadow-sm);transition:transform var(--duration-fast) var(--spring),box-shadow var(--duration-fast) var(--ease-out);-webkit-tap-highlight-color:transparent;}
    .theme-toggle:hover{transform:scale(1.08);box-shadow:var(--shadow-md);}

    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @media(min-width:600px){.summary-grid{grid-template-columns:repeat(4,1fr);}}
    @media(max-width:599px){.summary-grid{grid-template-columns:1fr 1fr;}.chart-grid{grid-template-columns:1fr;}.settings-grid{grid-template-columns:1fr;}.main{padding:0 14px 64px;}.tab-bar{padding:14px 14px 0;overflow-x:auto;}.table-wrap{font-size:11px;}}
    @media(max-width:480px){#memoPanel{width:calc(100vw - 32px);right:16px;bottom:82px;}#memoFab{width:46px;height:46px;font-size:18px;bottom:20px;right:18px;}}

</style>
<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function __themeInit() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>
</head>
<body>

<header>
  <a href="/" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    메인
  </a>
  <div class="header-info">
    <div class="header-title">📦 재고 현황</div>
    <div class="header-sub" id="lastSync">로딩 중...</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="copyInputUrl(this)" title="입력 페이지 주소 복사">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button class="icon-btn" id="refreshBtn" onclick="handleRefresh(this)" title="새로고침">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <a href="/100yearinventory" class="icon-btn" title="재고 입력">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <span class="api-pill off" id="apiPill">● 미연결</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('stock', this)">재고 현황</button>
  <button class="tab" onclick="switchTab('history', this)">변동 이력</button>
  <button class="tab" onclick="switchTab('chart', this)">판매 추이</button>
  <button class="tab" onclick="switchTab('settings', this)">설정</button>
</div>

<div class="content">

  <!-- ══ 재고 현황 ══ -->
  <div class="tab-panel active" id="panel-stock">
    <div class="summary-grid">
      <div class="sum-card"><div class="sum-label">전체</div><div class="sum-value" id="s-total">—</div></div>
      <div class="sum-card c-green"><div class="sum-label">정상</div><div class="sum-value" id="s-normal">—</div></div>
      <div class="sum-card c-red"><div class="sum-label">임박</div><div class="sum-value" id="s-alert">—</div></div>
      <div class="sum-card"><div class="sum-label">매진</div><div class="sum-value" style="color:var(--text3)" id="s-sold">—</div></div>
    </div>
    <div class="section-hd">
      <div class="section-title">상품별 재고</div>
      <input class="search-box" type="search" placeholder="검색..." id="searchInput" oninput="renderTable()" autocomplete="off" />
    </div>
    <table class="stock-table">
      <thead>
        <tr>
          <th>상품명</th>
          <th>재고</th>
          <th>임박 기준</th>
          <th>매진 시각</th>
          <th>조작</th>
        </tr>
      </thead>
      <tbody id="stockBody"></tbody>
    </table>
  </div>

  <!-- ══ 변동 이력 ══ -->
  <div class="tab-panel" id="panel-history">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setHFilter('all',this)">전체</button>
      <button class="filter-btn" onclick="setHFilter('add',this)">추가</button>
      <button class="filter-btn" onclick="setHFilter('minus',this)">차감</button>

  <!-- ══ 판매 추이 ══ -->
  <div class="tab-panel" id="panel-chart">
    <div class="chart-controls">
      <button class="period-btn active" onclick="setPeriod('daily',this)">일별</button>
      <button class="period-btn" onclick="setPeriod('weekly',this)">주별</button>
      <button class="period-btn" onclick="setPeriod('monthly',this)">월별</button>

        <option value="all">전체 상품</option>

      <div class="chart-title" id="chartTitle">일별 판매량 추이</div>

    <div class="empty" id="chartEmpty" style="display:none">
      <div class="empty-icon">📊</div>
      <div class="empty-text">판매 이력이 없습니다</div>
    </div>
  </div>

  <!-- ══ 설정 ══ -->
  <div class="tab-panel" id="panel-settings">
    <div class="settings-block">
      <div class="settings-block-title">🔌 EasyPOS API 연동</div>
      <div class="form-group">
        <label class="form-label">본부 코드 (hd_code)</label>
        <input class="form-input" id="s-hd" placeholder="예: HYW" />
      </div>
      <div class="form-group">
        <label class="form-label">매장 코드 (sp_code)</label>
        <input class="form-input" id="s-sp" placeholder="KICC 담당자 확인 필요" />
        <div class="form-hint" style="color:var(--red)">sp_code 없이는 자동 연동 불가 — 수동 입력으로 운영</div>
      </div>
      <div class="form-group">
        <label class="form-label">자동 동기화 주기 (분)</label>
        <input class="form-input" type="number" id="s-interval" value="30" min="5" max="1440" />
      </div>
      <button class="btn-save" onclick="saveApiSettings()">저장</button>
    </div>
    <div class="settings-block">
      <div class="settings-block-title">⚠️ 매진 임박 기준</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">임박 기준 (개 이하)</label>
          <input class="form-input" type="number" id="s-th" value="10" min="1" />
        </div>
        <div class="form-group">
          <label class="form-label">경고 기준 (개 이하)</label>
          <input class="form-input" type="number" id="s-warn" value="20" min="1" />
        </div>
      </div>
      <div class="form-hint" style="margin-bottom:14px">상품별 개별 설정 시 기본값 무시됩니다</div>
      <button class="btn-save" onclick="saveThreshold()">저장</button>
    </div>
  </div>

</div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()" aria-label="상품 추가">+</button>

<!-- ══ 모달: 상품 추가/수정 ══ -->
<div class="modal-overlay" id="m-product" onclick="overlayClose(this)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="m-product-title">상품 추가</div>

      <label class="form-label">상품명 *</label>
      <input class="form-input" id="f-name" placeholder="예: 백설기" autocomplete="off" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">상품 코드 (선택)</label>
        <input class="form-input" id="f-code" placeholder="EasyPOS 코드" autocomplete="off" />
      </div>
      <div class="form-group">
        <label class="form-label">초기 재고 수량</label>
        <input class="form-input" type="number" id="f-stock" placeholder="0" min="0" inputmode="numeric" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">임박 기준 (개) — 비우면 기본값</label>

      <button class="btn-primary" onclick="saveProduct()">저장</button>

  </div>
</div>

<!-- ══ 모달: 재고 조정 ══ -->
<div class="modal-overlay" id="m-adjust" onclick="overlayClose(this)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="m-adjust-title">재고 추가</div>
    <input type="hidden" id="adj-id" />
    <input type="hidden" id="adj-type" />
    <div class="form-group">
      <label class="form-label">수량 *</label>
      <input class="form-input" type="number" id="adj-qty" placeholder="0" min="1" inputmode="numeric" />
    </div>
    <div class="form-group">
      <label class="form-label">메모 (선택)</label>
      <input class="form-input" id="adj-note" placeholder="예: 오전 추가 생산" autocomplete="off" />
    </div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal('m-adjust')">취소</button>
      <button class="btn-primary" onclick="applyAdjust()">적용</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── 유틸 ──
function nowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── 상태 ──
const DEFAULT_STATE = () => ({
  products: [],
  history: [],
  settings: { hd_code:'HYW', sp_code:'', alert_threshold:10, warning_threshold:20, sync_interval:30 }
});
let state = DEFAULT_STATE();
let historyFilter = 'all';
let chartPeriod = 'daily';
let chartObj = null;
let editingId = null; // 상품 고유 id

// ── 상품 고유 ID ── item_code 있으면 사용, 없으면 _id(uuid-like)
function getPid(p) { return p.item_code || p._id; }

// ── 데이터 로드/저장 ──
async function loadData() {
  try {
    const r = await fetch('/api/inventory');
    if (!r.ok) throw new Error('fetch fail');
    const d = await r.json();
    // _id 없는 기존 상품 마이그레이션
    (d.products||[]).forEach((p,i) => { if (!p._id) p._id = 'p_' + Date.now() + '_' + i; });
    state = { ...DEFAULT_STATE(), ...d };
    state.settings = { ...DEFAULT_STATE().settings, ...(d.settings||{}) };
  } catch(e) { console.warn('loadData error', e); }
}

async function saveData() {
  try {
    await fetch('/api/inventory', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
  } catch(e) { console.warn('saveData error', e); }
}

// ── 새로고침 ──
async function handleRefresh(btn) {
  btn.classList.add('spinning');
  await loadData();
  renderAll();
  syncSettingsForm();
  btn.classList.remove('spinning');
  updateLastSync();
  showToast('새로고침 완료');
}

function updateLastSync() {
  document.getElementById('lastSync').textContent = '마지막 동기화: ' + nowStr();
}

// ── 탭 전환 ── (event 객체 대신 el 파라미터 사용)
function switchTab(name, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'chart') renderChart();
}

// ── 렌더 전체 ──
function renderAll() {
  renderTable();
  renderHistory();
  updateSummary();
  updateChartSelect();
}

// ── 요약 ──
function updateSummary() {
  const def = state.settings.alert_threshold || 10;
  let total=0, normal=0, alert=0, sold=0;
  state.products.forEach(p => {
    total++;
    const th = p.threshold != null ? p.threshold : def;
    if (p.current_stock <= 0) sold++;
    else if (p.current_stock <= th) alert++;
    else normal++;
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-normal').textContent = normal;
  document.getElementById('s-alert').textContent = alert;
  document.getElementById('s-sold').textContent = sold;
}

// ── 테이블 ──
function renderTable() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const def = state.settings.alert_threshold || 10;
  const warn = state.settings.warning_threshold || (def * 2);
  const tbody = document.getElementById('stockBody');
  const list = state.products.filter(p => !kw || p.item_name.toLowerCase().includes(kw));

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">📦</div><div class="empty-text">${kw?'검색 결과 없음':'상품을 추가해주세요 (우측 하단 + 버튼)'}</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(p => {
    const pid = getPid(p);
    const th = p.threshold != null ? p.threshold : def;
    const wn = p.threshold != null ? th * 2 : warn;
    let badge;
    if (p.current_stock <= 0)        badge = `<span class="stock-badge soldout">● 매진</span>`;
    else if (p.current_stock <= th)  badge = `<span class="stock-badge danger blink">⚠ ${p.current_stock}개</span>`;
    else if (p.current_stock <= wn)  badge = `<span class="stock-badge warning">▲ ${p.current_stock}개</span>`;
    else                             badge = `<span class="stock-badge normal">✓ ${p.current_stock}개</span>`;

    const pid_esc = pid.replace(/'/g,"\\'");
    return `<tr>
      <td data-label="상품명">
        <div class="pname">${p.item_name}</div>
        <div class="pcode">${p.item_code||'코드 없음'}</div>
      </td>
      <td data-label="재고">${badge}</td>
      <td data-label="임박 기준"><span class="th-badge">${th}개 이하</span></td>
      <td data-label="매진 시각">${p.soldout_at?`<div class="soldout-time">🕐 ${p.soldout_at}</div>`:'<span style="color:var(--border2);font-size:12px">—</span>'}</td>
      <td data-label="">
        <div class="row-actions">
          <button class="btn-xs bxa" onclick="openAdjust('${pid_esc}','add')">+ 추가</button>
          <button class="btn-xs bxm" onclick="openAdjust('${pid_esc}','minus')">− 차감</button>
          <button class="btn-xs bxe" onclick="openEditModal('${pid_esc}')">수정</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── 이력 ──
function renderHistory() {
  const list = document.getElementById('historyList');
  let items = [...state.history].reverse();
  if (historyFilter !== 'all') items = items.filter(h => h.type === historyFilter);
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">이력이 없습니다</div></div>`;
    return;
  }
  const typeLabel = { add:'추가', minus:'차감', soldout:'매진', init:'초기설정', pos:'POS차감' };
  list.innerHTML = items.slice(0, 100).map(h => {
    const isPlus = h.type === 'add' || h.type === 'init';
    const qtyStr = h.type === 'soldout' ? '매진' : `${isPlus?'+':'-'}${h.qty}`;
    return `<div class="h-item">
      <div class="h-dot ${h.type==='pos'?'pos':h.type}"></div>
      <div class="h-info">
        <div class="h-name">${h.item_name||h.item_code||'—'}</div>
        <div class="h-note">${typeLabel[h.type]||h.type}${h.note?' · '+h.note:''}</div>
      </div>
      <div class="h-qty ${isPlus?'p':'m'}">${qtyStr}</div>
      <div class="h-time">${(h.datetime||'').replace(' ','<br>')}</div>
    </div>`;
  }).join('');
}

function setHFilter(f, el) {
  historyFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderHistory();
}

// ── 차트 ──
function updateChartSelect() {
  const sel = document.getElementById('chartProduct');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">전체 상품</option>' +
    state.products.map(p => `<option value="${getPid(p)}">${p.item_name}</option>`).join('');
  sel.value = cur || 'all';
}

function setPeriod(p, el) {
  chartPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderChart();
}

function renderChart() {
  const canvas = document.getElementById('salesCanvas');
  const empty = document.getElementById('chartEmpty');
  const titleEl = document.getElementById('chartTitle');
  const pf = document.getElementById('chartProduct').value;

  let items = state.history.filter(h => h.type === 'minus' || h.type === 'pos');
  if (pf !== 'all') items = items.filter(h => getPid(h) === pf || h.item_code === pf || h._id === pf);

  if (!items.length) {
    canvas.style.display = 'none'; empty.style.display = 'block'; return;
  }
  canvas.style.display = 'block'; empty.style.display = 'none';

  const buckets = {};
  items.forEach(h => {
    if (!h.datetime) return;
    const dt = h.datetime.replace(' ','T');
    const d = new Date(dt);
    if (isNaN(d)) return;
    let key;
    if (chartPeriod === 'daily') key = h.datetime.slice(0,10);
    else if (chartPeriod === 'weekly') {
      const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
      key = mon.toISOString().slice(0,10);
    } else key = h.datetime.slice(0,7);
    buckets[key] = (buckets[key]||0) + (h.qty||0);
  });

  const labels = Object.keys(buckets).sort();
  const data = labels.map(k => buckets[k]);
  const pmap = { daily:'일별', weekly:'주별', monthly:'월별' };
  titleEl.textContent = `${pmap[chartPeriod]} 판매량 추이`;

  if (chartObj) { chartObj.destroy(); chartObj = null; }
  chartObj = new Chart(canvas, {
    type:'bar',
    data: { labels, datasets:[{ label:'판매 수량', data, backgroundColor:'rgba(139,92,246,.45)', borderColor:'#8b5cf6', borderWidth:2, borderRadius:5 }] },
    options: {
      responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false } },
      scales: {
        x:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'var(--border)' } },
        y:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'var(--border)' }, beginAtZero:true }
      }
    }
  });
}

// ── 상품 추가/수정 ──
function openAddModal() {
  editingId = null;
  document.getElementById('m-product-title').textContent = '상품 추가';
  ['f-name','f-code','f-threshold'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-stock').value = '';
  document.getElementById('m-product').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 200);
}

function openEditModal(pid) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  editingId = pid;
  document.getElementById('m-product-title').textContent = '상품 수정';
  document.getElementById('f-name').value = p.item_name;
  document.getElementById('f-code').value = p.item_code||'';
  document.getElementById('f-stock').value = p.current_stock;
  document.getElementById('f-threshold').value = p.threshold != null ? p.threshold : '';
  document.getElementById('m-product').classList.add('open');
}

async function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  const code = document.getElementById('f-code').value.trim();
  const stock = parseInt(document.getElementById('f-stock').value)||0;
  const thVal = document.getElementById('f-threshold').value;
  const threshold = thVal !== '' ? parseInt(thVal) : null;
  if (!name) { showToast('상품명을 입력해주세요'); return; }

  if (editingId) {
    const p = state.products.find(p => getPid(p) === editingId);
    if (p) { p.item_name=name; p.item_code=code; p.current_stock=stock; p.threshold=threshold; }
  } else {
    // 중복 체크 (코드 있을 때만)
    if (code && state.products.find(p => p.item_code && p.item_code === code)) {
      showToast('이미 등록된 상품 코드입니다'); return;
    }
    const newP = { _id:'p_'+Date.now(), item_code:code, item_name:name, current_stock:stock, threshold, soldout_at:null };
    state.products.push(newP);
    addHistory({ type:'init', _id:newP._id, item_code:code, item_name:name, qty:stock, note:'초기 설정' });
    updateChartSelect();
  }
  await saveData();
  closeModal('m-product');
  renderTable(); updateSummary();
  showToast(editingId ? '수정되었습니다' : '상품이 추가되었습니다');
}

// ── 재고 조정 ──
function openAdjust(pid, type) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  document.getElementById('m-adjust-title').textContent = (type==='add'?'재고 추가':'재고 차감') + ` — ${p.item_name}`;
  document.getElementById('adj-id').value = pid;
  document.getElementById('adj-type').value = type;
  document.getElementById('adj-qty').value = '';
  document.getElementById('adj-note').value = '';
  document.getElementById('m-adjust').classList.add('open');
  setTimeout(() => document.getElementById('adj-qty').focus(), 200);
}

async function applyAdjust() {
  const pid = document.getElementById('adj-id').value;
  const type = document.getElementById('adj-type').value;
  const qty = parseInt(document.getElementById('adj-qty').value);
  const note = document.getElementById('adj-note').value.trim();
  if (!qty || qty <= 0) { showToast('수량을 입력해주세요'); return; }

  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;

  if (type === 'add') {
    p.current_stock += qty;
    if (p.current_stock > 0) p.soldout_at = null;
  } else {
    p.current_stock = Math.max(0, p.current_stock - qty);
    if (p.current_stock === 0 && !p.soldout_at) {
      p.soldout_at = nowStr();
      addHistory({ type:'soldout', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:0, note:'매진' });
    }
  }
  addHistory({ type, _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty, note });
  await saveData();
  closeModal('m-adjust');
  renderTable(); renderHistory(); updateSummary();
  showToast(type==='add' ? `+${qty}개 추가됨` : `−${qty}개 차감됨`);
}

function addHistory(entry) {
  if (!state.history) state.history = [];
  state.history.push({ ...entry, datetime: nowStr() });
  // 이력 최대 500건 유지
  if (state.history.length > 500) state.history = state.history.slice(-500);
}

// ── 설정 ──
function syncSettingsForm() {
  document.getElementById('s-hd').value = state.settings.hd_code||'HYW';
  document.getElementById('s-sp').value = state.settings.sp_code||'';
  document.getElementById('s-interval').value = state.settings.sync_interval||30;
  document.getElementById('s-th').value = state.settings.alert_threshold||10;
  document.getElementById('s-warn').value = state.settings.warning_threshold||20;
  const pill = document.getElementById('apiPill');
  if (state.settings.sp_code) { pill.textContent='● 연결됨'; pill.className='api-pill on'; }
  else { pill.textContent='● 미연결'; pill.className='api-pill off'; }
}

async function saveApiSettings() {
  state.settings.hd_code = document.getElementById('s-hd').value.trim();
  state.settings.sp_code = document.getElementById('s-sp').value.trim();
  state.settings.sync_interval = parseInt(document.getElementById('s-interval').value)||30;
  await saveData(); syncSettingsForm(); showToast('저장되었습니다');
}

async function saveThreshold() {
  state.settings.alert_threshold = parseInt(document.getElementById('s-th').value)||10;
  state.settings.warning_threshold = parseInt(document.getElementById('s-warn').value)||20;
  await saveData(); renderTable(); updateSummary(); showToast('기준 수량 저장됨');
}

// ── 모달 ──
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function overlayClose(el) { el.classList.remove('open'); }

// ── 토스트 ──

function copyInputUrl(btn) {
  const url = window.location.origin + '/100yearinventory';
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'rgba(74,222,128,.4)';
    showToast('입력 페이지 주소가 복사됐습니다');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  }).catch(() => {
    // clipboard API 실패 시 fallback
    const ta = document.createElement('textarea');
    ta.value = window.location.origin + '/100yearinventory';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('입력 페이지 주소가 복사됐습니다');
  });
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 초기화 ──
async function init() {
  await loadData();
  renderAll();
  syncSettingsForm();
  updateLastSync();
}

init();
</script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel('' + m.id + '')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
</body>
</html>
