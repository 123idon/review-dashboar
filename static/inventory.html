<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>재고 현황 — 백년화편</title>
  <style>
/* =====================================================
   백년화편 디자인 시스템 — 토스 스타일
   모든 페이지 공통 적용
   ===================================================== */

/* ─── 라이트 모드 ─── */
[data-theme="day"], :root {
  --bg:           #F9FAFB;
  --bg2:          #F2F4F6;
  --surface:      #FFFFFF;
  --surface2:     #F2F4F6;
  --border:       #E5E8EB;
  --border2:      #CDD1D8;
  --text:         #191F28;
  --text2:        #333D4B;
  --text3:        #6B7684;
  --text4:        #B0B8C1;
  --muted:        #6B7684;

  /* 퍼스널 컬러 — 브랜드 앰버·오렌지 */
  --brand:        #F5820D;
  --brand-dark:   #D96E00;
  --brand-bg:     #FFF4E6;
  --brand-light:  #FFF4E6;
  --brand-rgb:    245,130,13;
  --accent-d:     #F5820D;

  --blue:         #3182F6;
  --blue-bg:      #EBF3FE;
  --blue-light:   #EBF3FE;
  --blue-rgb:     49,130,246;

  --red:          #F04452;
  --red-bg:       #FFF0F0;
  --red-light:    #FFF0F0;
  --danger:       #F04452;
  --danger-bg:    #FFF0F0;

  --green:        #00A86B;
  --green-bg:     #E8FAF4;
  --green-light:  #E8FAF4;
  --positive:     #00A86B;
  --positive-bg:  #E8FAF4;

  --purple:       #6C47FF;
  --purple-bg:    #F3F0FF;
  --purple-light: #F3F0FF;

  --teal:         #00BCD4;
  --teal-bg:      #E6F9FC;
  --teal-light:   #E6F9FC;

  --amber:        #F59E0B;
  --amber-bg:     #FFFAEB;
  --amber-light:  #FFFAEB;

  --mono:         'SF Mono','JetBrains Mono',monospace;
  --r-pill:       50px;

  /* 그림자 — 두 세트 동시 지원 */
  --sh-xs:        0 1px 2px rgba(0,0,0,.05);
  --sh-sm:        0 2px 8px rgba(0,0,0,.07);
  --sh-md:        0 4px 16px rgba(0,0,0,.09);
  --sh-lg:        0 8px 32px rgba(0,0,0,.11);
  --sh-xl:        0 20px 56px rgba(0,0,0,.13);
  --sh-brand:     0 4px 14px rgba(245,130,13,.28);
  --sh-blue:      0 4px 14px rgba(49,130,246,.25);
  --shadow-xs:0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 2px 10px rgba(0,0,0,.5);
  --shadow-md:0 4px 20px rgba(0,0,0,.6);
  --shadow-xl:0 20px 56px rgba(0,0,0,.8);
  --shadow-brand: 0 4px 14px rgba(245,130,13,.28);
  --shadow-blue:  0 4px 14px rgba(49,130,246,.25);
}

/* ─── 다크 모드 ─── */


/* ─── 리셋 ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s ease, color .2s ease;
}

/* ─── 키프레임 ─── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
@keyframes spin     { to{transform:rotate(360deg)} }
@keyframes dotBlink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
@keyframes shimmer  { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.72)} }
@keyframes spring   { 0%{transform:scale(.88) translateY(14px);opacity:0} 100%{transform:scale(1) translateY(0);opacity:1} }

/* ─── 공통 컴포넌트 ─── */

/* 스켈레톤 */
.skeleton {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 400px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}

/* 스피너 */
.spinner {
  width: 26px; height: 26px;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}

/* 프로그레스 바 */
.progress-wrap { position:fixed; top:0; left:0; width:100%; height:3px; z-index:9999; pointer-events:none; }
.progress-bar  {
  height:100%; width:0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* 토스트 */
#toast {
  position:fixed; bottom:32px; left:50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg);
  font-size:13px; font-weight:700;
  padding:10px 22px; border-radius:50px;
  opacity:0; pointer-events:none; z-index:9999;
  white-space:nowrap;
  transition: opacity 200ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 테마 버튼 */




/* 메모 FAB */
#memoFab {
  position:fixed; bottom:22px; right:22px; z-index:900;
  width:52px; height:52px; border-radius:50%;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  color:#fff; border:none; cursor:pointer; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--sh-brand);
  transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color:transparent;
}
#memoFab:hover  { transform:scale(1.1) rotate(-6deg); box-shadow:0 8px 28px rgba(var(--brand-rgb),.45); }
#memoFab:active { transform:scale(.94); }

.mp-badge {
  position:absolute; top:5px; right:5px;
  min-width:17px; height:17px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9px; font-weight:800; border-radius:50px;
  border:2.5px solid var(--surface);
  display:none; align-items:center; justify-content:center;
}
.mp-badge.show { display:flex; }

/* 메모 패널 */
#memoPanel {
  position:fixed; bottom:84px; right:22px; z-index:901;
  width:320px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:20px; box-shadow:var(--sh-xl); overflow:hidden;
  transform:scale(.88) translateY(14px); transform-origin:bottom right;
  opacity:0; pointer-events:none;
  transition: transform 280ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease;
}
#memoPanel.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }

.mp-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--border);
  font-size:14px; font-weight:700;
}
.mp-close-btn {
  width:26px; height:26px; border-radius:50%;
  border:none; background:var(--surface2); color:var(--text3);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-close-btn:hover { background:var(--border); color:var(--text); }

.mp-body { padding:14px 18px; }
.mp-input-row { display:flex; gap:8px; margin-bottom:12px; }
.mp-input {
  flex:1; padding:10px 12px;
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:12px; color:var(--text);
  font-family:inherit; font-size:13px; line-height:1.6;
  resize:none; outline:none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }

.mp-save-btn {
  height:36px; padding:0 14px; align-self:flex-end;
  border-radius:50px; border:none;
  background:var(--brand); color:#fff;
  font-family:inherit; font-size:12px; font-weight:700;
  cursor:pointer; flex-shrink:0;
  transition:all 150ms ease;
}
.mp-save-btn:hover   { background:var(--brand-dark); }
.mp-save-btn:active  { transform:scale(.96); }
.mp-save-btn:disabled { opacity:.5; cursor:not-allowed; }

.mp-list { max-height:260px; overflow-y:auto; scrollbar-width:thin; }

.mp-card { padding:10px 0; border-bottom:1px solid var(--border); position:relative; }
.mp-card:last-child { border-bottom:none; }
.mp-card-text { font-size:12px; color:var(--text2); line-height:1.6; padding-right:28px; }
.mp-card-date { font-size:10px; color:var(--text4); margin-top:4px; font-variant-numeric:tabular-nums; }
.mp-del-btn {
  position:absolute; top:10px; right:0;
  width:22px; height:22px; border-radius:50%;
  border:none; background:transparent; color:var(--text4);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-del-btn:hover { background:var(--red-bg); color:var(--red); }
.mp-empty { font-size:12px; color:var(--text4); text-align:center; padding:20px 0; }

.mp-toast {
  position:fixed; bottom:88px; right:80px; z-index:902;
  background:var(--text); color:var(--bg);
  font-size:12px; font-weight:700;
  padding:8px 16px; border-radius:50px;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:all 200ms ease;
}
.mp-toast.show { opacity:1; transform:translateY(0); }

@media (max-width:480px) {
  #memoPanel { width:calc(100vw - 28px); right:14px; bottom:78px; }
  #memoFab   { width:48px; height:48px; right:16px; bottom:18px; }
}


.app-header,.header { position:sticky; top:0; z-index:100; height:56px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:12px; box-shadow:var(--sh-xs); }
.header-info { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.header-title,.page-title { font-size:15px; font-weight:800; letter-spacing:-.4px; }
.header-sub,.page-sub { font-size:10px; color:var(--text4); }
.header-actions { display:flex; align-items:center; gap:8px; margin-left:auto; }
.back-btn,.back-link { display:inline-flex; align-items:center; gap:5px; height:32px; padding:0 12px; border-radius:50px; border:1.5px solid var(--border); background:transparent; font-size:12px; font-weight:600; color:var(--text3); text-decoration:none; cursor:pointer; transition:all 150ms ease; }
.back-btn:hover,.back-link:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-bg); }
/* 탭 */
.tabs { display:flex; background:var(--surface2); border-radius:10px; padding:3px; gap:2px; overflow-x:auto; scrollbar-width:none; max-width:fit-content; }
.tabs::-webkit-scrollbar { display:none; }
.tab { height:30px; padding:0 14px; border-radius:8px; border:none; background:transparent; font-family:inherit; font-size:12px; font-weight:600; color:var(--text3); cursor:pointer; white-space:nowrap; transition:all 150ms ease; }
.tab:hover { color:var(--text2); }
.tab.active { background:var(--surface); color:var(--teal); box-shadow:var(--sh-xs); }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
/* 레이아웃 */
.content { max-width:960px; margin:0 auto; padding:16px 20px 80px; }
.section { margin-bottom:22px; }
.section-hd,.section-title { font-size:11px; font-weight:700; color:var(--text4); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
/* 요약 */
.summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
.sum-card { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:16px; transition:transform 250ms cubic-bezier(0.34,1.56,0.64,1),box-shadow 200ms ease; animation:fadeUp 280ms cubic-bezier(0.16,1,0.3,1) both; }
.sum-card:hover { transform:translateY(-2px); box-shadow:var(--sh-md); }
.sum-card.c-red { background:var(--red-bg); border-color:rgba(240,68,82,.2); }
.sum-card.c-green { background:var(--green-bg); border-color:rgba(0,168,107,.2); }
.sum-label { font-size:11px; color:var(--text3); margin-bottom:7px; font-weight:500; }
.sum-value { font-size:28px; font-weight:900; letter-spacing:-1.4px; line-height:1; font-variant-numeric:tabular-nums; }
/* 필터 */
.filter-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.filter-btn { height:28px; padding:0 12px; border-radius:50px; border:1.5px solid var(--border); background:transparent; font-family:inherit; font-size:11px; font-weight:700; color:var(--text3); cursor:pointer; transition:all 150ms ease; }
.filter-btn:hover { border-color:var(--teal); color:var(--teal); }
.filter-btn.active { background:var(--teal); border-color:var(--teal); color:#fff; }
.search-box { height:32px; padding:0 12px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text); font-family:inherit; font-size:12px; outline:none; transition:border-color 150ms ease; min-width:130px; }
.search-box:focus { border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-bg); }
.period-btn { height:28px; padding:0 12px; border-radius:50px; border:1.5px solid var(--border); background:transparent; font-family:inherit; font-size:11px; font-weight:700; color:var(--text3); cursor:pointer; transition:all 150ms ease; }
.period-btn:hover { border-color:var(--teal); color:var(--teal); }
.period-btn.active { background:var(--teal); border-color:var(--teal); color:#fff; }
/* 테이블 */
.stock-table,.table-wrap { overflow-x:auto; border-radius:12px; border:1.5px solid var(--border); }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead { background:var(--surface2); }
th { padding:10px 14px; text-align:left; font-size:10px; font-weight:700; color:var(--text4); letter-spacing:.7px; text-transform:uppercase; white-space:nowrap; }
td { padding:12px 14px; border-top:1px solid var(--border); color:var(--text2); }
tr:hover td { background:var(--bg); }
.c-green { color:var(--green); font-weight:800; font-variant-numeric:tabular-nums; }
.c-red   { color:var(--red);   font-weight:800; font-variant-numeric:tabular-nums; }
.status-tag,.api-pill { display:inline-flex; align-items:center; font-size:10px; font-weight:700; padding:2px 8px; border-radius:50px; letter-spacing:.3px; }
/* 버튼 */
.btn-primary,.btn-save { height:36px; padding:0 18px; border-radius:50px; border:none; background:var(--teal); color:#fff; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; transition:all 150ms ease; }
.btn-primary:hover,.btn-save:hover { filter:brightness(1.08); transform:translateY(-1px); }
.btn-primary:active,.btn-save:active { transform:scale(.97); }
.btn-secondary { height:36px; padding:0 18px; border-radius:50px; border:1.5px solid var(--border); background:transparent; font-family:inherit; font-size:12px; font-weight:700; color:var(--text2); cursor:pointer; transition:all 150ms ease; }
.btn-secondary:hover { border-color:var(--border2); background:var(--surface2); }
.icon-btn { width:32px; height:32px; border-radius:50%; border:1.5px solid var(--border); background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; transition:all 150ms ease; }
.icon-btn:hover { border-color:var(--brand); background:var(--brand-bg); }
.fab { position:fixed; bottom:22px; right:22px; z-index:800; width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--teal),var(--blue)); color:#fff; border:none; cursor:pointer; font-size:22px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,188,212,.35); transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1); }
.fab:hover { transform:scale(1.1); }
/* 기타 */
.history-list { display:flex; flex-direction:column; }
.chart-wrap { position:relative; height:200px; }
.chart-controls { display:flex; gap:6px; margin-bottom:10px; }
.chart-title { font-size:13px; font-weight:700; color:var(--text2); margin-bottom:10px; }
.form-group { margin-bottom:12px; }
.form-label { display:block; font-size:12px; font-weight:700; color:var(--text2); margin-bottom:5px; }
.form-input { width:100%; height:40px; padding:0 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); font-family:inherit; font-size:13px; outline:none; transition:border-color 150ms ease; }
.form-input:focus { border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-bg); }
.form-hint { font-size:11px; color:var(--text4); margin-top:4px; }
.form-row { display:flex; gap:8px; }
.settings-block { background:var(--surface2); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
.settings-block-title { font-size:11px; font-weight:700; color:var(--text4); letter-spacing:.6px; text-transform:uppercase; margin-bottom:12px; }
.empty { text-align:center; padding:48px 20px; }
.empty-icon { font-size:36px; margin-bottom:14px; }
.empty-text { font-size:14px; color:var(--text3); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:500; display:none; align-items:flex-end; justify-content:center; }
.modal { background:var(--surface); border-radius:20px 20px 0 0; padding:20px 20px 32px; width:100%; max-width:480px; box-shadow:var(--sh-xl); }
.modal-handle { width:32px; height:4px; background:var(--border2); border-radius:50px; margin:0 auto 16px; }
.modal-title { font-size:16px; font-weight:800; margin-bottom:16px; letter-spacing:-.4px; }
.modal-btns { display:flex; gap:8px; margin-top:16px; }
.product-select,.product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
.off { opacity:.5; }
.toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--text); color:var(--bg); font-size:13px; font-weight:700; padding:10px 22px; border-radius:50px; opacity:0; pointer-events:none; z-index:9999; white-space:nowrap; transition:all 200ms ease; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
/* mp */
.mp-card{padding:10px 0;border-bottom:1px solid var(--border);position:relative;} .mp-card:last-child{border-bottom:none;} .mp-card-text{font-size:12px;color:var(--text2);line-height:1.6;padding-right:28px;} .mp-card-date{font-size:10px;color:var(--text4);margin-top:4px;} .mp-del-btn{position:absolute;top:10px;right:0;width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text4);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 150ms ease;} .mp-del-btn:hover{background:var(--red-bg);color:var(--red);} .mp-empty{font-size:12px;color:var(--text4);text-align:center;padding:20px 0;}
@media(max-width:599px){.content{padding:12px 14px 80px;} .summary-grid{grid-template-columns:1fr 1fr;}}


/* ─── inventory 동적 렌더 클래스 ─── */

/* 재고 배지 */
.stock-badge {
  display:inline-flex; align-items:center; gap:5px;
  font-size:12px; font-weight:700; padding:4px 10px; border-radius:50px;
  letter-spacing:.2px;
}
.stock-badge.normal  { background:var(--green-bg); color:var(--green); }
.stock-badge.warning { background:var(--amber-bg); color:var(--amber); }
.stock-badge.danger  { background:var(--red-bg); color:var(--red); }
.stock-badge.soldout { background:var(--surface2); color:var(--text4); }
.stock-badge.blink   { animation:blink-anim .9s step-end infinite; }
@keyframes blink-anim { 0%,100%{opacity:1} 50%{opacity:.4} }

/* 상품명/코드 */
.pname { font-size:13px; font-weight:600; color:var(--text2); }
.pcode { font-size:11px; color:var(--text4); margin-top:2px; }

/* 임박 기준 배지 */
.th-badge {
  display:inline-flex; font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:50px;
  background:var(--surface2); color:var(--text3);
}

/* 매진 시각 */
.soldout-time { font-size:11px; color:var(--red); }

/* 테이블 액션 버튼 */
.row-actions { display:flex; gap:5px; flex-wrap:wrap; }
.btn-xs {
  height:26px; padding:0 10px; border-radius:50px;
  border:1.5px solid var(--border); background:transparent;
  font-family:inherit; font-size:11px; font-weight:700;
  cursor:pointer; transition:all 150ms ease;
  white-space:nowrap;
}
.btn-xs:active { transform:scale(.96); }
.bxa { color:var(--green); border-color:rgba(0,168,107,.3); }
.bxa:hover { background:var(--green-bg); border-color:var(--green); }
.bxm { color:var(--red); border-color:rgba(240,68,82,.3); }
.bxm:hover { background:var(--red-bg); border-color:var(--red); }
.bxe { color:var(--text3); }
.bxe:hover { background:var(--surface2); border-color:var(--border2); color:var(--text2); }

/* 이력 로우 */
.history-row {
  display:flex; align-items:center; gap:12px;
  padding:10px 0; border-bottom:1px solid var(--border);
  animation:fadeUp 200ms ease both;
}
.history-row:last-child { border-bottom:none; }
.h-time   { font-size:10px; color:var(--text4); white-space:nowrap; font-variant-numeric:tabular-nums; flex-shrink:0; min-width:130px; }
.h-type   { font-size:10px; font-weight:700; padding:2px 8px; border-radius:50px; flex-shrink:0; }
.ht-in      { background:var(--green-bg); color:var(--green); }
.ht-out     { background:var(--red-bg);   color:var(--red); }
.ht-set     { background:var(--blue-bg);  color:var(--blue); }
.ht-soldout { background:var(--surface2); color:var(--text4); }
.h-detail   { font-size:12px; color:var(--text2); flex:1; }
.h-qty      { font-size:13px; font-weight:800; flex-shrink:0; font-variant-numeric:tabular-nums; }

/* 차트 컨테이너 */
.chart-box       { background:var(--bg); border:1.5px solid var(--border); border-radius:14px; padding:16px; }
.chart-box-title { font-size:13px; font-weight:700; color:var(--text2); margin-bottom:12px; }

/* 모달 오버레이 열림 */
.modal-overlay.open { display:flex; }

/* 재고 입력 링크 */
.inv-input-link {
  display:inline-flex; align-items:center; gap:5px;
  height:32px; padding:0 14px; border-radius:50px;
  border:1.5px solid var(--teal); background:var(--teal-bg);
  font-size:12px; font-weight:700; color:var(--teal);
  text-decoration:none; transition:all 150ms ease; flex-shrink:0;
}
.inv-input-link:hover { background:var(--teal); color:#fff; }

/* 상품 없음 빈 상태 */
.empty       { text-align:center; padding:40px 20px; }
.empty-icon  { font-size:32px; margin-bottom:12px; }
.empty-text  { font-size:13px; color:var(--text3); }

/* 테이블 반응형 */
@media(max-width:600px) {
  .row-actions { flex-direction:row; }
  .btn-xs { height:24px; padding:0 8px; font-size:10px; }
  td[data-label]::before {
    content:attr(data-label);
    display:block; font-size:10px;
    color:var(--text4); margin-bottom:3px;
  }
  .h-time { min-width:0; font-size:9px; }
}

/* 이력 상세 (h-item 계열) */
.h-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--border);
  animation:fadeUp 200ms ease both;
}
.h-item:last-child { border-bottom:none; }
.h-dot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
  margin-top:5px;
}
.h-dot.add,.h-dot.in   { background:var(--green); }
.h-dot.minus,.h-dot.out{ background:var(--red); }
.h-dot.set             { background:var(--blue); }
.h-dot.pos             { background:var(--amber); }
.h-dot.soldout         { background:var(--text4); }
.h-info  { flex:1; min-width:0; }
.h-name  { font-size:13px; font-weight:600; color:var(--text2); }
.h-note  { font-size:11px; color:var(--text3); margin-top:2px; }
</style>

})();})();})();
})();

<!-- FAB -->

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── 유틸 ──
function nowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── 상태 ──
const DEFAULT_STATE = () => ({
  products: [],
  history: [],
  settings: { hd_code:'HYW', sp_code:'', alert_threshold:10, warning_threshold:20, sync_interval:30 }
});
let state = DEFAULT_STATE();
let historyFilter = 'all';
let chartPeriod = 'daily';
let chartObj = null;
let editingId = null; // 상품 고유 id

// ── 상품 고유 ID ── item_code 있으면 사용, 없으면 _id(uuid-like)
function getPid(p) { return p.item_code || p._id; }

// ── 데이터 로드/저장 ──
async function loadData() {
  try {
    const r = await fetch('/api/inventory');
    if (!r.ok) throw new Error('fetch fail');
    const d = await r.json();
    // _id 없는 기존 상품 마이그레이션
    (d.products||[]).forEach((p,i) => { if (!p._id) p._id = 'p_' + Date.now() + '_' + i; });
    state = { ...DEFAULT_STATE(), ...d };
    state.settings = { ...DEFAULT_STATE().settings, ...(d.settings||{}) };
  } catch(e) { console.warn('loadData error', e); }
}

async function saveData() {
  try {
    await fetch('/api/inventory', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
  } catch(e) { console.warn('saveData error', e); }
}

// ── 새로고침 ──
async function handleRefresh(btn) {
  btn.classList.add('spinning');
  await loadData();
  renderAll();
  syncSettingsForm();
  btn.classList.remove('spinning');
  updateLastSync();
  showToast('새로고침 완료');
}

function updateLastSync() {
  document.getElementById('lastSync').textContent = '마지막 동기화: ' + nowStr();
}

// ── 탭 전환 ── (event 객체 대신 el 파라미터 사용)
function switchTab(name, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'chart') renderChart();
}

// ── 렌더 전체 ──
function renderAll() {
  renderTable();
  renderHistory();
  updateSummary();
  updateChartSelect();
}

// ── 요약 ──
function updateSummary() {
  const def = state.settings.alert_threshold || 10;
  let total=0, normal=0, alert=0, sold=0;
  state.products.forEach(p => {
    total++;
    const th = p.threshold != null ? p.threshold : def;
    if (p.current_stock <= 0) sold++;
    else if (p.current_stock <= th) alert++;
    else normal++;
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-normal').textContent = normal;
  document.getElementById('s-alert').textContent = alert;
  document.getElementById('s-sold').textContent = sold;
}

// ── 테이블 ──
function renderTable() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const def = state.settings.alert_threshold || 10;
  const warn = state.settings.warning_threshold || (def * 2);
  const tbody = document.getElementById('stockBody');
  const list = state.products.filter(p => !kw || p.item_name.toLowerCase().includes(kw));

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">📦</div><div class="empty-text">${kw?'검색 결과 없음':'상품을 추가해주세요 (우측 하단 + 버튼)'}</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(p => {
    const pid = getPid(p);
    const th = p.threshold != null ? p.threshold : def;
    const wn = p.threshold != null ? th * 2 : warn;
    let badge;
    if (p.current_stock <= 0)        badge = `<span class="stock-badge soldout">● 매진</span>`;
    else if (p.current_stock <= th)  badge = `<span class="stock-badge danger blink">⚠ ${p.current_stock}개</span>`;
    else if (p.current_stock <= wn)  badge = `<span class="stock-badge warning">▲ ${p.current_stock}개</span>`;
    else                             badge = `<span class="stock-badge normal">✓ ${p.current_stock}개</span>`;

    const pid_esc = pid.replace(/'/g,"\\'");
    return `<tr>
      <td data-label="상품명">
        <div class="pname">${p.item_name}</div>
        <div class="pcode">${p.item_code||'코드 없음'}</div>
      </td>
      <td data-label="재고">${badge}</td>
      <td data-label="임박 기준"><span class="th-badge">${th}개 이하</span></td>
      <td data-label="매진 시각">${p.soldout_at?`<div class="soldout-time">🕐 ${p.soldout_at}</div>`:'<span style="color:var(--border2);font-size:12px">—</span>'}</td>
      <td data-label="">
        <div class="row-actions">
          <button class="btn-xs bxa" onclick="openAdjust('${pid_esc}','add')">+ 추가</button>
          <button class="btn-xs bxm" onclick="openAdjust('${pid_esc}','minus')">− 차감</button>
          <button class="btn-xs bxe" onclick="openEditModal('${pid_esc}')">수정</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── 이력 ──
function renderHistory() {
  const list = document.getElementById('historyList');
  let items = [...state.history].reverse();
  if (historyFilter !== 'all') items = items.filter(h => h.type === historyFilter);
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">이력이 없습니다</div></div>`;
    return;
  }
  const typeLabel = { add:'추가', minus:'차감', soldout:'매진', init:'초기설정', pos:'POS차감' };
  list.innerHTML = items.slice(0, 100).map(h => {
    const isPlus = h.type === 'add' || h.type === 'init';
    const qtyStr = h.type === 'soldout' ? '매진' : `${isPlus?'+':'-'}${h.qty}`;
    return `<div class="h-item">
      <div class="h-dot ${h.type==='pos'?'pos':h.type}"></div>
      <div class="h-info">
        <div class="h-name">${h.item_name||h.item_code||'—'}</div>
        <div class="h-note">${typeLabel[h.type]||h.type}${h.note?' · '+h.note:''}</div>
      </div>
      <div class="h-qty ${isPlus?'p':'m'}">${qtyStr}</div>
      <div class="h-time">${(h.datetime||'').replace(' ','<br>')}</div>
    </div>`;
  }).join('');
}

function setHFilter(f, el) {
  historyFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderHistory();
}

// ── 차트 ──
function updateChartSelect() {
  const sel = document.getElementById('chartProduct');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">전체 상품</option>' +
    state.products.map(p => `<option value="${getPid(p)}">${p.item_name}</option>`).join('');
  sel.value = cur || 'all';
}

function setPeriod(p, el) {
  chartPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderChart();
}

function renderChart() {
  const canvas = document.getElementById('salesCanvas');
  const empty = document.getElementById('chartEmpty');
  const titleEl = document.getElementById('chartTitle');
  const pf = document.getElementById('chartProduct').value;

  let items = state.history.filter(h => h.type === 'minus' || h.type === 'pos');
  if (pf !== 'all') items = items.filter(h => getPid(h) === pf || h.item_code === pf || h._id === pf);

  if (!items.length) {
    canvas.style.display = 'none'; empty.style.display = 'block'; return;
  }
  canvas.style.display = 'block'; empty.style.display = 'none';

  const buckets = {};
  items.forEach(h => {
    if (!h.datetime) return;
    const dt = h.datetime.replace(' ','T');
    const d = new Date(dt);
    if (isNaN(d)) return;
    let key;
    if (chartPeriod === 'daily') key = h.datetime.slice(0,10);
    else if (chartPeriod === 'weekly') {
      const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
      key = mon.toISOString().slice(0,10);
    } else key = h.datetime.slice(0,7);
    buckets[key] = (buckets[key]||0) + (h.qty||0);
  });

  const labels = Object.keys(buckets).sort();
  const data = labels.map(k => buckets[k]);
  const pmap = { daily:'일별', weekly:'주별', monthly:'월별' };
  titleEl.textContent = `${pmap[chartPeriod]} 판매량 추이`;

  if (chartObj) { chartObj.destroy(); chartObj = null; }
  chartObj = new Chart(canvas, {
    type:'bar',
    data: { labels, datasets:[{ label:'판매 수량', data, backgroundColor:'rgba(139,92,246,.45)', borderColor:'#8b5cf6', borderWidth:2, borderRadius:5 }] },
    options: {
      responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false } },
      scales: {
        x:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'var(--border)' } },
        y:{ ticks:{ color:'#64748b', font:{size:11} }, grid:{ color:'var(--border)' }, beginAtZero:true }
      }
    }
  });
}

// ── 상품 추가/수정 ──
function openAddModal() {
  editingId = null;
  document.getElementById('m-product-title').textContent = '상품 추가';
  ['f-name','f-code','f-threshold'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-stock').value = '';
  document.getElementById('m-product').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 200);
}

function openEditModal(pid) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  editingId = pid;
  document.getElementById('m-product-title').textContent = '상품 수정';
  document.getElementById('f-name').value = p.item_name;
  document.getElementById('f-code').value = p.item_code||'';
  document.getElementById('f-stock').value = p.current_stock;
  document.getElementById('f-threshold').value = p.threshold != null ? p.threshold : '';
  document.getElementById('m-product').classList.add('open');
}

async function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  const code = document.getElementById('f-code').value.trim();
  const stock = parseInt(document.getElementById('f-stock').value)||0;
  const thVal = document.getElementById('f-threshold').value;
  const threshold = thVal !== '' ? parseInt(thVal) : null;
  if (!name) { showToast('상품명을 입력해주세요'); return; }

  if (editingId) {
    const p = state.products.find(p => getPid(p) === editingId);
    if (p) { p.item_name=name; p.item_code=code; p.current_stock=stock; p.threshold=threshold; }
  } else {
    // 중복 체크 (코드 있을 때만)
    if (code && state.products.find(p => p.item_code && p.item_code === code)) {
      showToast('이미 등록된 상품 코드입니다'); return;
    }
    const newP = { _id:'p_'+Date.now(), item_code:code, item_name:name, current_stock:stock, threshold, soldout_at:null };
    state.products.push(newP);
    addHistory({ type:'init', _id:newP._id, item_code:code, item_name:name, qty:stock, note:'초기 설정' });
    updateChartSelect();
  }
  await saveData();
  closeModal('m-product');
  renderTable(); updateSummary();
  showToast(editingId ? '수정되었습니다' : '상품이 추가되었습니다');
}

// ── 재고 조정 ──
function openAdjust(pid, type) {
  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;
  document.getElementById('m-adjust-title').textContent = (type==='add'?'재고 추가':'재고 차감') + ` — ${p.item_name}`;
  document.getElementById('adj-id').value = pid;
  document.getElementById('adj-type').value = type;
  document.getElementById('adj-qty').value = '';
  document.getElementById('adj-note').value = '';
  document.getElementById('m-adjust').classList.add('open');
  setTimeout(() => document.getElementById('adj-qty').focus(), 200);
}

async function applyAdjust() {
  const pid = document.getElementById('adj-id').value;
  const type = document.getElementById('adj-type').value;
  const qty = parseInt(document.getElementById('adj-qty').value);
  const note = document.getElementById('adj-note').value.trim();
  if (!qty || qty <= 0) { showToast('수량을 입력해주세요'); return; }

  const p = state.products.find(p => getPid(p) === pid);
  if (!p) return;

  if (type === 'add') {
    p.current_stock += qty;
    if (p.current_stock > 0) p.soldout_at = null;
  } else {
    p.current_stock = Math.max(0, p.current_stock - qty);
    if (p.current_stock === 0 && !p.soldout_at) {
      p.soldout_at = nowStr();
      addHistory({ type:'soldout', _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty:0, note:'매진' });
    }
  }
  addHistory({ type, _id:getPid(p), item_code:p.item_code, item_name:p.item_name, qty, note });
  await saveData();
  closeModal('m-adjust');
  renderTable(); renderHistory(); updateSummary();
  showToast(type==='add' ? `+${qty}개 추가됨` : `−${qty}개 차감됨`);
}

function addHistory(entry) {
  if (!state.history) state.history = [];
  state.history.push({ ...entry, datetime: nowStr() });
  // 이력 최대 500건 유지
  if (state.history.length > 500) state.history = state.history.slice(-500);
}

// ── 설정 ──
function syncSettingsForm() {
  document.getElementById('s-hd').value = state.settings.hd_code||'HYW';
  document.getElementById('s-sp').value = state.settings.sp_code||'';
  document.getElementById('s-interval').value = state.settings.sync_interval||30;
  document.getElementById('s-th').value = state.settings.alert_threshold||10;
  document.getElementById('s-warn').value = state.settings.warning_threshold||20;
  const pill = document.getElementById('apiPill');
  if (state.settings.sp_code) { pill.textContent='● 연결됨'; pill.className='api-pill on'; }
  else { pill.textContent='● 미연결'; pill.className='api-pill off'; }
}

async function saveApiSettings() {
  state.settings.hd_code = document.getElementById('s-hd').value.trim();
  state.settings.sp_code = document.getElementById('s-sp').value.trim();
  state.settings.sync_interval = parseInt(document.getElementById('s-interval').value)||30;
  await saveData(); syncSettingsForm(); showToast('저장되었습니다');
}

async function saveThreshold() {
  state.settings.alert_threshold = parseInt(document.getElementById('s-th').value)||10;
  state.settings.warning_threshold = parseInt(document.getElementById('s-warn').value)||20;
  await saveData(); renderTable(); updateSummary(); showToast('기준 수량 저장됨');
}

// ── 모달 ──
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function overlayClose(el) { el.classList.remove('open'); }

// ── 토스트 ──

function copyInputUrl(btn) {
  const url = window.location.origin + '/100yearinventory';
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'rgba(74,222,128,.4)';
    showToast('입력 페이지 주소가 복사됐습니다');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  }).catch(() => {
    // clipboard API 실패 시 fallback
    const ta = document.createElement('textarea');
    ta.value = window.location.origin + '/100yearinventory';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('입력 페이지 주소가 복사됐습니다');
  });
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 초기화 ──
async function init() {
  await loadData();
  renderAll();
  syncSettingsForm();
  updateLastSync();
}

init();
</script>



<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel('' + m.id + '')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
