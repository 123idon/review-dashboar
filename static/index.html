<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>후기 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* =====================================================
   백년화편 디자인 시스템 — 토스 스타일
   모든 페이지 공통 적용
   ===================================================== */

/* ─── 라이트 모드 ─── */
[data-theme="day"], :root {
  --bg:           #F9FAFB;
  --bg2:          #F2F4F6;
  --surface:      #FFFFFF;
  --surface2:     #F2F4F6;
  --border:       #E5E8EB;
  --border2:      #CDD1D8;
  --text:         #191F28;
  --text2:        #333D4B;
  --text3:        #6B7684;
  --text4:        #B0B8C1;
  --muted:        #6B7684;

  /* 퍼스널 컬러 — 브랜드 앰버·오렌지 */
  --brand:        #F5820D;
  --brand-dark:   #D96E00;
  --brand-bg:     #FFF4E6;
  --brand-light:  #FFF4E6;
  --brand-rgb:    245,130,13;
  --accent-d:     #F5820D;

  --blue:         #3182F6;
  --blue-bg:      #EBF3FE;
  --blue-light:   #EBF3FE;
  --blue-rgb:     49,130,246;

  --red:          #F04452;
  --red-bg:       #FFF0F0;
  --red-light:    #FFF0F0;
  --danger:       #F04452;
  --danger-bg:    #FFF0F0;

  --green:        #00A86B;
  --green-bg:     #E8FAF4;
  --green-light:  #E8FAF4;
  --positive:     #00A86B;
  --positive-bg:  #E8FAF4;

  --purple:       #6C47FF;
  --purple-bg:    #F3F0FF;
  --purple-light: #F3F0FF;

  --teal:         #00BCD4;
  --teal-bg:      #E6F9FC;
  --teal-light:   #E6F9FC;

  --amber:        #F59E0B;
  --amber-bg:     #FFFAEB;
  --amber-light:  #FFFAEB;

  --mono:         'SF Mono','JetBrains Mono',monospace;
  --r-pill:       50px;

  /* 그림자 — 두 세트 동시 지원 */
  --sh-xs:        0 1px 2px rgba(0,0,0,.05);
  --sh-sm:        0 2px 8px rgba(0,0,0,.07);
  --sh-md:        0 4px 16px rgba(0,0,0,.09);
  --sh-lg:        0 8px 32px rgba(0,0,0,.11);
  --sh-xl:        0 20px 56px rgba(0,0,0,.13);
  --sh-brand:     0 4px 14px rgba(245,130,13,.28);
  --sh-blue:      0 4px 14px rgba(49,130,246,.25);
  --shadow-xs:0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 2px 10px rgba(0,0,0,.5);
  --shadow-md:0 4px 20px rgba(0,0,0,.6);
  --shadow-xl:0 20px 56px rgba(0,0,0,.8);
  --shadow-brand: 0 4px 14px rgba(245,130,13,.28);
  --shadow-blue:  0 4px 14px rgba(49,130,246,.25);
}

/* ─── 다크 모드 ─── */


/* ─── 리셋 ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s ease, color .2s ease;
}

/* ─── 키프레임 ─── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
@keyframes spin     { to{transform:rotate(360deg)} }
@keyframes dotBlink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
@keyframes shimmer  { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.72)} }
@keyframes spring   { 0%{transform:scale(.88) translateY(14px);opacity:0} 100%{transform:scale(1) translateY(0);opacity:1} }

/* ─── 공통 컴포넌트 ─── */

/* 스켈레톤 */
.skeleton {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 400px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}

/* 스피너 */
.spinner {
  width: 26px; height: 26px;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}

/* 프로그레스 바 */
.progress-wrap { position:fixed; top:0; left:0; width:100%; height:3px; z-index:9999; pointer-events:none; }
.progress-bar  {
  height:100%; width:0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* 토스트 */
#toast {
  position:fixed; bottom:32px; left:50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg);
  font-size:13px; font-weight:700;
  padding:10px 22px; border-radius:50px;
  opacity:0; pointer-events:none; z-index:9999;
  white-space:nowrap;
  transition: opacity 200ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 테마 버튼 */




/* 메모 FAB */
#memoFab {
  position:fixed; bottom:22px; right:22px; z-index:900;
  width:52px; height:52px; border-radius:50%;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  color:#fff; border:none; cursor:pointer; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--sh-brand);
  transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color:transparent;
}
#memoFab:hover  { transform:scale(1.1) rotate(-6deg); box-shadow:0 8px 28px rgba(var(--brand-rgb),.45); }
#memoFab:active { transform:scale(.94); }

.mp-badge {
  position:absolute; top:5px; right:5px;
  min-width:17px; height:17px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9px; font-weight:800; border-radius:50px;
  border:2.5px solid var(--surface);
  display:none; align-items:center; justify-content:center;
}
.mp-badge.show { display:flex; }

/* 메모 패널 */
#memoPanel {
  position:fixed; bottom:84px; right:22px; z-index:901;
  width:320px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:20px; box-shadow:var(--sh-xl); overflow:hidden;
  transform:scale(.88) translateY(14px); transform-origin:bottom right;
  opacity:0; pointer-events:none;
  transition: transform 280ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease;
}
#memoPanel.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }

.mp-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--border);
  font-size:14px; font-weight:700;
}
.mp-close-btn {
  width:26px; height:26px; border-radius:50%;
  border:none; background:var(--surface2); color:var(--text3);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-close-btn:hover { background:var(--border); color:var(--text); }

.mp-body { padding:14px 18px; }
.mp-input-row { display:flex; gap:8px; margin-bottom:12px; }
.mp-input {
  flex:1; padding:10px 12px;
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:12px; color:var(--text);
  font-family:inherit; font-size:13px; line-height:1.6;
  resize:none; outline:none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }

.mp-save-btn {
  height:36px; padding:0 14px; align-self:flex-end;
  border-radius:50px; border:none;
  background:var(--brand); color:#fff;
  font-family:inherit; font-size:12px; font-weight:700;
  cursor:pointer; flex-shrink:0;
  transition:all 150ms ease;
}
.mp-save-btn:hover   { background:var(--brand-dark); }
.mp-save-btn:active  { transform:scale(.96); }
.mp-save-btn:disabled { opacity:.5; cursor:not-allowed; }

.mp-list { max-height:260px; overflow-y:auto; scrollbar-width:thin; }

.mp-card { padding:10px 0; border-bottom:1px solid var(--border); position:relative; }
.mp-card:last-child { border-bottom:none; }
.mp-card-text { font-size:12px; color:var(--text2); line-height:1.6; padding-right:28px; }
.mp-card-date { font-size:10px; color:var(--text4); margin-top:4px; font-variant-numeric:tabular-nums; }
.mp-del-btn {
  position:absolute; top:10px; right:0;
  width:22px; height:22px; border-radius:50%;
  border:none; background:transparent; color:var(--text4);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-del-btn:hover { background:var(--red-bg); color:var(--red); }
.mp-empty { font-size:12px; color:var(--text4); text-align:center; padding:20px 0; }

.mp-toast {
  position:fixed; bottom:88px; right:80px; z-index:902;
  background:var(--text); color:var(--bg);
  font-size:12px; font-weight:700;
  padding:8px 16px; border-radius:50px;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:all 200ms ease;
}
.mp-toast.show { opacity:1; transform:translateY(0); }

@media (max-width:480px) {
  #memoPanel { width:calc(100vw - 28px); right:14px; bottom:78px; }
  #memoFab   { width:48px; height:48px; right:16px; bottom:18px; }
}


/* ═══ index.html 전용 ═══ */

/* 수집 배너 */
.collecting-banner {
  display:none; position:sticky; top:0; z-index:190;
  background:linear-gradient(135deg,var(--amber),var(--brand));
  padding:9px 20px; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:12px; font-weight:700; color:#fff;
  box-shadow:0 2px 12px rgba(var(--brand-rgb),.3);
  transition:background .2s ease;
}
.collecting-banner.visible { display:flex; }
.dot-anim span { animation:dotBlink 1.2s infinite; opacity:0; font-size:15px; }
.dot-anim span:nth-child(2){animation-delay:.2s}
.dot-anim span:nth-child(3){animation-delay:.4s}

/* 헤더 */
.header {
  position:sticky; top:0; z-index:100;
  height:58px; background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; gap:12px;
  box-shadow:var(--sh-xs);
  backdrop-filter:blur(8px);
  transition:background .2s ease, border-color .2s ease;
}
.header-left  { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }

.logo {
  font-size:14px; font-weight:800; letter-spacing:-.5px;
  color:var(--text); white-space:nowrap; flex-shrink:0;
}

/* 탭바 */
.shop-tabs {
  display:flex; background:var(--surface2);
  border-radius:10px; padding:3px; gap:2px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  max-width:calc(100vw - 210px);
}
.shop-tabs::-webkit-scrollbar { display:none; }
.shop-tab {
  flex-shrink:0; height:30px; padding:0 12px;
  border-radius:8px; border:none; background:transparent;
  font-family:inherit; font-size:12px; font-weight:600;
  color:var(--text3); cursor:pointer; white-space:nowrap;
  transition:all 150ms ease;
}
.shop-tab:hover:not(.active-a):not(.active-b):not(.active-c):not(.active-d) {
  color:var(--text2); background:rgba(0,0,0,.04);
}
.shop-tab.active-d { background:var(--brand);  color:#fff; box-shadow:0 2px 8px rgba(var(--brand-rgb),.35); }
.shop-tab.active-a { background:var(--green);  color:#fff; box-shadow:0 2px 8px rgba(0,168,107,.35); }
.shop-tab.active-b { background:#7C4E2A;       color:#fff; box-shadow:0 2px 8px rgba(124,78,42,.35); }
.shop-tab.active-c { background:#1A4A7A;       color:#fff; box-shadow:0 2px 8px rgba(26,74,122,.35); }

.home-tab {
  margin-left:4px; padding-left:12px;
  border-left:1px solid var(--border);
  font-size:12px; font-weight:500; color:var(--text4);
  text-decoration:none; white-space:nowrap; flex-shrink:0;
  display:flex; align-items:center; height:30px;
  transition:color 150ms ease;
}
.home-tab:hover { color:var(--brand); }

.last-updated { font-size:11px; color:var(--text4); font-variant-numeric:tabular-nums; letter-spacing:-.2px; }

.refresh-btn {
  height:32px; padding:0 14px; border-radius:50px;
  border:1.5px solid var(--border); background:var(--surface);
  font-family:inherit; font-size:12px; font-weight:700;
  color:var(--text2); cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transition:all 150ms ease;
}
.refresh-btn:hover  { background:var(--brand); color:#fff; border-color:var(--brand); box-shadow:var(--sh-brand); }
.refresh-btn:active { transform:scale(.97); }
.refresh-btn.loading .spin { display:inline-block; animation:spin .6s linear infinite; }

/* 메인 */
.main { max-width:960px; margin:0 auto; padding:24px 20px 80px; }
.section { margin-bottom:24px; }
.section-label { font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--text4); text-transform:uppercase; margin-bottom:10px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* 카드 */
.card {
  background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:20px;
  transition:border-color 200ms ease, box-shadow 200ms ease, transform 240ms cubic-bezier(0.34,1.56,0.64,1);
}
.card:hover { border-color:var(--border2); box-shadow:var(--sh-md); transform:translateY(-1px); }
.card-title { font-size:13px; font-weight:700; color:var(--text2); margin-bottom:14px; letter-spacing:-.2px; }

/* 요약 카드 */
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.stat-card {
  background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:18px 16px;
  animation:fadeUp 280ms cubic-bezier(0.16,1,0.3,1) both;
  transition:transform 240ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
}
.stat-card:hover { transform:translateY(-3px); box-shadow:var(--sh-md); }
.stat-card.danger-card { background:var(--red-bg); border-color:rgba(240,68,82,.2); }
.stat-label { font-size:11px; color:var(--text3); margin-bottom:8px; font-weight:500; }
.stat-val   { font-size:30px; font-weight:800; letter-spacing:-1.6px; line-height:1; font-variant-numeric:tabular-nums; }
.stat-val.danger { color:var(--red); }
.stat-sub   { font-size:11px; color:var(--text4); margin-top:5px; font-variant-numeric:tabular-nums; }
.stat-accent-a .stat-val { color:var(--green); }
.stat-accent-b .stat-val { color:#7C4E2A; }
.stat-accent-c .stat-val { color:#1A4A7A; }
.stat-accent-d .stat-val { color:var(--brand); }

/* 별점 분포 */
.dist-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.dist-row:last-child { margin-bottom:0; }
.dist-label    { font-size:12px; font-weight:700; width:12px; text-align:center; color:var(--text2); }
.dist-bar-wrap { flex:1; background:var(--surface2); border-radius:50px; height:6px; overflow:hidden; }
.dist-bar      { height:100%; border-radius:50px; transition:width .7s cubic-bezier(0.16,1,0.3,1); }
.dist-bar.s5 { background:var(--green); }
.dist-bar.s4 { background:#52C41A; }
.dist-bar.s3 { background:var(--amber); }
.dist-bar.s2 { background:var(--brand); }
.dist-bar.s1 { background:var(--red); }
.dist-count    { font-size:11px; color:var(--text3); width:44px; text-align:right; font-variant-numeric:tabular-nums; }

/* 플랫폼 비교 */
.platform-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.platform-row:last-child { border-bottom:none; }
.platform-name  { font-size:12px; font-weight:700; width:76px; flex-shrink:0; }
.platform-count { font-size:14px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
.platform-avg   { font-size:11px; color:var(--text3); margin-left:auto; font-variant-numeric:tabular-nums; }

/* 차트 */
.chart-wrap { position:relative; height:158px; }

/* 상품 목록 */
.product-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.product-item:last-child { border-bottom:none; }
.product-rank  { font-size:11px; font-weight:800; width:18px; color:var(--text4); flex-shrink:0; }
.product-name  { font-size:12px; flex:1; color:var(--text2); line-height:1.4; }
.product-count { font-size:13px; font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums; }
.neg { font-size:11px; color:var(--red); flex-shrink:0; }

/* 키워드 칩 */
.keyword-section       { margin-bottom:14px; }
.keyword-section:last-child { margin-bottom:0; }
.keyword-section-title { font-size:11px; font-weight:700; color:var(--text4); margin-bottom:8px; letter-spacing:.4px; text-transform:uppercase; }
.keyword-chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip {
  display:inline-flex; align-items:center; gap:5px;
  font-size:12px; font-weight:700; padding:5px 11px; border-radius:50px;
  transition:transform 200ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 150ms ease;
  cursor:default;
}
.chip:hover   { transform:translateY(-2px); box-shadow:var(--sh-sm); }
.chip-pos     { background:var(--green-bg); color:var(--green); }
.chip-neg     { background:var(--red-bg);   color:var(--red);   }
.chip-count   { font-size:10px; opacity:.65; }

.period-toggle { display:flex; gap:5px; margin-bottom:14px; }
.period-btn {
  height:28px; padding:0 12px; border-radius:50px;
  border:1.5px solid var(--border); background:transparent;
  font-family:inherit; font-size:11px; font-weight:700; color:var(--text3); cursor:pointer;
  transition:all 150ms ease;
}
.period-btn:hover  { border-color:var(--brand); color:var(--brand); }
.period-btn.active { background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:var(--sh-brand); }

/* 기간 필터 */
.date-filter-bar {
  display:flex; align-items:center; gap:8px;
  padding:12px 16px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:14px;
  margin-bottom:16px; flex-wrap:wrap; box-shadow:var(--sh-xs);
}
.date-filter-label      { font-size:10px; font-weight:700; color:var(--text4); letter-spacing:.8px; text-transform:uppercase; flex-shrink:0; }
.date-preset-btns-wrap  { display:flex; gap:4px; flex-wrap:wrap; }
.date-preset-btn {
  height:26px; padding:0 11px; border-radius:50px;
  border:1.5px solid var(--border); background:transparent;
  font-family:inherit; font-size:11px; font-weight:700; color:var(--text3); cursor:pointer;
  transition:all 150ms ease;
}
.date-preset-btn:hover  { border-color:var(--brand); color:var(--brand); }
.date-preset-btn.active { background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:var(--sh-brand); }
.date-filter-sep        { width:1px; height:16px; background:var(--border); flex-shrink:0; }
.date-range-inputs      { display:flex; align-items:center; gap:6px; }
.date-range-sep         { font-size:11px; color:var(--text4); }
.date-input {
  height:28px; padding:0 10px; border-radius:9px;
  border:1.5px solid var(--border); background:var(--surface);
  font-family:inherit; font-size:11px; color:var(--text); outline:none;
  transition:border-color 150ms ease, box-shadow 150ms ease;
}
.date-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }
.date-apply-btn {
  height:28px; padding:0 12px; border-radius:50px; border:none;
  background:var(--brand); color:#fff;
  font-family:inherit; font-size:11px; font-weight:700; cursor:pointer; transition:all 150ms ease;

function renderScoreDist(d){
  const dist = d.score_distribution||{};
  const total = Object.values(dist).reduce((a,b)=>a+b,0)||1;
  const cls = {'5':'s5','4':'s4','3':'s3','2':'s2','1':'s1'};
  let rows='';
  for(let s=5;s>=1;s--){
    const cnt=dist[s]||0, pct=Math.round(cnt/total*100);
    rows+=`<div class="dist-row">
      <div class="dist-label">${s}</div>
      <div class="dist-bar-wrap"><div class="dist-bar ${cls[s]}" style="width:${pct}%"></div></div>
      <div class="dist-count">${cnt.toLocaleString()}</div>
      <div style="font-size:11px;font-family:var(--mono);color:var(--text3);width:34px;text-align:right">(${pct}%)</div>
    </div>`;
  }
  return `<div class="card"><div class="card-title">별점 분포</div>${rows}</div>`;
}

function renderPlatformCompare(d){
  const ps = d.platform_stats||{};
  const platforms=[{key:'direct',label:'자사몰',badge:'jasa'},{key:'kakao',label:'자사몰(카카오)',badge:'jasa'},{key:'naver',label:'자사몰(네이버)',badge:'jasa'},{key:'smartstore',label:'스마트스토어',badge:'smartstore'}];
  let rows='';
  for(const p of platforms){
    const stat=ps[p.key];
    if(!stat||stat.count===0)continue;
    rows+=`<div class="platform-row"><div><span class="platform-badge ${p.badge}">${p.label}</span></div><div style="display:flex;gap:12px;align-items:center"><span class="platform-meta">★${stat.avg_score} &nbsp; ${stat.count}건</span>${stat.negative>0?`<span style="font-size:11px;color:var(--red);font-family:var(--mono)">▼${stat.negative}</span>`:''}</div></div>`;
  }
  if(!rows) rows='<div style="font-size:13px;color:var(--text3);padding:8px 0">데이터 없음</div>';
  return `<div class="card"><div class="card-title">플랫폼 비교</div>${rows}</div>`;
}

function setFilter(f,el){
  reviewFilter=f; currentPage=1;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  // 기간 필터 적용 중이면 filteredData, 아니면 allData 사용
  const src = filteredData || allData;
  const d=src[currentShop];
  let reviews=d.reviews||[];
  if(f==='low')  reviews=reviews.filter(r=>r.score<=3);
  else if(f==='jasa') reviews=reviews.filter(r=>r.platform!=='smartstore');
  else if(f==='ss')   reviews=reviews.filter(r=>r.platform==='smartstore');
  filteredReviews=reviews;
  renderReviewPage();
}
async function renderReviewPage(){
  const listEl=document.getElementById('reviewList'), pagEl=document.getElementById('pagination');
  if(!listEl) return;

  // 스켈레톤 로딩
  listEl.innerHTML='<div class="skeleton" style="height:60px;margin-bottom:8px"></div>'.repeat(3);
  pagEl.innerHTML='';

  try{
    const params=new URLSearchParams({
      shop: currentShop==='jasaol'?'jasaol': currentShop==='smartstore'?'smartstore': currentShop==='myeongga'?'myeongga': currentShop==='papa'?'papa':'changeok',
      page: currentPage,
      size: PAGE_SIZE,
      filter_type: reviewFilter||'all',
    });
    if(dateFilterStart) params.set('date_from', dateFilterStart);
    if(dateFilterEnd)   params.set('date_to',   dateFilterEnd);
    if(reviewKeyword && reviewKeyword.trim()) params.set('keyword', reviewKeyword.trim());

    const res = await fetch('/api/reviews?'+params.toString());
    if(!res.ok) throw new Error();
    const data = await res.json();
    
    _reviewTotal = data.total;
    _reviewTotalPages = data.total_pages;
    currentPage = data.page;

    // 키워드 검색 결과 배지 업데이트
    const badge = document.getElementById('searchResultBadge');
    if(badge){
      if(reviewKeyword && reviewKeyword.trim()){
        badge.textContent = `"${reviewKeyword.trim()}" 검색 결과 ${_reviewTotal.toLocaleString()}건`;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    }

    listEl.innerHTML = buildReviewCards(data.items, reviewKeyword);
    // 현재 페이지 후기 데이터를 키로 매핑 (내보내기용)
    _pageReviewMap={};
    (data.items||[]).forEach(r=>{ _pageReviewMap[revKey(r)]=r; });
    bindReviewChecks();
    setupRevExportEvents();

    // 페이지네이션 버튼
    let btns=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${!data.has_prev?'disabled':''}>◀</button>`;
    let sp=Math.max(1,currentPage-2), ep=Math.min(_reviewTotalPages,sp+4);
    if(ep-sp<4) sp=Math.max(1,ep-4);
    for(let i=sp;i<=ep;i++) btns+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    btns+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${!data.has_next?'disabled':''}>▶</button>`;
    btns+=`<span class="page-info">${_reviewTotal.toLocaleString()}건 중 ${((currentPage-1)*PAGE_SIZE+1).toLocaleString()}~${Math.min(currentPage*PAGE_SIZE,_reviewTotal).toLocaleString()}</span>`;
    pagEl.innerHTML=btns;
  }catch(e){
    listEl.innerHTML='<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">후기를 불러올 수 없어요</div>';
  }
}
function goPage(p){
  if(p<1||p>_reviewTotalPages) return;
  currentPage=p;
  renderReviewPage();
  document.getElementById('reviewList')?.scrollIntoView({behavior:'smooth',block:'start'});
}
function setPageSize(n,el){
  PAGE_SIZE=n; currentPage=1;
  document.querySelectorAll('.ps-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderReviewPage();
}
function highlightKeyword(text, kw){
  if(!kw || !kw.trim() || !text) return text||'';
  const escaped = kw.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp('('+escaped+')', 'gi'), '<mark class="keyword-highlight">$1</mark>');
}

function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function esc2(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function revKey(r){
  // 고유키: review_no 있으면 사용, 없으면 platform+date+content 조합
  if(r.review_no) return r.platform+'_'+r.review_no;
  return (r.platform||'')+'_'+(r.date||'')+'_'+((r.content||r.title||'').slice(0,40));
}

function buildReviewCards(reviews, kw){
  if(!reviews.length)return'<div style="text-align:center;padding:32px 0;color:var(--text3);font-size:13px">해당 후기가 없어요</div>';
  return reviews.map(r=>{
    const isLow=r.score<=3;
    const _k=revKey(r);
    const _checked=revSelected.has(_k);
    const stars=[1,2,3,4,5].map(i=>`<span class="star ${i<=r.score?'on':'off'}">★</span>`).join('');
    const platLabel={direct:'자사몰',kakao:'카카오',naver:'네이버',smartstore:'스마트스토어'}[r.platform]||r.platform;
    const badgeCls=r.platform==='smartstore'?'smartstore':r.platform==='kakao'?'kakao':'jasa';
    const c = r.content||r.title||'';
    const cHighlighted = kw ? highlightKeyword(c, kw) : c;
    const imgs = Array.isArray(r.images) ? r.images : [];
    const imgHtml = imgs.length
      ? `<div class="review-imgs">${imgs.map(u=>`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" loading="lazy" class="review-thumb" onerror="this.parentNode.style.display='none'"></a>`).join('')}</div>`
      : '';
    return `<div class="review-card has-check ${isLow?'low':''} ${_checked?'rev-checked':''}">
      <input type="checkbox" class="rev-check" data-key="${esc2(_k)}" ${_checked?'checked':''}>
      <div class="review-header">

let _pageReviewMap={};

function bindReviewChecks(){
  document.querySelectorAll('.rev-check').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const k=e.target.dataset.key;
      if(e.target.checked){
        const data=_pageReviewMap[k];
        if(data) revSelected.set(k,data);
      }else{
        revSelected.delete(k);
      }
      e.target.closest('.review-card').classList.toggle('rev-checked',e.target.checked);
      updateRevExportBar();
    });
  });
  updateRevExportBar();
}

function updateRevExportBar(){
  const n=revSelected.size;
  const cEl=document.getElementById('revExportCount');
  if(cEl) cEl.textContent=`${n}건 선택`;
  const png=document.getElementById('revPngBtn'), xls=document.getElementById('revXlsxBtn');
  if(png) png.disabled=n===0;
  if(xls) xls.disabled=n===0;
}

function setupRevExportEvents(){
  const selPage=document.getElementById('revSelPageBtn');
  const selClear=document.getElementById('revSelClearBtn');
  const pngBtn=document.getElementById('revPngBtn');
  const xlsBtn=document.getElementById('revXlsxBtn');
  if(!selPage || selPage._bound) return;
  selPage._bound=true;

  selPage.addEventListener('click',()=>{
    document.querySelectorAll('.rev-check').forEach(cb=>{
      const k=cb.dataset.key, data=_pageReviewMap[k];
      if(data){ revSelected.set(k,data); cb.checked=true; cb.closest('.review-card').classList.add('rev-checked'); }
    });
    updateRevExportBar();
  });

  selClear.addEventListener('click',()=>{
    revSelected.clear();
    document.querySelectorAll('.rev-check').forEach(cb=>{ cb.checked=false; cb.closest('.review-card').classList.remove('rev-checked'); });
    updateRevExportBar();
  });

  // PNG
  pngBtn.addEventListener('click',async()=>{
    if(!revSelected.size) return;
    const btn=pngBtn, orig=btn.textContent;
    btn.textContent='생성중'; btn.disabled=true;
    try{
      const rows=[...revSelected.values()];
      const stage=buildRevCaptureStage(rows);
      document.body.appendChild(stage);
      const canvas=await html2canvas(stage,{scale:2,backgroundColor:'#ffffff',logging:false});
      document.body.removeChild(stage);
      const a=document.createElement('a');
      const today=new Date().toISOString().slice(0,10);
      a.href=canvas.toDataURL('image/png');
      a.download=`후기_${rows.length}건_${today}.png`;
      a.click();
    }catch(e){ alert('PNG 생성 실패: '+e.message); }
    finally{ btn.textContent=orig; btn.disabled=revSelected.size===0; }
  });

  // XLSX
  xlsBtn.addEventListener('click',()=>{
    if(!revSelected.size) return;
    const btn=xlsBtn, orig=btn.textContent;
    btn.textContent='생성중'; btn.disabled=true;
    try{
      const rows=[...revSelected.values()];
      const platLabel={direct:'자사몰',kakao:'카카오',naver:'네이버',smartstore:'스마트스토어'};
      const aoa=[['번호','날짜','평점','플랫폼','상품','작성자','후기 내용']];
      rows.forEach((r,i)=>{
        aoa.push([
          i+1, r.date||'', r.score||'',
          platLabel[r.platform]||r.platform||'',
          r.product||'', r.author||'',
          (r.content||r.title||'').trim()
        ]);
      });
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols']=[{wch:5},{wch:12},{wch:6},{wch:13},{wch:24},{wch:10},{wch:60}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'후기');
      const today=new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb,`후기_${rows.length}건_${today}.xlsx`);
    }catch(e){ alert('엑셀 생성 실패: '+e.message); }
    finally{ btn.textContent=orig; btn.disabled=revSelected.size===0; }
  });
}

function buildRevCaptureStage(rows){
  const stage=document.createElement('div');
  stage.className='rev-capture-stage';
  const today=new Date().toISOString().slice(0,10);
  const platLabel={direct:'자사몰',kakao:'카카오',naver:'네이버',smartstore:'스마트스토어'};
  const cards=rows.map(r=>{
    const isLow=r.score<=3;
    const stars='★'.repeat(Math.round(r.score))+'☆'.repeat(Math.max(0,5-Math.round(r.score)));
    const c=(r.content||r.title||'').trim()||'본문 없음';
    return `<div class="rcap-card">
      <div class="rcap-top">
        <span class="rcap-score ${isLow?'low':''}">${r.score}점</span>
        <span class="rcap-stars">${stars}</span>
        <span class="rcap-plat">${platLabel[r.platform]||r.platform||''}</span>
        <span class="rcap-date">${r.date||''}</span>
      </div>
      ${r.product?`<div class="rcap-prod">${esc(r.product)}</div>`:''}
      <div class="rcap-content">${esc(c)}</div>
    </div>`;
  }).join('');
  stage.innerHTML=`
    <div class="rcap-head">
      <div class="rcap-title">백년화편 후기 모음</div>
      <div class="rcap-meta">${rows.length}건 · ${today}</div>
    </div>
    ${cards}`;
  return stage;
}

async function importSmartstore(input){
  const file = input.files[0];
  if(!file) return;
  const termBox = document.getElementById('terminalBox');
  const addLog = (msg, color='#d4d4d4') => {
    if(termBox){ const line=document.createElement('div'); line.style.color=color; line.textContent=msg; termBox.appendChild(line); termBox.scrollTop=termBox.scrollHeight; }
  };
  input.disabled=true;
  try{
    let reviews;
    if(file.name.toLowerCase().endsWith('.json')){
      reviews=JSON.parse(await file.text());
      if(!Array.isArray(reviews)) throw new Error('후기 배열 형식의 JSON이 필요합니다.');
    }else{
      const XLSX=await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,nodim:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      reviews=rows.map((row,i)=>{
        const raw=row['리뷰등록일'];
        let parts;
        if(typeof raw==='number'){
          const d=XLSX.SSF.parse_date_code(raw); if(d) parts=[d.y,d.m,d.d];
        }else{
          const m=String(raw||'').match(/(\d{4})[.\-/]\s*(\d{1,2})[.\-/]\s*(\d{1,2})/);
          if(m) parts=m.slice(1).map(Number);
        }
        if(!parts) throw new Error(`${i+2}행: 리뷰등록일을 확인해주세요.`);
        return {date:parts.map((v,j)=>String(v).padStart(j===0?4:2,'0')).join('-'),
          score:Number(row['구매자평점']),product:String(row['상품명']||''),
          review_no:String(row['리뷰글번호']||''),title:'',content:String(row['리뷰상세내용']||'').trim(),
          platform:'naver',author:String(row['등록자']||''),review_type:String(row['리뷰구분']||'')};
      });
    }
    if(!reviews.length) throw new Error('후기가 0건입니다. 기존 데이터는 변경하지 않았습니다.');
    if(reviews.some(r=>!r || !r.content || !String(r.content).trim() || !Number.isFinite(r.score) || r.score<1 || r.score>5 || !/^\d{4}-\d{2}-\d{2}$/.test(r.date) || !['naver','smartstore'].includes(r.platform))){
      throw new Error('날짜·평점·본문·플랫폼을 확인해주세요. 업로드를 중단했습니다.');
    }
    const importId=crypto.randomUUID().replaceAll('-','');
    addLog(`[네이버] ${reviews.length.toLocaleString()}건 검증 완료`, '#4ec9b0');
    const CHUNK=500;
    for(let i=0;i<reviews.length;i+=CHUNK){
      const chunk=reviews.slice(i,i+CHUNK);
      const res=await fetch('/api/import-smartstore-chunk',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({reviews:chunk,replace:i===0,import_id:importId})
      });
      if(!res.ok) throw new Error('전송 실패: '+await res.text());
      addLog(`[네이버] ${Math.min(i+CHUNK,reviews.length).toLocaleString()}/${reviews.length.toLocaleString()}건 전송`);
    }
    const res=await fetch(`/api/import-smartstore-done?import_id=${importId}&expected_count=${reviews.length}`,{method:'POST'});
    const done=await res.json();
    if(!res.ok || !done.ok) throw new Error(done.detail||'병합 실패');
    addLog(`[완료] 신규 ${done.added.toLocaleString()}건 · 갱신 ${done.updated.toLocaleString()}건 · 총 ${done.imported.toLocaleString()}건`, '#4ec9b0');
    showToast(`✅ 네이버 신규 ${done.added.toLocaleString()}건 반영`);
    const dataRes=await fetch('/api/data');
    if(dataRes.ok){allData=await dataRes.json();updateLastUpdated(allData.last_updated);}
    const statusRes=await fetch('/api/smartstore-status');
    if(statusRes.ok){const st=await statusRes.json();if(!st.cookie_expired&&!st.stalled&&(!st.automation||st.automation.state==='ready')) document.getElementById('cookieExpiredBanner').style.display='none';}
  }catch(e){addLog(`[실패] ${e.message}`,'#f48771');showToast('❌ '+e.message);}
  finally{input.value='';input.disabled=false;}
}

async function importJasaol(input){
  const file = input.files[0];
  if(!file) return;
  if(!confirm(`"${file.name}" 파일을 자사몰 후기로 임포트할까요?\n기존 자사몰 데이터는 교체됩니다.`)) return;

  const termBox = document.getElementById('terminalBox');
  const addLog = (msg, color='#d4d4d4') => {
    if(termBox){
      termBox.innerHTML += `<div style="color:${color}">${msg}</div>`;
      termBox.scrollTop = termBox.scrollHeight;
    }
  };

  addLog(`[임포트] ${file.name} (${Math.round(file.size/1024/1024)}MB) 읽는 중...`, '#dcdcaa');

  try{
    // 1. 브라우저에서 파일 읽기
    const text = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => res(e.target.result);
      reader.onerror = rej;
      reader.readAsText(file, 'EUC-KR');
    });

    addLog('[임포트] HTML 파싱 중...', '#dcdcaa');

    // 2. 브라우저에서 DOMParser로 파싱
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const rows = doc.querySelectorAll('tr');
    addLog(`[임포트] ${(rows.length-1).toLocaleString()}건 파싱 완료`, '#4ec9b0');

    // 3. 데이터 변환
    const reviews = [];
    let errors = 0;
    for(let i = 1; i < rows.length; i++){
      const cells = rows[i].querySelectorAll('td,th');
      if(cells.length < 12){ errors++; continue; }
      const dateStr = (cells[10].textContent.trim() || '').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)){ errors++; continue; }
      const content = cells[9].textContent.trim().slice(0,500);
      if(!content || content.length < 2){ errors++; continue; }
      const mid = cells[3].textContent.trim().toUpperCase();
      const platform = mid.includes('KAKAO') ? 'kakao' : mid.includes('NAVER') ? 'naver' : 'direct';
      const score = (cells[11].textContent.match(/★/g)||[]).length;
      reviews.push({
        date: dateStr,
        score: score,
        product: cells[7].textContent.trim().slice(0,80),
        title: cells[8].textContent.trim().slice(0,100),
        content: content,
        platform: platform,
        author: cells[2].textContent.trim().slice(0,20),
      });
    }
    addLog(`[임포트] 변환: ${reviews.length.toLocaleString()}건 (오류 ${errors}건)`, '#4ec9b0');

    // 4. 청크로 나눠서 전송 (5000건씩)
    const CHUNK = 5000;
    const total = reviews.length;
    let sent = 0;
    for(let i = 0; i < total; i += CHUNK){
      const chunk = reviews.slice(i, i+CHUNK);
      const replace = i === 0;
      const res = await fetch('/api/import-jasaol-chunk', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({reviews: chunk, replace})
      });
      if(!res.ok) throw new Error('청크 전송 실패: ' + await res.text());
      sent += chunk.length;
      const pct = Math.round(sent/total*100);
      addLog(`[임포트] 전송 중... ${sent.toLocaleString()}/${total.toLocaleString()}건 (${pct}%)`, '#9cdcfe');
    }

    // 5. 완료 신호
    const doneRes = await fetch('/api/import-jasaol-done', {method: 'POST'});
    const done = await doneRes.json();
    if(done.ok){
      addLog(`[완료] ${done.imported.toLocaleString()}건 임포트 완료!`, '#4ec9b0');
      showToast('✅ 자사몰 임포트 완료! ' + done.imported.toLocaleString() + '건');
      // 데이터 갱신
      const dataRes = await fetch('/api/data');
      if(dataRes.ok){ allData = await dataRes.json(); updateLastUpdated(allData.last_updated); }
    } else {
      throw new Error(JSON.stringify(done));
    }
  }catch(e){
    addLog(`[실패] ${e.message}`, '#f48771');
    showToast('❌ 임포트 실패: ' + e.message);
  }
  input.value = '';
}

}

async function _refreshLog(){
  liveLogOffset = 0;  // 새로고침시 전체 다시 받기
  try{
    const [stRes, logRes, liveRes] = await Promise.all([
      fetch('/api/status'), fetch('/api/logs'), fetch('/api/live-logs?offset=0')
    ]);
    const st = await stRes.json();
    const logs = (await logRes.json()).logs || [];
    const live = await liveRes.json();

    _renderLiveStatus(st);
    _renderTerminal(live.logs || [], st, false);
    _renderLogHistory(logs);
    liveLogOffset = live.total || 0;
  }catch(e){}
}

async function _updateTerminal(){
  if(currentShop !== 'log'){ clearInterval(logPollTimer); logPollTimer=null; return; }
  try{
    const [stRes, liveRes] = await Promise.all([
      fetch('/api/status'),
      fetch(`/api/live-logs?offset=${liveLogOffset}`)  // 새 것만 요청
    ]);
    if(!stRes.ok || !liveRes.ok) return;
    const st = await stRes.json();
    const live = await liveRes.json();
    _renderLiveStatus(st);
    if(live.logs && live.logs.length > 0){
      _renderTerminal(live.logs, st, true);  // append 모드
      liveLogOffset = live.total || liveLogOffset;
    }
    // 수집 끝나면 이력도 갱신
    if(!st.collecting){
      const logRes = await fetch('/api/logs');
      if(logRes.ok){ const d = await logRes.json(); _renderLogHistory(d.logs||[]); }
    }
  }catch(e){}
}

function _renderTerminal(logs, st, append=false){
  const box = document.getElementById('terminalBox');
  if(!box) return;
  if(!logs || logs.length === 0){
    if(!append){
      box.innerHTML = st.collecting
        ? '<div style="color:#888">수집 시작 중...</div>'
        : '<div style="color:#888">수집 이력이 없어요. 수집을 시작하면 여기에 로그가 표시됩니다.</div>';
    }
    return;
  }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const html = logs.map(line => {
    let color = '#d4d4d4';
    if(line.includes('✅') || line.includes('완료')) color = '#4ec9b0';
    else if(line.includes('❌') || line.includes('오류') || line.includes('실패')) color = '#f48771';
    else if(line.includes('[명가')) color = '#ce9178';
    else if(line.includes('[파파')) color = '#9cdcfe';
    else if(line.includes('[자사몰')) color = '#dcdcaa';
    else if(line.includes('중간저장')) color = '#b5cea8';
    const escaped = line.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div style="color:${color}">${escaped}</div>`;
  }).join('');
  if(append){
    box.innerHTML += html;
  } else {
    box.innerHTML = html;
  }
  if(atBottom || append) box.scrollTop = box.scrollHeight;
}

function _renderLiveStatus(st){
  const wrap = document.getElementById('liveStatusWrap');
  if(!wrap) return;
  let html = '';
  if(st.collecting){
    const pct = st.progress_pct || 0;
    html = `<div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:8px;padding:12px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;font-weight:700;color:var(--text)">🔄 수집 중</span>
        <span style="font-size:13px;font-weight:700;color:var(--text)">${pct}%</span>
      </div>
      <div style="background:var(--amber-bg);border-radius:4px;height:5px;overflow:hidden;margin-bottom:6px">
        <div style="height:100%;background:var(--amber);border-radius:4px;transition:width .3s;width:${Math.max(pct,2)}%"></div>
      </div>
      <div style="font-size:12px;color:var(--text2)">${st.progress_msg||''}</div>
    </div>`;
  } else if(st.last_error){
    html = `<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:8px;padding:12px 16px">
      <div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:4px">❌ 마지막 오류</div>
      <div style="font-size:12px;color:var(--red);font-family:var(--mono);word-break:break-all">${st.last_error}</div>
    </div>`;
  } else if(st.last_success){
    html = `<div style="background:var(--green-bg);border:1px solid var(--green);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--green)">✅ 마지막 성공: ${st.last_success.replace('T',' ').slice(0,19)}</div>`;
  }
  wrap.innerHTML = html;
}

function _renderLogHistory(logs){
  const wrap = document.getElementById('logHistoryWrap');
  if(!wrap) return;
  const rows = logs.map(l=>`<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
    <span style="font-size:11px;font-family:var(--mono);color:var(--text3);flex-shrink:0;white-space:nowrap">${l.time}</span>
    <span style="font-size:12px;${l.success?'color:var(--green)':'color:var(--red)'}">${l.success?'✅':'❌'} ${l.detail}</span>
  </div>`).join('') || '<div style="font-size:13px;color:var(--text3);text-align:center;padding:12px">로그 없음</div>';
  wrap.innerHTML = rows;
}

async function _updateLiveLog(){
  // localTickTimer에서 호출 - 수집로그 탭 실시간 업데이트
  if(currentShop === 'log') await _updateTerminal();
}

loadData();
// 1시간마다 백그라운드 갱신 (수집중이거나 필터 적용 중이면 스킵)
setInterval(async ()=>{
  if(collectPollTimer) return;  // 수집 중 스킵
  if(dateFilterStart) return;   // 기간 필터 적용 중 스킵 (사용자 조작 방해 방지)
  await loadData();
}, 60*60*1000);
</script>

<!-- ── 플로팅 메모 패널 ── -->
<button id="memoFab" onclick="mpToggle()" title="빠른 메모" aria-label="메모 열기">
  📝
  <span id="mpBadge" class="mp-badge"></span>
</button>
<div id="memoPanel">
  <div class="mp-header">
    <span>📝 메모</span>
    <button class="mp-close-btn" onclick="mpToggle()" title="닫기">✕</button>
  </div>
  <div class="mp-body">
    <div class="mp-input-row">
      <textarea id="mpInput" class="mp-input" placeholder="Ctrl+Enter로 저장" rows="3"></textarea>
      <button id="mpSaveBtn" class="mp-save-btn" onclick="mpSave()">저장</button>
    </div>
    <div id="mpList" class="mp-list"></div>
  </div>
</div>
<div id="mpToast" class="mp-toast"></div>




<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel(\'' + m.id + '\')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
