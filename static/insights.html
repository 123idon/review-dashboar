<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인사이트 — 백년화편</title>
  <style>
/* =====================================================
   백년화편 디자인 시스템 — 토스 스타일
   모든 페이지 공통 적용
   ===================================================== */

/* ─── 라이트 모드 ─── */
[data-theme="day"], :root {
  --bg:           #F9FAFB;
  --bg2:          #F2F4F6;
  --surface:      #FFFFFF;
  --surface2:     #F2F4F6;
  --border:       #E5E8EB;
  --border2:      #CDD1D8;
  --text:         #191F28;
  --text2:        #333D4B;
  --text3:        #6B7684;
  --text4:        #B0B8C1;
  --muted:        #6B7684;

  /* 퍼스널 컬러 — 브랜드 앰버·오렌지 */
  --brand:        #F5820D;
  --brand-dark:   #D96E00;
  --brand-bg:     #FFF4E6;
  --brand-light:  #FFF4E6;
  --brand-rgb:    245,130,13;
  --accent-d:     #F5820D;

  --blue:         #3182F6;
  --blue-bg:      #EBF3FE;
  --blue-light:   #EBF3FE;
  --blue-rgb:     49,130,246;

  --red:          #F04452;
  --red-bg:       #FFF0F0;
  --red-light:    #FFF0F0;
  --danger:       #F04452;
  --danger-bg:    #FFF0F0;

  --green:        #00A86B;
  --green-bg:     #E8FAF4;
  --green-light:  #E8FAF4;
  --positive:     #00A86B;
  --positive-bg:  #E8FAF4;

  --purple:       #6C47FF;
  --purple-bg:    #F3F0FF;
  --purple-light: #F3F0FF;

  --teal:         #00BCD4;
  --teal-bg:      #E6F9FC;
  --teal-light:   #E6F9FC;

  --amber:        #F59E0B;
  --amber-bg:     #FFFAEB;
  --amber-light:  #FFFAEB;

  --mono:         'SF Mono','JetBrains Mono',monospace;
  --r-pill:       50px;

  /* 그림자 — 두 세트 동시 지원 */
  --sh-xs:        0 1px 2px rgba(0,0,0,.05);
  --sh-sm:        0 2px 8px rgba(0,0,0,.07);
  --sh-md:        0 4px 16px rgba(0,0,0,.09);
  --sh-lg:        0 8px 32px rgba(0,0,0,.11);
  --sh-xl:        0 20px 56px rgba(0,0,0,.13);
  --sh-brand:     0 4px 14px rgba(245,130,13,.28);
  --sh-blue:      0 4px 14px rgba(49,130,246,.25);
  --shadow-xs:    0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:    0 2px 8px rgba(0,0,0,.07);
  --shadow-md:    0 4px 16px rgba(0,0,0,.09);
  --shadow-xl:    0 20px 56px rgba(0,0,0,.13);
  --shadow-brand: 0 4px 14px rgba(245,130,13,.28);
  --shadow-blue:  0 4px 14px rgba(49,130,246,.25);
}

/* ─── 다크 모드 ─── */
[data-theme="night"] {
  --bg:           #0E1117;
  --bg2:          #161C27;
  --surface:      #1A2130;
  --surface2:     #212B3D;
  --border:       #2A3547;
  --border2:      #3A4A60;
  --text:         #F2F4F6;
  --text2:        #C8D0DA;
  --text3:        #7A8899;
  --text4:        #3F5068;
  --muted:        #7A8899;

  --brand:        #FF9A30;
  --brand-dark:   #FFB558;
  --brand-bg:     rgba(255,154,48,.14);
  --brand-light:  rgba(255,154,48,.14);
  --brand-rgb:    255,154,48;
  --accent-d:     #FF9A30;

  --blue:         #4D9BFF;
  --blue-bg:      rgba(77,155,255,.14);
  --blue-light:   rgba(77,155,255,.14);
  --blue-rgb:     77,155,255;

  --red:          #FF6B75;
  --red-bg:       rgba(255,107,117,.14);
  --red-light:    rgba(255,107,117,.14);
  --danger:       #FF6B75;
  --danger-bg:    rgba(255,107,117,.14);

  --green:        #1FC791;
  --green-bg:     rgba(31,199,145,.14);
  --green-light:  rgba(31,199,145,.14);
  --positive:     #1FC791;
  --positive-bg:  rgba(31,199,145,.14);

  --purple:       #8B6FFF;
  --purple-bg:    rgba(139,111,255,.14);
  --purple-light: rgba(139,111,255,.14);

  --teal:         #22D3EE;
  --teal-bg:      rgba(34,211,238,.14);
  --teal-light:   rgba(34,211,238,.14);

  --amber:        #FBB928;
  --amber-bg:     rgba(251,185,40,.14);
  --amber-light:  rgba(251,185,40,.14);

  --sh-xs:        0 1px 2px rgba(0,0,0,.25);
  --sh-sm:        0 2px 8px rgba(0,0,0,.35);
  --sh-md:        0 4px 16px rgba(0,0,0,.45);
  --sh-lg:        0 8px 32px rgba(0,0,0,.55);
  --sh-xl:        0 20px 56px rgba(0,0,0,.65);
  --sh-brand:     0 4px 14px rgba(255,154,48,.28);
  --sh-blue:      0 4px 14px rgba(77,155,255,.28);
  --shadow-xs:    0 1px 2px rgba(0,0,0,.25);
  --shadow-sm:    0 2px 8px rgba(0,0,0,.35);
  --shadow-md:    0 4px 16px rgba(0,0,0,.45);
  --shadow-xl:    0 20px 56px rgba(0,0,0,.65);
  --shadow-brand: 0 4px 14px rgba(255,154,48,.28);
  --shadow-blue:  0 4px 14px rgba(77,155,255,.28);
}

/* ─── 리셋 ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s ease, color .2s ease;
}

/* ─── 키프레임 ─── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
@keyframes spin     { to{transform:rotate(360deg)} }
@keyframes dotBlink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
@keyframes shimmer  { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.72)} }
@keyframes spring   { 0%{transform:scale(.88) translateY(14px);opacity:0} 100%{transform:scale(1) translateY(0);opacity:1} }

/* ─── 공통 컴포넌트 ─── */

/* 스켈레톤 */
.skeleton {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 400px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}

/* 스피너 */
.spinner {
  width: 26px; height: 26px;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}

/* 프로그레스 바 */
.progress-wrap { position:fixed; top:0; left:0; width:100%; height:3px; z-index:9999; pointer-events:none; }
.progress-bar  {
  height:100%; width:0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* 토스트 */
#toast {
  position:fixed; bottom:32px; left:50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg);
  font-size:13px; font-weight:700;
  padding:10px 22px; border-radius:50px;
  opacity:0; pointer-events:none; z-index:9999;
  white-space:nowrap;
  transition: opacity 200ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 테마 버튼 */
.theme-toggle {
  position:fixed; bottom:22px; left:20px; z-index:999;
  width:40px; height:40px; border-radius:50%;
  border:1.5px solid var(--border); background:var(--surface);
  color:var(--text3); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sh-sm);
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 150ms ease;
  -webkit-tap-highlight-color:transparent;
}
.theme-toggle:hover  { transform:scale(1.1); box-shadow:var(--sh-md); }
.theme-toggle:active { transform:scale(.92); }

/* 메모 FAB */
#memoFab {
  position:fixed; bottom:22px; right:22px; z-index:900;
  width:52px; height:52px; border-radius:50%;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  color:#fff; border:none; cursor:pointer; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--sh-brand);
  transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color:transparent;
}
#memoFab:hover  { transform:scale(1.1) rotate(-6deg); box-shadow:0 8px 28px rgba(var(--brand-rgb),.45); }
#memoFab:active { transform:scale(.94); }

.mp-badge {
  position:absolute; top:5px; right:5px;
  min-width:17px; height:17px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9px; font-weight:800; border-radius:50px;
  border:2.5px solid var(--surface);
  display:none; align-items:center; justify-content:center;
}
.mp-badge.show { display:flex; }

/* 메모 패널 */
#memoPanel {
  position:fixed; bottom:84px; right:22px; z-index:901;
  width:320px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:20px; box-shadow:var(--sh-xl); overflow:hidden;
  transform:scale(.88) translateY(14px); transform-origin:bottom right;
  opacity:0; pointer-events:none;
  transition: transform 280ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease;
}
#memoPanel.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }

.mp-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--border);
  font-size:14px; font-weight:700;
}
.mp-close-btn {
  width:26px; height:26px; border-radius:50%;
  border:none; background:var(--surface2); color:var(--text3);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-close-btn:hover { background:var(--border); color:var(--text); }

.mp-body { padding:14px 18px; }
.mp-input-row { display:flex; gap:8px; margin-bottom:12px; }
.mp-input {
  flex:1; padding:10px 12px;
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:12px; color:var(--text);
  font-family:inherit; font-size:13px; line-height:1.6;
  resize:none; outline:none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }

.mp-save-btn {
  height:36px; padding:0 14px; align-self:flex-end;
  border-radius:50px; border:none;
  background:var(--brand); color:#fff;
  font-family:inherit; font-size:12px; font-weight:700;
  cursor:pointer; flex-shrink:0;
  transition:all 150ms ease;
}
.mp-save-btn:hover   { background:var(--brand-dark); }
.mp-save-btn:active  { transform:scale(.96); }
.mp-save-btn:disabled { opacity:.5; cursor:not-allowed; }

.mp-list { max-height:260px; overflow-y:auto; scrollbar-width:thin; }

.mp-card { padding:10px 0; border-bottom:1px solid var(--border); position:relative; }
.mp-card:last-child { border-bottom:none; }
.mp-card-text { font-size:12px; color:var(--text2); line-height:1.6; padding-right:28px; }
.mp-card-date { font-size:10px; color:var(--text4); margin-top:4px; font-variant-numeric:tabular-nums; }
.mp-del-btn {
  position:absolute; top:10px; right:0;
  width:22px; height:22px; border-radius:50%;
  border:none; background:transparent; color:var(--text4);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-del-btn:hover { background:var(--red-bg); color:var(--red); }
.mp-empty { font-size:12px; color:var(--text4); text-align:center; padding:20px 0; }

.mp-toast {
  position:fixed; bottom:88px; right:80px; z-index:902;
  background:var(--text); color:var(--bg);
  font-size:12px; font-weight:700;
  padding:8px 16px; border-radius:50px;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:all 200ms ease;
}
.mp-toast.show { opacity:1; transform:translateY(0); }

@media (max-width:480px) {
  #memoPanel { width:calc(100vw - 28px); right:14px; bottom:78px; }
  #memoFab   { width:48px; height:48px; right:16px; bottom:18px; }
}


body { display:flex; flex-direction:column; }
.app-header,.page-header-bar {
  position:sticky; top:0; z-index:100; height:56px;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:12px;
  box-shadow:var(--sh-xs); backdrop-filter:blur(8px);
  transition:background .2s ease;
}
.app-header-left { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.back-link {
  display:inline-flex; align-items:center; gap:5px;
  height:32px; padding:0 12px; border-radius:50px;
  border:1.5px solid var(--border); background:transparent;
  font-size:12px; font-weight:600; color:var(--text3);
  text-decoration:none; cursor:pointer; flex-shrink:0;
  transition:all 150ms ease;
}
.back-link:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-bg); }
.back-link svg { width:14px; height:14px; stroke:currentColor; }
.brand-mark { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.brand-name { font-size:15px; font-weight:800; letter-spacing:-.4px; }
.brand-sub  { font-size:10px; color:var(--text4); letter-spacing:.5px; text-transform:uppercase; }
.page-wrap  { flex:1; max-width:680px; margin:0 auto; padding:24px 20px 80px; width:100%; }
.page-wrap-wide { flex:1; max-width:960px; margin:0 auto; padding:0 20px 80px; width:100%; }

.page-wrap { max-width:960px; padding:0 20px 80px; }
.logo-icon { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--purple),var(--blue)); display:flex; align-items:center; justify-content:center; font-size:16px; }
.ins-hero { text-align:center; padding:44px 20px 28px; animation:fadeDown 280ms cubic-bezier(0.16,1,0.3,1) both; }
.page-badge { display:inline-flex; align-items:center; height:26px; padding:0 12px; border-radius:50px; background:var(--purple-bg); color:var(--purple); font-size:11px; font-weight:700; margin-bottom:16px; letter-spacing:.3px; }
.ins-hero h1 { font-size:26px; font-weight:900; letter-spacing:-1px; margin-bottom:7px; }
.ins-hero p  { font-size:13px; color:var(--text3); line-height:1.65; }
.filter-bar  { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:0 20px 22px; }
.flt-btn {
  height:30px; padding:0 15px; border-radius:50px;
  border:1.5px solid var(--border); background:transparent;
  font-family:inherit; font-size:12px; font-weight:600; color:var(--text3); cursor:pointer;
  transition:all 150ms ease;
}
.flt-btn:hover  { border-color:var(--purple); color:var(--purple); }
.flt-btn.active { background:var(--purple); border-color:var(--purple); color:#fff; box-shadow:0 2px 10px rgba(108,71,255,.3); }
.reports-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; padding:0 20px 80px; }
.report-card {
  background:var(--surface); border:1.5px solid var(--border); border-radius:18px; padding:22px;
  text-decoration:none; color:inherit; display:block;
  transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease, border-color 200ms ease;
  animation:fadeUp 280ms cubic-bezier(0.16,1,0.3,1) both;
}
.report-card:hover { transform:translateY(-5px); box-shadow:var(--sh-lg); border-color:var(--border2); }
.report-icon  { font-size:28px; margin-bottom:12px; }
.report-type  { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:50px; margin-bottom:8px; letter-spacing:.4px; }
.type-weekly   { background:var(--blue-bg);   color:var(--blue); }
.type-monthly  { background:var(--purple-bg); color:var(--purple); }
.type-quarterly{ background:var(--green-bg);  color:var(--green); }
.type-other    { background:var(--surface2);  color:var(--text3); }
.report-title { font-size:15px; font-weight:800; letter-spacing:-.4px; margin:6px 0 4px; line-height:1.4; }
.report-date  { font-size:11px; color:var(--text4); font-variant-numeric:tabular-nums; }
.loading { display:flex; flex-direction:column; align-items:center; gap:12px; padding:56px 20px; color:var(--text3); font-size:13px; }
.empty-state { grid-column:1/-1; text-align:center; padding:64px 20px; }
.empty-state .icon { font-size:40px; margin-bottom:16px; }
.empty-state p { font-size:14px; color:var(--text3); }
/* mp */
.mp-card { padding:10px 0; border-bottom:1px solid var(--border); position:relative; }
.mp-card:last-child { border-bottom:none; }
.mp-card-text { font-size:12px; color:var(--text2); line-height:1.6; padding-right:28px; }
.mp-card-date { font-size:10px; color:var(--text4); margin-top:4px; font-variant-numeric:tabular-nums; }
.mp-del-btn { position:absolute; top:10px; right:0; width:22px; height:22px; border-radius:50%; border:none; background:transparent; color:var(--text4); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all 150ms ease; }
.mp-del-btn:hover { background:var(--red-bg); color:var(--red); }
.mp-empty { font-size:12px; color:var(--text4); text-align:center; padding:20px 0; }
@media(max-width:600px){.reports-grid{grid-template-columns:1fr;padding:0 14px 80px;} .ins-hero{padding:28px 14px 18px;} .filter-bar{padding:0 14px 18px;}}

</style>
<script>
(function(){var DS=6,DE=20;function auto(){var h=new Date().getHours();return(h>=DS&&h<DE)?'day':'night';}function apply(m,save){document.documentElement.setAttribute('data-theme',m);var b=document.getElementById('themeToggle');if(b)b.textContent=m==='night'?'☀️':'🌙';if(save){try{localStorage.setItem('bnh_theme',m);}catch(e){}}}window.__toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme')||'day';apply(c==='day'?'night':'day',true);};setInterval(function(){try{if(!localStorage.getItem('bnh_theme'))apply(auto(),false);}catch(e){}},60000);(function(){var m=null;try{m=localStorage.getItem('bnh_theme');}catch(e){}apply(m||auto(),false);})();})();
})();
})();
</script>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-icon">🍡</div>
      <div>
        <div class="brand-name">백년화편</div>
        <div class="brand-sub">Management System</div>
      </div>
    </div>
    <a href="/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      메인으로
    </a>
  </header>

  <div class="page-header">
    <div class="page-badge">📊 Insights</div>
    <h1>인사이트 리포트</h1>
    <p>주간·월간 브랜드 분석 리포트를 한곳에서 확인하세요.</p>
  </div>

  <div class="filter-bar">
    <button class="flt-btn active" onclick="filterReports('all', this)">전체</button>
    <button class="flt-btn" onclick="filterReports('weekly', this)">주간</button>
    <button class="flt-btn" onclick="filterReports('monthly', this)">월간</button>
    <button class="flt-btn" onclick="filterReports('quarterly', this)">분기별</button>
  </div>

  <div class="reports-grid" id="reportsGrid">
    <div class="loading">
      <div class="spinner"></div>
      리포트 불러오는 중…
    </div>
  </div>

  <script>
    let allReports = [];
    let currentFilter = 'all';

    async function loadReports() {
      try {
        const res = await fetch('/api/reports');
        const data = await res.json();
        allReports = data.reports || [];
        render();
      } catch(e) {
        document.getElementById('reportsGrid').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><h3>불러오기 실패</h3><p>서버와 연결할 수 없어요.</p></div>';
      }
    }

    function filterReports(type, el) {
      currentFilter = type;
      document.querySelectorAll('.flt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function guessType(filename) {
      const f = filename.toLowerCase();
      if (f.includes('quarterly') || f.includes('분기')) return 'quarterly';
      if (f.includes('monthly') || f.includes('월간')) return 'monthly';
      return 'weekly';
    }

    function formatDate(mtime) {
      const d = new Date(mtime * 1000);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function makeTitleFromFilename(filename) {
      const base = filename.replace('.html', '');
      // 2026-W19_weekly  → 2026년 19주차 주간 리포트
      const weekly = base.match(/^(\d{4})-W(\d{1,2})/);
      if (weekly) return `${weekly[1]}년 ${weekly[2]}주차 주간 리포트`;
      // 2026-05_monthly  → 2026년 5월 월간 리포트
      const monthly = base.match(/^(\d{4})-(\d{2})/);
      if (monthly) return `${monthly[1]}년 ${parseInt(monthly[2])}월 월간 리포트`;
      // 2026-Q2_quarterly → 2026년 2분기 리포트
      const quarterly = base.match(/^(\d{4})-Q(\d)/);
      if (quarterly) return `${quarterly[1]}년 ${quarterly[2]}분기 리포트`;
      // fallback
      return base.replace(/_/g, ' ');
    }

    function render() {
      const grid = document.getElementById('reportsGrid');
      const filtered = currentFilter === 'all'
        ? allReports
        : allReports.filter(r => guessType(r.filename) === currentFilter);

      if (!filtered.length) {
        const msg = allReports.length === 0
          ? '<div class="empty-state"><div class="icon">📭</div><h3>아직 리포트가 없어요</h3><p>주간 리포트 대화에서 리포트를 생성하고<br>GitHub에 업로드하면 여기 자동으로 나타나요.</p></div>'
          : '<div class="empty-state"><div class="icon">🔍</div><h3>해당 유형의 리포트가 없어요</h3><p>다른 필터를 선택해 보세요.</p></div>';
        grid.innerHTML = msg;
        return;
      }

      grid.innerHTML = filtered.map(r => {
        const type = guessType(r.filename);
        const badgeCls = type === 'quarterly' ? 'badge-quarterly' : type === 'monthly' ? 'badge-monthly' : 'badge-weekly';
        const badgeLabel = type === 'quarterly' ? '📈 분기' : type === 'monthly' ? '📅 월간' : '📆 주간';
        const title = makeTitleFromFilename(r.filename);
        const date = formatDate(r.modified);
        return `
          <a class="report-card" href="${r.url}" target="_blank">
            <div class="report-type-badge ${badgeCls}">${badgeLabel}</div>
            <div class="report-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17L17 7M17 7H7M17 7v10"/>
              </svg>
            </div>
            <div class="report-title">${title}</div>
            <div class="report-date">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              ${date} 업로드
            </div>
          </a>`;
      }).join('');
    }

    loadReports();
  </script>

<!-- ── 플로팅 메모 패널 ── -->
<button id="memoFab" onclick="mpToggle()" title="빠른 메모" aria-label="메모 열기">
  📝
  <span id="mpBadge" class="mp-badge"></span>
</button>
<div id="memoPanel">
  <div class="mp-header">
    <span>📝 메모</span>
    <button class="mp-close-btn" onclick="mpToggle()" title="닫기">✕</button>
  </div>
  <div class="mp-body">
    <div class="mp-input-row">
      <textarea id="mpInput" class="mp-input" placeholder="Ctrl+Enter로 저장" rows="3"></textarea>
      <button id="mpSaveBtn" class="mp-save-btn" onclick="mpSave()">저장</button>
    </div>
    <div id="mpList" class="mp-list"></div>
  </div>
</div>
<div id="mpToast" class="mp-toast"></div>


<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel('' + m.id + '')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
</body>
</html>
