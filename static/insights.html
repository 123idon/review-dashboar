<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인사이트 — 백년화편</title>
  <style>
:root {
  /* ── 토스 컬러 시스템 ── */
  --bg:        #f9fafb;
  --surface:   #ffffff;
  --surface2:  #f2f4f6;
  --border:    #e5e8eb;
  --border2:   #d1d6db;

  --text:      #191f28;
  --text2:     #333d4b;
  --text3:     #6b7684;
  --text4:     #b0b8c1;

  --primary:        #3182f6;
  --primary-light:  #ebf3fe;
  --primary-dark:   #1b64da;

  --red:        #f04452;
  --red-light:  #fff0f0;
  --green:      #00a86b;
  --green-light:#e8faf4;
  --orange:     #ff6b00;
  --orange-light:#fff4eb;
  --yellow:     #f5a623;
  --yellow-light:#fffaeb;
  --purple:     #6c47ff;
  --purple-light:#f3f0ff;
  --teal:       #00bcd4;
  --teal-light: #e6f9fc;

  /* ── 그림자 ── */
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md:  0 4px 16px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
  --shadow-xl:  0 16px 48px rgba(0,0,0,.14), 0 8px 24px rgba(0,0,0,.08);

  /* ── 반경 ── */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-pill:50px;

  /* ── 폰트 ── */
  --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* ── 애니메이션 ── */
  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-in-out: cubic-bezier(0.45,0,0.55,1);
  --duration-fast:  150ms;
  --duration-base:  220ms;
  --duration-slow:  350ms;
}

html.night {
  --bg:        #131820;
  --surface:   #1c2330;
  --surface2:  #242e3d;
  --border:    #2d3a4a;
  --border2:   #3d4e62;
  --text:      #f2f4f6;
  --text2:     #d0d7e0;
  --text3:     #8b95a1;
  --text4:     #4e5968;
  --primary:        #4593fc;
  --primary-light:  rgba(69,147,252,0.15);
  --primary-dark:   #6aadff;
  --red:        #ff6b6b;
  --red-light:  rgba(240,68,82,0.15);
  --green:      #20c997;
  --green-light:rgba(0,168,107,0.15);
  --shadow-sm:  0 1px 4px rgba(0,0,0,.3);
  --shadow-md:  0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.5);
}

    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

    header{
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:0 20px;display:flex;align-items:center;
      justify-content:space-between;height:56px;
      position:sticky;top:0;z-index:100;
      box-shadow:var(--shadow-sm);
    }
    .header-left{display:flex;align-items:center;gap:10px;}
    .logo-icon{
      width:32px;height:32px;background:linear-gradient(135deg,var(--purple),var(--primary));
      border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;
    }
    .brand-name{font-size:15px;font-weight:800;letter-spacing:-.4px;}
    .brand-sub{font-size:10px;color:var(--text4);letter-spacing:.5px;text-transform:uppercase;}
    .back-btn{
      display:flex;align-items:center;gap:5px;
      font-size:12px;font-weight:600;color:var(--text3);
      text-decoration:none;padding:6px 14px;border-radius:var(--r-pill);
      border:1.5px solid var(--border);background:var(--surface);
      transition:all var(--duration-fast) var(--ease-out);
    }
    .back-btn:hover{border-color:var(--primary);color:var(--primary);}
    .back-btn svg{width:14px;height:14px;stroke:currentColor;}

    .page-header{
      max-width:960px;margin:0 auto;padding:40px 20px 28px;text-align:center;
      animation:fadeSlideDown var(--duration-slow) var(--ease-out) both;
    }
    .page-badge{
      display:inline-flex;align-items:center;gap:5px;
      background:var(--purple-light);color:var(--purple);
      font-size:11px;font-weight:700;padding:4px 12px;
      border-radius:var(--r-pill);margin-bottom:16px;letter-spacing:.3px;
    }
    .page-header h1{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px;}
    .page-header p{font-size:13px;color:var(--text3);line-height:1.65;}

    .filter-bar{
      display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
      max-width:960px;margin:0 auto;padding:0 20px 24px;
    }
    .flt-btn{
      height:32px;padding:0 16px;border-radius:var(--r-pill);
      border:1.5px solid var(--border);background:var(--surface);
      font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;
      font-family:var(--font);
      transition:all var(--duration-fast) var(--ease-out);
    }
    .flt-btn:hover{border-color:var(--purple);color:var(--purple);}
    .flt-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(108,71,255,.25);}

    .reports-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:14px;max-width:960px;margin:0 auto;padding:0 20px 60px;
    }
    .report-card{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:var(--r-lg);padding:20px;
      text-decoration:none;color:inherit;display:block;
      transition:transform var(--duration-base) var(--spring),
                 box-shadow var(--duration-base) var(--ease-out),
                 border-color var(--duration-base) var(--ease-out);
      animation:fadeSlideUp var(--duration-base) var(--ease-out) both;
    }
    .report-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--border2);}
    .report-icon{font-size:28px;margin-bottom:14px;}
    .report-type{
      display:inline-block;font-size:10px;font-weight:700;
      padding:2px 8px;border-radius:var(--r-pill);margin-bottom:10px;letter-spacing:.4px;
    }
    .type-weekly{background:var(--primary-light);color:var(--primary);}
    .type-monthly{background:var(--purple-light);color:var(--purple);}
    .type-quarterly{background:var(--green-light);color:var(--green);}
    .type-other{background:var(--surface2);color:var(--text3);}
    .report-title{font-size:14px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px;line-height:1.4;}
    .report-date{font-size:11px;color:var(--text4);font-family:var(--mono);}
    .report-size{font-size:10px;color:var(--text4);margin-top:4px;}
    .loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 20px;color:var(--text3);}
    .spinner{width:24px;height:24px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .empty-state{text-align:center;padding:60px 20px;grid-column:1/-1;}
    .empty-state .icon{font-size:40px;margin-bottom:16px;}
    .empty-state p{font-size:14px;color:var(--text3);}

    /* 메모 패널 */
    #memoFab{
      position:fixed;bottom:24px;right:24px;z-index:900;
      width:52px;height:52px;border-radius:50%;
      background:linear-gradient(135deg,var(--yellow),var(--orange));
      border:none;cursor:pointer;font-size:20px;
      box-shadow:0 4px 16px rgba(255,107,0,.4);
      transition:transform var(--duration-base) var(--spring), box-shadow var(--duration-base) var(--ease-out);
      display:flex;align-items:center;justify-content:center;
    }
    #memoFab:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(255,107,0,.5);}
    #memoFab:active{transform:scale(.95);}
    .mp-badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:var(--r-pill);display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface);}
    .mp-badge.show{display:flex;}
    #memoPanel{position:fixed;bottom:86px;right:24px;z-index:901;width:320px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);transform:scale(.9) translateY(12px);opacity:0;pointer-events:none;transform-origin:bottom right;transition:transform var(--duration-base) var(--spring),opacity var(--duration-base) var(--ease-out);overflow:hidden;}
    #memoPanel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}
    .mp-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
    .mp-close-btn{width:24px;height:24px;border-radius:50%;border:none;background:var(--surface2);color:var(--text3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all var(--duration-fast) var(--ease-out);}
    .mp-close-btn:hover{background:var(--border);color:var(--text);}
    .mp-body{padding:14px;}
    .mp-input-row{display:flex;gap:8px;margin-bottom:12px;}
    .mp-input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;resize:none;outline:none;transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out);}
    .mp-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .mp-save-btn{height:36px;padding:0 14px;align-self:flex-end;border-radius:var(--r-md);border:none;background:var(--primary);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);flex-shrink:0;transition:all var(--duration-fast) var(--ease-out);}
    .mp-save-btn:hover{background:var(--primary-dark);}
    .mp-list{max-height:240px;overflow-y:auto;}
    .mp-card{padding:10px 0;border-bottom:1px solid var(--border);position:relative;}
    .mp-card:last-child{border-bottom:none;}
    .mp-card-text{font-size:12px;color:var(--text2);line-height:1.6;padding-right:28px;}
    .mp-card-date{font-size:10px;color:var(--text4);margin-top:4px;font-family:var(--mono);}
    .mp-del-btn{position:absolute;top:10px;right:0;width:20px;height:20px;border-radius:50%;border:none;background:transparent;color:var(--text4);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all var(--duration-fast) var(--ease-out);}
    .mp-del-btn:hover{background:var(--red-light);color:var(--red);}
    .mp-empty{font-size:12px;color:var(--text4);text-align:center;padding:20px 0;}
    .mp-toast{position:fixed;bottom:90px;right:80px;z-index:902;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:8px 16px;border-radius:var(--r-pill);opacity:0;transform:translateY(8px);transition:all var(--duration-base) var(--ease-out);pointer-events:none;}
    .mp-toast.show{opacity:1;transform:translateY(0);}

    .theme-toggle{position:fixed;bottom:20px;left:20px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:999;box-shadow:var(--shadow-sm);transition:transform var(--duration-fast) var(--spring),box-shadow var(--duration-fast) var(--ease-out);-webkit-tap-highlight-color:transparent;}
    .theme-toggle:hover{transform:scale(1.08);box-shadow:var(--shadow-md);}

    @keyframes fadeSlideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:600px){.reports-grid{grid-template-columns:1fr;padding:0 16px 48px;}.page-header{padding:28px 16px 20px;}.filter-bar{padding:0 16px 20px;}}
    @media(max-width:480px){#memoPanel{width:calc(100vw - 32px);right:16px;bottom:82px;}#memoFab{width:46px;height:46px;font-size:18px;bottom:20px;right:18px;}}

</style>
<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function init() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-icon">🍡</div>
      <div>
        <div class="brand-name">백년화편</div>
        <div class="brand-sub">Management System</div>
      </div>
    </div>
    <a href="/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      메인으로
    </a>
  </header>

  <div class="page-header">
    <div class="page-badge">📊 Insights</div>
    <h1>인사이트 리포트</h1>
    <p>주간·월간 브랜드 분석 리포트를 한곳에서 확인하세요.</p>
  </div>

  <div class="filter-bar">
    <button class="flt-btn active" onclick="filterReports('all', this)">전체</button>
    <button class="flt-btn" onclick="filterReports('weekly', this)">주간</button>
    <button class="flt-btn" onclick="filterReports('monthly', this)">월간</button>
    <button class="flt-btn" onclick="filterReports('quarterly', this)">분기별</button>
  </div>

  <div class="reports-grid" id="reportsGrid">
    <div class="loading">
      <div class="spinner"></div>
      리포트 불러오는 중…
    </div>
  </div>

  <script>
    let allReports = [];
    let currentFilter = 'all';

    async function loadReports() {
      try {
        const res = await fetch('/api/reports');
        const data = await res.json();
        allReports = data.reports || [];
        render();
      } catch(e) {
        document.getElementById('reportsGrid').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><h3>불러오기 실패</h3><p>서버와 연결할 수 없어요.</p></div>';
      }
    }

    function filterReports(type, el) {
      currentFilter = type;
      document.querySelectorAll('.flt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function guessType(filename) {
      const f = filename.toLowerCase();
      if (f.includes('quarterly') || f.includes('분기')) return 'quarterly';
      if (f.includes('monthly') || f.includes('월간')) return 'monthly';
      return 'weekly';
    }

    function formatDate(mtime) {
      const d = new Date(mtime * 1000);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function makeTitleFromFilename(filename) {
      const base = filename.replace('.html', '');
      // 2026-W19_weekly  → 2026년 19주차 주간 리포트
      const weekly = base.match(/^(\d{4})-W(\d{1,2})/);
      if (weekly) return `${weekly[1]}년 ${weekly[2]}주차 주간 리포트`;
      // 2026-05_monthly  → 2026년 5월 월간 리포트
      const monthly = base.match(/^(\d{4})-(\d{2})/);
      if (monthly) return `${monthly[1]}년 ${parseInt(monthly[2])}월 월간 리포트`;
      // 2026-Q2_quarterly → 2026년 2분기 리포트
      const quarterly = base.match(/^(\d{4})-Q(\d)/);
      if (quarterly) return `${quarterly[1]}년 ${quarterly[2]}분기 리포트`;
      // fallback
      return base.replace(/_/g, ' ');
    }

    function render() {
      const grid = document.getElementById('reportsGrid');
      const filtered = currentFilter === 'all'
        ? allReports
        : allReports.filter(r => guessType(r.filename) === currentFilter);

      if (!filtered.length) {
        const msg = allReports.length === 0
          ? '<div class="empty-state"><div class="icon">📭</div><h3>아직 리포트가 없어요</h3><p>주간 리포트 대화에서 리포트를 생성하고<br>GitHub에 업로드하면 여기 자동으로 나타나요.</p></div>'
          : '<div class="empty-state"><div class="icon">🔍</div><h3>해당 유형의 리포트가 없어요</h3><p>다른 필터를 선택해 보세요.</p></div>';
        grid.innerHTML = msg;
        return;
      }

      grid.innerHTML = filtered.map(r => {
        const type = guessType(r.filename);
        const badgeCls = type === 'quarterly' ? 'badge-quarterly' : type === 'monthly' ? 'badge-monthly' : 'badge-weekly';
        const badgeLabel = type === 'quarterly' ? '📈 분기' : type === 'monthly' ? '📅 월간' : '📆 주간';
        const title = makeTitleFromFilename(r.filename);
        const date = formatDate(r.modified);
        return `
          <a class="report-card" href="${r.url}" target="_blank">
            <div class="report-type-badge ${badgeCls}">${badgeLabel}</div>
            <div class="report-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17L17 7M17 7H7M17 7v10"/>
              </svg>
            </div>
            <div class="report-title">${title}</div>
            <div class="report-date">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              ${date} 업로드
            </div>
          </a>`;
      }).join('');
    }

    loadReports();
  </script>

<!-- ── 플로팅 메모 패널 ── -->
<button id="memoFab" onclick="mpToggle()" title="빠른 메모" aria-label="메모 열기">
  📝
  <span id="mpBadge" class="mp-badge"></span>
</button>
<div id="memoPanel">
  <div class="mp-header">
    <span>📝 메모</span>
    <button class="mp-close-btn" onclick="mpToggle()" title="닫기">✕</button>
  </div>
  <div class="mp-body">
    <div class="mp-input-row">
      <textarea id="mpInput" class="mp-input" placeholder="Ctrl+Enter로 저장" rows="3"></textarea>
      <button id="mpSaveBtn" class="mp-save-btn" onclick="mpSave()">저장</button>
    </div>
    <div id="mpList" class="mp-list"></div>
  </div>
</div>
<div id="mpToast" class="mp-toast"></div>


<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel('' + m.id + '')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
</body>
</html>
