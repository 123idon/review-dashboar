<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인사이트 — 백년화편</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      color: var(--text);
    }

    /* ── 헤더 ── */
    header {
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #f97316, #ec4899);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name { font-size: 16px; font-weight: 700; }
    .brand-sub  { font-size: 11px; color: var(--text3); margin-top: 1px; letter-spacing: 0.4px; text-transform: uppercase; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 9px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: #94a3b8; font-size: 13px; text-decoration: none;
      transition: background .15s, color .15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    /* ── 페이지 타이틀 ── */
    .page-header {
      padding: 40px 40px 0;
      max-width: 960px; margin: 0 auto;
    }
    .page-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(181,101,29,0.1); border: 1px solid rgba(181,101,29,0.25);
      color: #b5651d; font-size: 11px; font-weight: 600;
      padding: 4px 12px; border-radius: 100px; margin-bottom: 16px;
    }
    .page-header h1 {
      font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text) 40%, var(--text3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .page-header p { font-size: 14px; color: var(--text3); }

    /* ── 필터 탭 ── */
    .filter-bar {
      padding: 28px 40px 0;
      max-width: 960px; margin: 0 auto;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .flt-btn {
      padding: 6px 16px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      color: #64748b; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .flt-btn.active, .flt-btn:hover {
      background: rgba(181,101,29,0.12); border-color: rgba(181,101,29,0.4); color: #b5651d;
    }

    /* ── 리포트 그리드 ── */
    .reports-grid {
      padding: 24px 40px 60px;
      max-width: 960px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── 리포트 카드 ── */
    .report-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px;
      cursor: pointer; text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 12px;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      position: relative; overflow: hidden;
    }
    .report-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 18px;
      background: linear-gradient(135deg, rgba(181,101,29,0.05), transparent);
      opacity: 0; transition: opacity .2s;
    }
    .report-card:hover {
      transform: translateY(-3px);
      border-color: rgba(181,101,29,0.4);
      box-shadow: 0 10px 35px rgba(181,101,29,0.1);
    }
    .report-card:hover::before { opacity: 1; }

    .report-type-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; padding: 3px 9px;
      border-radius: 100px; width: fit-content; letter-spacing: 0.5px;
    }
    .badge-weekly  { background: rgba(181,101,29,0.12); color: #b5651d; }
    .badge-monthly  { background: rgba(181,101,29,0.18); color: #8b4513; }
.badge-quarterly{ background: rgba(20,184,166,0.15); color: #2dd4bf; }

    .report-title {
      font-size: 15px; font-weight: 700; letter-spacing: -0.2px;
      line-height: 1.4;
    }
    .report-date {
      font-size: 12px; color: var(--text3);
      display: flex; align-items: center; gap: 5px;
    }

    .report-arrow {
      position: absolute; top: 22px; right: 20px;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .2s;
    }
    .report-card:hover .report-arrow {
      background: rgba(181,101,29,0.15);
      transform: translate(2px, -2px);
    }
    .report-arrow svg { width: 12px; height: 12px; stroke: #64748b; }
    .report-card:hover .report-arrow svg { stroke: #b5651d; }

    /* ── 빈 상태 ── */
    .empty-state {
      padding: 80px 40px;
      text-align: center; color: var(--text4);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--text3); }
    .empty-state p  { font-size: 13px; line-height: 1.7; }

    /* ── 로딩 ── */
    .loading { text-align: center; padding: 60px; color: var(--text4); font-size: 14px; }
    .spinner {
      width: 28px; height: 28px; border: 2px solid var(--border);
      border-top-color: #b5651d; border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 모바일 ── */
    @media (max-width: 600px) {
      header { padding: 20px; }
      .page-header, .filter-bar { padding-left: 20px; padding-right: 20px; }
      .reports-grid { padding: 20px 20px 48px; grid-template-columns: 1fr; }
      .page-header h1 { font-size: 22px; }
    }
  
  
  /* ══ 베이지 테마 공통 변수 ══ */
  :root, html.day {
    --bg:      #f7f3ee;
    --surface: #fffdf9;
    --border:  #e8e0d4;
    --border2: #d4c9b8;
    --text:    #2c2416;
    --text2:   #5c4e3a;
    --text3:   #8a7a65;
    --text4:   #a89880;
  }
  html.night {
    --bg:      #1e1a14;
    --surface: #2a2318;
    --border:  #3d3326;
    --border2: #5a4d38;
    --text:    #f0e8d8;
    --text2:   #c8b89a;
    --text3:   #8a7a65;
    --text4:   #6b5c48;
  }
  .theme-toggle {
    position: fixed; bottom: 20px; left: 20px;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--border2);
    background: var(--surface); color: var(--text3);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; z-index: 999;
    box-shadow: 0 2px 12px rgba(44,36,22,.1);
    transition: transform .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-toggle:active { transform: scale(.9); }
  .theme-toggle:hover  { opacity: .85; }

  
  /* ── 공통 메모 패널 ── */
  #memoFab {
    position: fixed; bottom: 24px; right: 24px; z-index: 900;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #eab308, #f59e0b);
    border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(234,179,8,.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; transition: transform .2s, box-shadow .2s;
  }
  #memoFab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(234,179,8,.55); }
  #memoFab .fab-badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; border-radius: 9px;
    background: #ef4444; color: #fff; font-size: 10px; font-weight: 700;
    display: none; align-items: center; justify-content: center; padding: 0 4px;
  }
  #memoFab .fab-badge.show { display: flex; }

  #memoPanel {
    position: fixed; bottom: 88px; right: 24px; z-index: 901;
    width: 340px; max-height: 520px;
    background: var(--surface); border: 1px solid #2d3748;
    border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
    transform: scale(.9) translateY(16px); opacity: 0;
    pointer-events: none; transition: transform .22s ease, opacity .22s ease;
    transform-origin: bottom right;
  }
  #memoPanel.open {
    transform: scale(1) translateY(0); opacity: 1; pointer-events: all;
  }
  .mp-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .mp-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .mp-title small { font-size: 10px; color: var(--text3); font-weight: 400; }
  .mp-close {
    width: 26px; height: 26px; border-radius: 8px;
    background: #2d3748; border: none; color: #94a3b8;
    cursor: pointer; font-size: 14px; display: flex;
    align-items: center; justify-content: center; transition: background .15s;
  }
  .mp-close:hover { background: #374151; color: var(--text); }
  .mp-input-area {
    padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .mp-textarea {
    width: 100%; background: var(--bg); border: 1px solid #2d3748;
    border-radius: 10px; color: var(--text); font-size: 13px;
    font-family: inherit; resize: none; outline: none;
    padding: 10px 12px; line-height: 1.6; min-height: 72px;
    transition: border-color .15s;
  }
  .mp-textarea:focus { border-color: rgba(234,179,8,.5); }
  .mp-textarea::placeholder { color: var(--text4); }
  .mp-input-footer {
    display: flex; align-items: center; justify-content: flex-end;
    margin-top: 8px; gap: 8px;
  }
  .mp-hint { font-size: 11px; color: var(--text4); flex: 1; }
  .mp-save-btn {
    padding: 6px 16px; border-radius: 8px;
    background: linear-gradient(135deg, #eab308, #f59e0b);
    border: none; color: #0f1117; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: opacity .15s;
  }
  .mp-save-btn:hover { opacity: .85; }
  .mp-save-btn:disabled { opacity: .4; cursor: not-allowed; }
  .mp-list {
    overflow-y: auto; flex: 1; padding: 10px 12px;
  }
  .mp-list::-webkit-scrollbar { width: 4px; }
  .mp-list::-webkit-scrollbar-track { background: transparent; }
  .mp-list::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
  .mp-empty {
    text-align: center; padding: 28px 0; color: var(--text4); font-size: 13px;
  }
  .mp-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    position: relative;
  }
  .mp-card-text {
    font-size: 13px; color: #cbd5e1; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
    margin-right: 20px;
  }
  .mp-card-date { font-size: 11px; color: var(--text4); margin-top: 5px; }
  .mp-del-btn {
    position: absolute; top: 8px; right: 8px;
    width: 20px; height: 20px; border-radius: 5px;
    background: transparent; border: none; color: var(--text3);
    cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .mp-del-btn:hover { background: rgba(239,68,68,.15); color: #f87171; }
  .mp-toast {
    position: fixed; bottom: 88px; right: 82px; z-index: 902;
    background: #1e293b; border: 1px solid #2d3748;
    color: #94a3b8; font-size: 12px; font-weight: 600;
    padding: 7px 14px; border-radius: 9px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .mp-toast.show { opacity: 1; }
  @media (max-width: 480px) {
    #memoPanel { width: calc(100vw - 32px); right: 16px; bottom: 82px; }
    #memoFab { bottom: 20px; right: 16px; }
  }

  </style>
<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function init() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-icon">🍡</div>
      <div>
        <div class="brand-name">백년화편</div>
        <div class="brand-sub">Management System</div>
      </div>
    </div>
    <a href="/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      메인으로
    </a>
  </header>

  <div class="page-header">
    <div class="page-badge">📊 Insights</div>
    <h1>인사이트 리포트</h1>
    <p>주간·월간 브랜드 분석 리포트를 한곳에서 확인하세요.</p>
  </div>

  <div class="filter-bar">
    <button class="flt-btn active" onclick="filterReports('all', this)">전체</button>
    <button class="flt-btn" onclick="filterReports('weekly', this)">주간</button>
    <button class="flt-btn" onclick="filterReports('monthly', this)">월간</button>
    <button class="flt-btn" onclick="filterReports('quarterly', this)">분기별</button>
  </div>

  <div class="reports-grid" id="reportsGrid">
    <div class="loading">
      <div class="spinner"></div>
      리포트 불러오는 중…
    </div>
  </div>

  <script>
    let allReports = [];
    let currentFilter = 'all';

    async function loadReports() {
      try {
        const res = await fetch('/api/reports');
        const data = await res.json();
        allReports = data.reports || [];
        render();
      } catch(e) {
        document.getElementById('reportsGrid').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><h3>불러오기 실패</h3><p>서버와 연결할 수 없어요.</p></div>';
      }
    }

    function filterReports(type, el) {
      currentFilter = type;
      document.querySelectorAll('.flt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function guessType(filename) {
      const f = filename.toLowerCase();
      if (f.includes('quarterly') || f.includes('분기')) return 'quarterly';
      if (f.includes('monthly') || f.includes('월간')) return 'monthly';
      return 'weekly';
    }

    function formatDate(mtime) {
      const d = new Date(mtime * 1000);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function makeTitleFromFilename(filename) {
      const base = filename.replace('.html', '');
      // 2026-W19_weekly  → 2026년 19주차 주간 리포트
      const weekly = base.match(/^(\d{4})-W(\d{1,2})/);
      if (weekly) return `${weekly[1]}년 ${weekly[2]}주차 주간 리포트`;
      // 2026-05_monthly  → 2026년 5월 월간 리포트
      const monthly = base.match(/^(\d{4})-(\d{2})/);
      if (monthly) return `${monthly[1]}년 ${parseInt(monthly[2])}월 월간 리포트`;
      // 2026-Q2_quarterly → 2026년 2분기 리포트
      const quarterly = base.match(/^(\d{4})-Q(\d)/);
      if (quarterly) return `${quarterly[1]}년 ${quarterly[2]}분기 리포트`;
      // fallback
      return base.replace(/_/g, ' ');
    }

    function render() {
      const grid = document.getElementById('reportsGrid');
      const filtered = currentFilter === 'all'
        ? allReports
        : allReports.filter(r => guessType(r.filename) === currentFilter);

      if (!filtered.length) {
        const msg = allReports.length === 0
          ? '<div class="empty-state"><div class="icon">📭</div><h3>아직 리포트가 없어요</h3><p>주간 리포트 대화에서 리포트를 생성하고<br>GitHub에 업로드하면 여기 자동으로 나타나요.</p></div>'
          : '<div class="empty-state"><div class="icon">🔍</div><h3>해당 유형의 리포트가 없어요</h3><p>다른 필터를 선택해 보세요.</p></div>';
        grid.innerHTML = msg;
        return;
      }

      grid.innerHTML = filtered.map(r => {
        const type = guessType(r.filename);
        const badgeCls = type === 'quarterly' ? 'badge-quarterly' : type === 'monthly' ? 'badge-monthly' : 'badge-weekly';
        const badgeLabel = type === 'quarterly' ? '📈 분기' : type === 'monthly' ? '📅 월간' : '📆 주간';
        const title = makeTitleFromFilename(r.filename);
        const date = formatDate(r.modified);
        return `
          <a class="report-card" href="${r.url}" target="_blank">
            <div class="report-type-badge ${badgeCls}">${badgeLabel}</div>
            <div class="report-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17L17 7M17 7H7M17 7v10"/>
              </svg>
            </div>
            <div class="report-title">${title}</div>
            <div class="report-date">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              ${date} 업로드
            </div>
          </a>`;
      }).join('');
    }

    loadReports();
  </script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>

// ── 공통 메모 패널 JS ──
(function() {
  var _memos = [];
  var _open = false;

  function mpToggle() {
    _open = !_open;
    document.getElementById('memoPanel').classList.toggle('open', _open);
    if (_open) { mpLoad(); document.getElementById('mpInput').focus(); }
  }
  window.mpToggle = mpToggle;

  function mpToast(msg) {
    var t = document.getElementById('mpToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function mpFmt(id) {
    var d = new Date(id);
    if (isNaN(d)) return id;
    return d.getFullYear() + '.' +
      String(d.getMonth()+1).padStart(2,'0') + '.' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function mpRender() {
    var list = document.getElementById('mpList');
    var badge = document.getElementById('mpBadge');
    if (!_memos.length) {
      list.innerHTML = '<div class="mp-empty">아직 메모가 없어요</div>';
      badge.classList.remove('show');
      return;
    }
    badge.textContent = _memos.length > 99 ? '99+' : _memos.length;
    badge.classList.add('show');
    list.innerHTML = [..._memos].reverse().map(function(m) {
      return '<div class="mp-card">' +
        '<div class="mp-card-text">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
        '<div class="mp-card-date">' + mpFmt(m.id) + '</div>' +
        '<button class="mp-del-btn" onclick="mpDel('' + m.id + '')" title="삭제">×</button>' +
      '</div>';
    }).join('');
  }

  async function mpLoad() {
    try {
      var r = await fetch('/api/memo');
      var d = await r.json();
      _memos = d.memos || [];
      mpRender();
    } catch(e) {
      document.getElementById('mpList').innerHTML = '<div class="mp-empty">⚠️ 불러오기 실패</div>';
    }
  }

  async function mpSave() {
    var inp = document.getElementById('mpInput');
    var content = inp.value.trim();
    if (!content) return;
    var btn = document.getElementById('mpSaveBtn');
    btn.disabled = true;
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content})
      });
      inp.value = '';
      await mpLoad();
      mpToast('저장됐어요 ✓');
    } catch(e) { mpToast('저장 실패'); }
    finally { btn.disabled = false; }
  }
  window.mpSave = mpSave;

  async function mpDel(id) {
    if (!confirm('삭제할까요?')) return;
    try {
      await fetch('/api/memo/' + id, {method: 'DELETE'});
      await mpLoad();
      mpToast('삭제됐어요');
    } catch(e) { mpToast('삭제 실패'); }
  }
  window.mpDel = mpDel;

  // Ctrl+Enter 저장
  document.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('mpInput')) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault(); mpSave();
      }
    }
  });

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('memoPanel');
    var fab = document.getElementById('memoFab');
    if (_open && !panel.contains(e.target) && !fab.contains(e.target)) {
      _open = false; panel.classList.remove('open');
    }
  });

  // 초기 로드 (뱃지 표시용)
  mpLoad();
})();

</script>
</body>
</html>
