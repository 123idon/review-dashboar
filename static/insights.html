<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>인사이트 리포트 — 백년화편</title>
<style>
[data-theme="day"],:root{
  --bg:#F9FAFB;--bg2:#F2F4F6;--surface:#fff;--surface2:#F2F4F6;
  --border:#E5E8EB;--border2:#CDD1D8;
  --text:#191F28;--text2:#333D4B;--text3:#6B7684;--text4:#B0B8C1;
  --brand:#F5820D;--brand-bg:#FFF4E6;--brand-dark:#D96E00;--brand-rgb:245,130,13;
  --blue:#3182F6;--blue-bg:#EBF3FE;
  --red:#F04452;--red-bg:#FFF0F0;
  --green:#00A86B;--green-bg:#E8FAF4;
  --purple:#6C47FF;--purple-bg:#F3F0FF;
  --teal:#00BCD4;--teal-bg:#E6F9FC;
  --amber:#F59E0B;--amber-bg:#FFFAEB;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);--sh-sm:0 2px 8px rgba(0,0,0,.07);
  --sh-md:0 4px 16px rgba(0,0,0,.09);
  --sh-brand:0 4px 14px rgba(245,130,13,.28);
}
[data-theme="night"]{
  --bg:#0E1117;--bg2:#161C27;--surface:#1A2130;--surface2:#212B3D;
  --border:#2A3547;--border2:#3A4A60;
  --text:#F2F4F6;--text2:#C8D0DA;--text3:#7A8899;--text4:#3F5068;
  --brand:#FF9A30;--brand-bg:rgba(255,154,48,.14);--brand-dark:#FFB558;--brand-rgb:255,154,48;
  --blue:#4D9BFF;--blue-bg:rgba(77,155,255,.14);
  --red:#FF6B75;--red-bg:rgba(255,107,117,.14);
  --green:#1FC791;--green-bg:rgba(31,199,145,.14);
  --purple:#8B6FFF;--purple-bg:rgba(139,111,255,.14);
  --teal:#22D3EE;--teal-bg:rgba(34,211,238,.14);
  --amber:#FBB928;--amber-bg:rgba(251,185,40,.14);
  --sh-xs:0 1px 2px rgba(0,0,0,.3);--sh-sm:0 2px 8px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.app-header{position:sticky;top:0;z-index:100;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;box-shadow:var(--sh-xs)}
.back-link{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;color:var(--text3);text-decoration:none;transition:all 150ms ease;flex-shrink:0}
.back-link:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-bg)}
.back-link svg{width:14px;height:14px;stroke:currentColor}
.page-name{font-size:15px;font-weight:800;letter-spacing:-.4px}

.page-wrap{max-width:800px;margin:0 auto;padding:28px 20px 80px}

.section-label{font-size:11px;font-weight:700;color:var(--text4);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px}

/* 필터 버튼 */
.filter-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.flt-btn{height:30px;padding:0 15px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all 150ms ease}
.flt-btn:hover{border-color:var(--purple);color:var(--purple)}
.flt-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 2px 10px rgba(108,71,255,.25)}

/* 리포트 카드 그리드 */
.reports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.report-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:20px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;transition:transform 220ms cubic-bezier(.34,1.56,.64,1),box-shadow 180ms ease,border-color 180ms ease;animation:fadeUp 280ms cubic-bezier(.16,1,.3,1) both}
.report-card:hover{transform:translateY(-4px);box-shadow:var(--sh-md);border-color:var(--purple)}
.report-card:hover .rc-arrow{background:var(--purple-bg)}
.rc-top{display:flex;align-items:flex-start;justify-content:space-between}
.rc-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;letter-spacing:.3px}
.badge-weekly   {background:var(--blue-bg);  color:var(--blue)}
.badge-monthly  {background:var(--purple-bg);color:var(--purple)}
.badge-quarterly{background:var(--green-bg); color:var(--green)}
.rc-arrow{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:background 150ms ease;flex-shrink:0}
.rc-arrow svg{width:11px;height:11px;stroke:var(--text3)}
.rc-title{font-size:14px;font-weight:800;letter-spacing:-.3px;color:var(--text);line-height:1.4;flex:1}
.rc-date{font-size:11px;color:var(--text4);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;margin-top:2px}
.rc-date svg{width:11px;height:11px;stroke:currentColor;flex-shrink:0}

/* 빈 상태 */
.empty-state{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-state .icon{font-size:32px;margin-bottom:14px}
.empty-state p{font-size:13px;line-height:1.7}

/* 로딩 */
.loading{display:flex;align-items:center;gap:10px;padding:32px 0;color:var(--text3);font-size:13px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}

/* 메모 FAB */
#memoFab{position:fixed;bottom:22px;right:22px;z-index:900;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#FF5E1A);color:#fff;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand);transition:transform 260ms cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent}
#memoFab:hover{transform:scale(1.1) rotate(-6deg)}
.mp-badge{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:50px;border:2.5px solid var(--surface);display:none;align-items:center;justify-content:center}
.mp-badge.show{display:flex}
#memoPanel{position:fixed;bottom:84px;right:22px;z-index:901;width:320px;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;box-shadow:0 20px 56px rgba(0,0,0,.13);overflow:hidden;transform:scale(.88) translateY(14px);transform-origin:bottom right;opacity:0;pointer-events:none;transition:transform 280ms cubic-bezier(.34,1.56,.64,1),opacity 200ms ease}
#memoPanel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}
.mp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700}
.mp-close-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface2);color:var(--text3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.mp-close-btn:hover{background:var(--border);color:var(--text)}
.mp-body{padding:14px 18px}
.mp-input-row{display:flex;gap:8px;margin-bottom:12px}
.mp-input{flex:1;padding:10px 12px;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:13px;line-height:1.6;resize:none;outline:none;transition:border-color 150ms ease}
.mp-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.mp-save-btn{height:36px;padding:0 14px;align-self:flex-end;border-radius:50px;border:none;background:var(--brand);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all 150ms ease}
.mp-save-btn:hover{background:var(--brand-dark)}
.mp-list{max-height:260px;overflow-y:auto;scrollbar-width:thin}
.mp-card{padding:10px 0;border-bottom:1px solid var(--border);position:relative}
.mp-card:last-child{border-bottom:none}
.mp-card-text{font-size:12px;color:var(--text2);line-height:1.6;padding-right:28px}
.mp-card-date{font-size:10px;color:var(--text4);margin-top:4px;font-variant-numeric:tabular-nums}
.mp-del-btn{position:absolute;top:10px;right:0;width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text4);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.mp-del-btn:hover{background:var(--red-bg);color:var(--red)}
.mp-empty{font-size:12px;color:var(--text4);text-align:center;padding:20px 0}
.mp-toast{position:fixed;bottom:88px;right:80px;z-index:902;background:var(--text);color:var(--bg);font-size:12px;font-weight:700;padding:8px 16px;border-radius:50px;opacity:0;transform:translateY(8px);pointer-events:none;transition:all 200ms ease}
.mp-toast.show{opacity:1;transform:translateY(0)}
.theme-toggle{position:fixed;bottom:22px;left:20px;z-index:999;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);transition:transform 220ms cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent}
.theme-toggle:hover{transform:scale(1.1)}

@media(max-width:600px){.page-wrap{padding:20px 14px 80px}.reports-grid{grid-template-columns:1fr 1fr}}
@media(max-width:400px){.reports-grid{grid-template-columns:1fr}#memoPanel{width:calc(100vw - 28px);right:14px;bottom:78px}}
</style>
<script>

(function(){
  var DS=6,DE=20;
  function auto(){var h=new Date().getHours();return(h>=DS&&h<DE)?'day':'night';}
  function apply(m,save){document.documentElement.setAttribute('data-theme',m);var b=document.getElementById('themeToggle');if(b)b.textContent=m==='night'?'☀️':'🌙';if(save){try{localStorage.setItem('bnh_theme',m);}catch(e){}}}
  window.__toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme')||'day';apply(c==='day'?'night':'day',true);};
  setInterval(function(){try{if(!localStorage.getItem('bnh_theme'))apply(auto(),false);}catch(e){}},60000);
  (function(){var m=null;try{m=localStorage.getItem('bnh_theme');}catch(e){}apply(m||auto(),false);})();
})();

</script>
</head>
<body>

<header class="app-header">
  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    메인
  </a>
  <div class="page-name">인사이트 리포트</div>
</header>

<div class="page-wrap">

  <div class="filter-bar">
    <button class="flt-btn active" onclick="filterReports('all',this)">전체</button>
    <button class="flt-btn" onclick="filterReports('weekly',this)">주간</button>
    <button class="flt-btn" onclick="filterReports('monthly',this)">월간</button>
    <button class="flt-btn" onclick="filterReports('quarterly',this)">분기별</button>
  </div>

  <div class="reports-grid" id="reportsGrid">
    <div class="loading"><div class="spinner"></div> 불러오는 중…</div>
  </div>

</div>

<button id="memoFab" onclick="mpToggle()" title="빠른 메모" aria-label="메모 열기">📝<span id="mpBadge" class="mp-badge"></span></button>
<div id="memoPanel">
  <div class="mp-header"><span>📝 메모</span><button class="mp-close-btn" onclick="mpToggle()">✕</button></div>
  <div class="mp-body">
    <div class="mp-input-row"><textarea id="mpInput" class="mp-input" placeholder="Ctrl+Enter로 저장" rows="3"></textarea><button id="mpSaveBtn" class="mp-save-btn" onclick="mpSave()">저장</button></div>
    <div id="mpList" class="mp-list"></div>
  </div>
</div>
<div id="mpToast" class="mp-toast"></div>
<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>
let allReports = [];
let currentFilter = 'all';

function guessType(f) {
  f = f.toLowerCase();
  if (f.includes('quarterly')||f.includes('분기')) return 'quarterly';
  if (f.includes('monthly')||f.includes('월간')) return 'monthly';
  return 'weekly';
}
function typeIcon(t){ return t==='quarterly'?'📈':t==='monthly'?'📅':'📆'; }
function typeName(t){ return t==='quarterly'?'분기':t==='monthly'?'월간':'주간'; }
function formatDate(mt){
  const d=new Date(mt*1000);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function makeTitleFromFilename(filename) {
  const base = filename.replace('.html','');
  const w = base.match(/^(\d{4})-W(\d{1,2})/);
  if (w) return `${w[1]}년 ${w[2]}주차 주간 리포트`;
  const m = base.match(/^(\d{4})-(\d{2})/);
  if (m) return `${m[1]}년 ${parseInt(m[2])}월 월간 리포트`;
  const q = base.match(/^(\d{4})-Q(\d)/);
  if (q) return `${q[1]}년 ${q[2]}분기 리포트`;
  return base.replace(/_/g,' ');
}

function filterReports(type, el) {
  currentFilter = type;
  document.querySelectorAll('.flt-btn').forEach(b=>b.classList.remove('active'));
  if (el) el.classList.add('active');
  render();
}

function render() {
  const grid = document.getElementById('reportsGrid');
  const filtered = currentFilter==='all' ? allReports
    : allReports.filter(r=>guessType(r.filename)===currentFilter);

  if (!filtered.length) {
    const msg = allReports.length===0
      ? '<div class="empty-state"><div class="icon">📭</div><p>아직 리포트가 없어요.<br>주간 리포트 대화에서 생성 후 GitHub에 업로드하면 자동으로 나타납니다.</p></div>'
      : '<div class="empty-state"><div class="icon">🔍</div><p>해당 유형의 리포트가 없어요.</p></div>';
    grid.innerHTML = msg;
    return;
  }

  grid.innerHTML = filtered.map((r,i) => {
    const t = guessType(r.filename);
    return `<a class="report-card" href="${r.url}" target="_blank" style="animation-delay:${i*0.04}s">
      <div class="rc-top">
        <span class="rc-badge badge-${t}">${typeIcon(t)} ${typeName(t)}</span>
        <div class="rc-arrow"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg></div>
      </div>
      <div class="rc-title">${makeTitleFromFilename(r.filename)}</div>
      <div class="rc-date">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        ${formatDate(r.modified)} 업로드
      </div>
    </a>`;
  }).join('');
}

async function loadReports() {
  try {
    const res = await fetch('/api/reports');
    const data = await res.json();
    allReports = (data.reports||[]).sort((a,b)=>b.modified-a.modified);
    render();
  } catch(e) {
    document.getElementById('reportsGrid').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><p>서버와 연결할 수 없어요.</p></div>';
  }
}
loadReports();
</script>

<script>

// ── 메모 패널 ─────────────────────────────────────────
(function(){
  var _memos=[],_open=false;
  function mpToggle(){_open=!_open;var p=document.getElementById('memoPanel');if(p)p.classList.toggle('open',_open);if(_open){mpLoad();var i=document.getElementById('mpInput');if(i)setTimeout(()=>i.focus(),200);}}
  window.mpToggle=mpToggle;
  function mpToast(msg){var t=document.getElementById('mpToast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
  function mpFmt(id){var d=new Date(id);if(isNaN(d))return id;return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function mpRender(){var list=document.getElementById('mpList'),badge=document.getElementById('mpBadge');if(!list)return;if(!_memos.length){list.innerHTML='<div class="mp-empty">아직 메모가 없어요</div>';if(badge)badge.classList.remove('show');return;}if(badge){badge.textContent=_memos.length>99?'99+':_memos.length;badge.classList.add('show');}list.innerHTML=[..._memos].reverse().map(function(m){return'<div class="mp-card"><div class="mp-card-text">'+m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px"><span class="mp-card-date">'+mpFmt(m.id)+'</span><button class="mp-del-btn" onclick="mpDel(\''+m.id+'\')">✕</button></div></div>';}).join('');}
  async function mpLoad(){try{var r=await fetch('/api/memo'),d=await r.json();_memos=d.memos||[];mpRender();}catch(e){var l=document.getElementById('mpList');if(l)l.innerHTML='<div class="mp-empty">불러오기 실패</div>';}}
  async function mpSave(){var inp=document.getElementById('mpInput'),btn=document.getElementById('mpSaveBtn');if(!inp||!inp.value.trim())return;var content=inp.value.trim();if(btn)btn.disabled=true;try{await fetch('/api/memo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content})});inp.value='';await mpLoad();mpToast('저장됐어요 ✓');}catch(e){mpToast('저장 실패');}finally{if(btn)btn.disabled=false;}}
  window.mpSave=mpSave;
  async function mpDel(id){if(!confirm('삭제할까요?'))return;try{await fetch('/api/memo/'+id,{method:'DELETE'});await mpLoad();mpToast('삭제됐어요');}catch(e){mpToast('삭제 실패');}}
  window.mpDel=mpDel;
  document.addEventListener('keydown',function(e){var inp=document.getElementById('mpInput');if(document.activeElement===inp&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();mpSave();}});
  document.addEventListener('click',function(e){var p=document.getElementById('memoPanel'),f=document.getElementById('memoFab');if(_open&&p&&f&&!p.contains(e.target)&&!f.contains(e.target)){_open=false;p.classList.remove('open');}});
  mpLoad();
})();

</script>
</body>
</html>
