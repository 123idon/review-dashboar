<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>인사이트 리포트 — 백년화편</title>
<style>
[data-theme="day"],:root{
  --bg:#F9FAFB;--bg2:#F2F4F6;--surface:#fff;--surface2:#F2F4F6;
  --border:#E5E8EB;--border2:#CDD1D8;
  --text:#191F28;--text2:#333D4B;--text3:#6B7684;--text4:#B0B8C1;
  --brand:#F5820D;--brand-bg:#FFF4E6;--brand-dark:#D96E00;--brand-rgb:245,130,13;
  --blue:#3182F6;--blue-bg:#EBF3FE;--blue-rgb:49,130,246;
  --red:#F04452;--red-bg:#FFF0F0;
  --green:#00A86B;--green-bg:#E8FAF4;
  --purple:#6C47FF;--purple-bg:#F3F0FF;
  --teal:#00BCD4;--teal-bg:#E6F9FC;
  --amber:#F59E0B;--amber-bg:#FFFAEB;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);--sh-sm:0 2px 8px rgba(0,0,0,.07);
  --sh-md:0 4px 16px rgba(0,0,0,.09);--sh-lg:0 8px 32px rgba(0,0,0,.11);
  --sh-xl:0 20px 56px rgba(0,0,0,.13);
  --sh-brand:0 4px 14px rgba(245,130,13,.28);
}
[data-theme="night"]{
  --bg:#0E1117;--bg2:#161C27;--surface:#1A2130;--surface2:#212B3D;
  --border:#2A3547;--border2:#3A4A60;
  --text:#F2F4F6;--text2:#C8D0DA;--text3:#7A8899;--text4:#3F5068;
  --brand:#FF9A30;--brand-bg:rgba(255,154,48,.14);--brand-dark:#FFB558;--brand-rgb:255,154,48;
  --blue:#4D9BFF;--blue-bg:rgba(77,155,255,.14);
  --red:#FF6B75;--red-bg:rgba(255,107,117,.14);
  --green:#1FC791;--green-bg:rgba(31,199,145,.14);
  --purple:#8B6FFF;--purple-bg:rgba(139,111,255,.14);
  --teal:#22D3EE;--teal-bg:rgba(34,211,238,.14);
  --amber:#FBB928;--amber-bg:rgba(251,185,40,.14);
  --sh-xs:0 1px 2px rgba(0,0,0,.3);--sh-sm:0 2px 8px rgba(0,0,0,.4);
  --sh-md:0 4px 16px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 헤더 */
.app-header{position:sticky;top:0;z-index:100;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;box-shadow:var(--sh-xs)}
.back-link{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;color:var(--text3);text-decoration:none;transition:all 150ms ease;flex-shrink:0}
.back-link:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-bg)}
.back-link svg{width:14px;height:14px;stroke:currentColor}
.page-name{font-size:15px;font-weight:800;letter-spacing:-.4px}

/* 레이아웃 */
.page-wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}

/* 섹션 라벨 */
.section-label{font-size:11px;font-weight:700;color:var(--text4);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px}

/* 달력 네비 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-year{font-size:14px;font-weight:800;letter-spacing:-.4px}
.cal-nav-btns{display:flex;gap:6px}
.cal-nav-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;color:var(--text3);font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.cal-nav-btn:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}

/* 달력 래퍼 */
.year-cal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
@media(max-width:640px){.year-cal{grid-template-columns:1fr 1fr}}
@media(max-width:400px){.year-cal{grid-template-columns:1fr}}

/* 월 카드 */
.month-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:box-shadow .2s}
.month-card:hover{box-shadow:var(--sh-sm)}
.month-head{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text2);background:var(--surface2)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.m-dow{padding:4px 0;text-align:center;font-size:9px;font-weight:700;color:var(--text4)}
.m-dow:first-child{color:var(--red)}.m-dow:last-child{color:var(--blue)}
.m-cell{padding:4px 3px;min-height:28px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;transition:background 120ms ease}
.m-cell:nth-child(7n){border-right:none}
.m-cell.other{opacity:.3}
.m-cell.today{background:var(--brand-bg)}
.m-cell.has-report{cursor:pointer}
.m-cell.has-report:hover{background:var(--purple-bg)}
.m-day{font-size:9px;font-weight:600;color:var(--text3);line-height:14px;text-align:center}
.m-cell.today .m-day{background:var(--brand);color:#fff;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-weight:800}
.m-cell:nth-child(7n+1) .m-day{color:var(--red)}
.m-cell:nth-child(7n) .m-day{color:var(--blue)}
/* 리포트 도트 */
.rep-dots{display:flex;justify-content:center;gap:2px;margin-top:1px;flex-wrap:wrap}
.rep-dot{width:5px;height:5px;border-radius:50%;cursor:pointer;flex-shrink:0;transition:transform 120ms ease}
.rep-dot:hover{transform:scale(1.4)}
.rd-weekly   {background:var(--blue)}
.rd-monthly  {background:var(--purple)}
.rd-quarterly{background:var(--green)}

/* 팝업 */
.rep-popup{
  position:fixed;z-index:500;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;box-shadow:var(--sh-xl);
  padding:14px 16px;min-width:200px;max-width:260px;
  animation:fadeUp 180ms ease both;
}
.rep-popup-title{font-size:12px;font-weight:700;color:var(--text4);margin-bottom:8px;letter-spacing:.5px}
.rep-popup-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;transition:background 120ms ease;border-radius:6px;padding:8px 8px}
.rep-popup-item:last-child{border-bottom:none}
.rep-popup-item:hover{background:var(--purple-bg)}
.rp-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rp-weekly   .rp-icon{background:var(--blue-bg)}
.rp-monthly  .rp-icon{background:var(--purple-bg)}
.rp-quarterly.rp-icon{background:var(--green-bg)}
.rp-info{flex:1;min-width:0}
.rp-name{font-size:12px;font-weight:700;letter-spacing:-.2px}
.rp-date{font-size:10px;color:var(--text4);margin-top:1px;font-variant-numeric:tabular-nums}
.rp-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:50px}
.badge-weekly   {background:var(--blue-bg);  color:var(--blue)}
.badge-monthly  {background:var(--purple-bg);color:var(--purple)}
.badge-quarterly{background:var(--green-bg); color:var(--green)}
.popup-close{position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text4);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 120ms ease}
.popup-close:hover{background:var(--border);color:var(--text)}

/* 최근 리포트 목록 */
.report-rows{display:flex;flex-direction:column;gap:8px}
.report-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;text-decoration:none;color:inherit;transition:all 150ms ease;animation:fadeUp 250ms ease both}
.report-row:hover{border-color:var(--purple);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.rr-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.rr-weekly   .rr-icon{background:var(--blue-bg)}
.rr-monthly  .rr-icon{background:var(--purple-bg)}
.rr-quarterly .rr-icon{background:var(--green-bg)}
.rr-info{flex:1;min-width:0}
.rr-title{font-size:13px;font-weight:700;letter-spacing:-.2px}
.rr-date{font-size:11px;color:var(--text4);margin-top:2px;font-variant-numeric:tabular-nums}
.rr-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:50px;flex-shrink:0}
.badge-weekly   {background:var(--blue-bg);  color:var(--blue)}
.badge-monthly  {background:var(--purple-bg);color:var(--purple)}
.badge-quarterly{background:var(--green-bg); color:var(--green)}
.rr-arrow{width:26px;height:26px;border-radius:50%;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.report-row:hover .rr-arrow{background:var(--purple-bg)}
.rr-arrow svg{width:12px;height:12px;stroke:var(--text3)}
.report-row:hover .rr-arrow svg{stroke:var(--purple)}

/* 빈 상태 */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-state .icon{font-size:32px;margin-bottom:12px}
.empty-state p{font-size:13px;line-height:1.7}

/* 로딩 */
.loading-row{display:flex;align-items:center;gap:10px;padding:20px 0;color:var(--text3);font-size:13px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}

/* 메모 */
#memoFab{position:fixed;bottom:22px;right:22px;z-index:900;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#FF5E1A);color:#fff;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand);transition:transform 260ms cubic-bezier(.34,1.56,.64,1),box-shadow 200ms ease;-webkit-tap-highlight-color:transparent}
#memoFab:hover{transform:scale(1.1) rotate(-6deg);box-shadow:0 8px 28px rgba(var(--brand-rgb),.45)}
.mp-badge{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:50px;border:2.5px solid var(--surface);display:none;align-items:center;justify-content:center}
.mp-badge.show{display:flex}
#memoPanel{position:fixed;bottom:84px;right:22px;z-index:901;width:320px;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;box-shadow:var(--sh-xl);overflow:hidden;transform:scale(.88) translateY(14px);transform-origin:bottom right;opacity:0;pointer-events:none;transition:transform 280ms cubic-bezier(.34,1.56,.64,1),opacity 200ms ease}
#memoPanel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}
.mp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700}
.mp-close-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface2);color:var(--text3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.mp-close-btn:hover{background:var(--border);color:var(--text)}
.mp-body{padding:14px 18px}
.mp-input-row{display:flex;gap:8px;margin-bottom:12px}
.mp-input{flex:1;padding:10px 12px;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:13px;line-height:1.6;resize:none;outline:none;transition:border-color 150ms ease,box-shadow 150ms ease}
.mp-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.mp-save-btn{height:36px;padding:0 14px;align-self:flex-end;border-radius:50px;border:none;background:var(--brand);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all 150ms ease}
.mp-save-btn:hover{background:var(--brand-dark)}
.mp-list{max-height:260px;overflow-y:auto;scrollbar-width:thin}
.mp-card{padding:10px 0;border-bottom:1px solid var(--border);position:relative}
.mp-card:last-child{border-bottom:none}
.mp-card-text{font-size:12px;color:var(--text2);line-height:1.6;padding-right:28px}
.mp-card-date{font-size:10px;color:var(--text4);margin-top:4px;font-variant-numeric:tabular-nums}
.mp-del-btn{position:absolute;top:10px;right:0;width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text4);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.mp-del-btn:hover{background:var(--red-bg);color:var(--red)}
.mp-empty{font-size:12px;color:var(--text4);text-align:center;padding:20px 0}
.mp-toast{position:fixed;bottom:88px;right:80px;z-index:902;background:var(--text);color:var(--bg);font-size:12px;font-weight:700;padding:8px 16px;border-radius:50px;opacity:0;transform:translateY(8px);pointer-events:none;transition:all 200ms ease}
.mp-toast.show{opacity:1;transform:translateY(0)}
.theme-toggle{position:fixed;bottom:22px;left:20px;z-index:999;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);transition:transform 220ms cubic-bezier(.34,1.56,.64,1),box-shadow 150ms ease;-webkit-tap-highlight-color:transparent}
.theme-toggle:hover{transform:scale(1.1);box-shadow:var(--sh-md)}
@media(max-width:480px){#memoPanel{width:calc(100vw - 28px);right:14px;bottom:78px}}
</style>
<script>
(function(){
  var DS=6,DE=20;
  function auto(){var h=new Date().getHours();return(h>=DS&&h<DE)?'day':'night';}
  function apply(m,save){document.documentElement.setAttribute('data-theme',m);var b=document.getElementById('themeToggle');if(b)b.textContent=m==='night'?'☀️':'🌙';if(save){try{localStorage.setItem('bnh_theme',m);}catch(e){}}}
  window.__toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme')||'day';apply(c==='day'?'night':'day',true);};
  setInterval(function(){try{if(!localStorage.getItem('bnh_theme'))apply(auto(),false);}catch(e){}},60000);
  (function(){var m=null;try{m=localStorage.getItem('bnh_theme');}catch(e){}apply(m||auto(),false);})();
})();
</script>
</head>
<body>

<header class="app-header">
  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    메인
  </a>
  <div class="page-name">인사이트 리포트</div>
</header>

<div class="page-wrap">

  <!-- 연도 달력 -->
  <div class="cal-nav">
    <div class="cal-nav-year" id="calNavYear">2026</div>
    <div class="cal-nav-btns">
      <button class="cal-nav-btn" onclick="moveYear(-1)" title="이전 연도">←</button>
      <button class="cal-nav-btn" onclick="moveYear(0)"  title="올해">●</button>
      <button class="cal-nav-btn" onclick="moveYear(1)"  title="다음 연도">→</button>
    </div>
  </div>

  <div class="year-cal" id="yearCal">
    <!-- JS로 채워짐 -->
  </div>

  <!-- 팝업 (클릭 시 표시) -->
  <div class="rep-popup" id="repPopup" style="display:none">
    <button class="popup-close" onclick="closePopup()">✕</button>
    <div class="rep-popup-title" id="popupTitle"></div>
    <div id="popupList"></div>
  </div>

  <!-- 최근 리포트 -->
  <div style="margin-bottom:10px">
    <div class="section-label">최근 리포트</div>
  </div>
  <div id="recentRows">
    <div class="loading-row"><div class="spinner"></div> 불러오는 중…</div>
  </div>

</div>

<button id="memoFab" onclick="mpToggle()" title="빠른 메모" aria-label="메모 열기">📝<span id="mpBadge" class="mp-badge"></span></button>
<div id="memoPanel">
  <div class="mp-header"><span>📝 메모</span><button class="mp-close-btn" onclick="mpToggle()">✕</button></div>
  <div class="mp-body">
    <div class="mp-input-row"><textarea id="mpInput" class="mp-input" placeholder="Ctrl+Enter로 저장" rows="3"></textarea><button id="mpSaveBtn" class="mp-save-btn" onclick="mpSave()">저장</button></div>
    <div id="mpList" class="mp-list"></div>
  </div>
</div>
<div id="mpToast" class="mp-toast"></div>
<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>

<script>
let allReports = [];
let calNavYearVal = new Date().getFullYear();
let activePopupCell = null;

const DOW = ['일','월','화','수','목','금','토'];
const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function guessType(filename) {
  const f = filename.toLowerCase();
  if (f.includes('quarterly')||f.includes('분기')) return 'quarterly';
  if (f.includes('monthly')||f.includes('월간')) return 'monthly';
  return 'weekly';
}
function typeIcon(t) {
  return t==='quarterly'?'📈':t==='monthly'?'📅':'📆';
}
function typeName(t) {
  return t==='quarterly'?'분기':t==='monthly'?'월간':'주간';
}
function formatDate(mtime) {
  const d = new Date(mtime*1000);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function makeTitleFromFilename(filename) {
  const base = filename.replace('.html','');
  const weekly = base.match(/^(\d{4})-W(\d{1,2})/);
  if (weekly) return `${weekly[1]}년 ${weekly[2]}주차 주간 리포트`;
  const monthly = base.match(/^(\d{4})-(\d{2})/);
  if (monthly) return `${monthly[1]}년 ${parseInt(monthly[2])}월 월간 리포트`;
  const quarterly = base.match(/^(\d{4})-Q(\d)/);
  if (quarterly) return `${quarterly[1]}년 ${quarterly[2]}분기 리포트`;
  return base.replace(/_/g,' ');
}

// 리포트 날짜 추출 (파일명에서)
function getReportDate(filename) {
  const base = filename.replace('.html','');
  const weekly = base.match(/^(\d{4})-W(\d{1,2})/);
  if (weekly) {
    const year = parseInt(weekly[1]);
    const week = parseInt(weekly[2]);
    const jan1 = new Date(year,0,1);
    const dayOfWeek = jan1.getDay()||7;
    const firstMon = new Date(jan1.getTime() + (8-dayOfWeek)*86400000);
    const d = new Date(firstMon.getTime() + (week-1)*7*86400000);
    return d.toISOString().slice(0,10);
  }
  const monthly = base.match(/^(\d{4})-(\d{2})_/);
  if (monthly) return `${monthly[1]}-${monthly[2]}-01`;
  const quarterly = base.match(/^(\d{4})-Q(\d)/);
  if (quarterly) {
    const mo = (parseInt(quarterly[2])-1)*3+1;
    return `${quarterly[1]}-${String(mo).padStart(2,'0')}-01`;
  }
  return null;
}

function buildRepDateMap(reports) {
  const map = {};
  reports.forEach(r => {
    const d = getReportDate(r.filename);
    if (!d) return;
    if (!map[d]) map[d] = [];
    map[d].push(r);
  });
  return map;
}

function renderYearCal() {
  const yearEl = document.getElementById('calNavYear');
  const cal    = document.getElementById('yearCal');
  yearEl.textContent = calNavYearVal+'년';

  const today = new Date();
  const repMap = buildRepDateMap(allReports);

  let html = '';
  for (let mo = 0; mo < 12; mo++) {
    const firstDay = new Date(calNavYearVal, mo, 1);
    const lastDay  = new Date(calNavYearVal, mo+1, 0);
    const startDow = firstDay.getDay();
    const totalCells = Math.ceil((startDow + lastDay.getDate())/7)*7;

    let cells = '';
    for (let i = 0; i < totalCells; i++) {
      const offset = i - startDow;
      const d = new Date(calNavYearVal, mo, 1+offset);
      const isOther = offset < 0 || (1+offset) > lastDay.getDate();
      const isToday = d.toDateString() === today.toDateString();
      const dateStr = d.toISOString().slice(0,10);
      const reps    = repMap[dateStr] || [];
      const hasRep  = !isOther && reps.length > 0;

      const dots = reps.map(r => {
        const t = guessType(r.filename);
        return `<div class="rep-dot rd-${t}" data-date="${dateStr}" title="${makeTitleFromFilename(r.filename)}"></div>`;
      }).join('');

      cells += `<div class="m-cell${isOther?' other':''}${isToday?' today':''}${hasRep?' has-report':''}" ${hasRep?`onclick="openPopup(event,'${dateStr}')"`:''}">
        <div class="m-day">${d.getDate()}</div>
        ${dots?`<div class="rep-dots">${dots}</div>`:''}
      </div>`;
    }

    html += `<div class="month-card">
      <div class="month-head">${MONTH_NAMES[mo]}</div>
      <div class="month-grid">
        ${DOW.map(d=>`<div class="m-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>`;
  }
  cal.innerHTML = html;
}

function openPopup(e, dateStr) {
  e.stopPropagation();
  const popup = document.getElementById('repPopup');
  const title = document.getElementById('popupTitle');
  const list  = document.getElementById('popupList');

  const repMap = buildRepDateMap(allReports);
  const reps   = repMap[dateStr] || [];
  if (!reps.length) return;

  const [y,m,d] = dateStr.split('-');
  title.textContent = `${parseInt(m)}월 ${parseInt(d)}일 리포트`;

  list.innerHTML = reps.map(r => {
    const t = guessType(r.filename);
    return `<a class="rep-popup-item rp-${t}" href="${r.url}" target="_blank">
      <div class="rp-icon">${typeIcon(t)}</div>
      <div class="rp-info">
        <div class="rp-name">${makeTitleFromFilename(r.filename)}</div>
        <div class="rp-date">${formatDate(r.modified)} 업로드</div>
      </div>
      <span class="rp-badge badge-${t}">${typeName(t)}</span>
    </a>`;
  }).join('');

  // 위치 계산
  const rect = e.currentTarget.getBoundingClientRect();
  const scrollY = window.scrollY || window.pageYOffset;
  popup.style.display = 'block';
  popup.style.top  = (rect.bottom + scrollY + 6) + 'px';
  popup.style.left = Math.min(rect.left, window.innerWidth - 280) + 'px';
  activePopupCell = e.currentTarget;
}

function closePopup() {
  document.getElementById('repPopup').style.display = 'none';
  activePopupCell = null;
}

document.addEventListener('click', function(e) {
  const popup = document.getElementById('repPopup');
  if (popup.style.display !== 'none' && !popup.contains(e.target)) closePopup();
});

window.moveYear = function(dir) {
  if (dir === 0) calNavYearVal = new Date().getFullYear();
  else calNavYearVal += dir;
  renderYearCal();
};

function renderRecentRows(reports) {
  const el = document.getElementById('recentRows');
  const recent = [...reports].sort((a,b)=>b.modified-a.modified).slice(0,6);
  if (!recent.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>아직 리포트가 없어요.<br>주간 리포트 대화에서 생성 후 GitHub에 업로드하면 자동으로 나타납니다.</p></div>';
    return;
  }
  el.innerHTML = recent.map((r,i) => {
    const t = guessType(r.filename);
    return `<a class="report-row rr-${t}" href="${r.url}" target="_blank" style="animation-delay:${i*0.05}s">
      <div class="rr-icon">${typeIcon(t)}</div>
      <div class="rr-info">
        <div class="rr-title">${makeTitleFromFilename(r.filename)}</div>
        <div class="rr-date">${formatDate(r.modified)} 업로드</div>
      </div>
      <span class="rr-badge badge-${t}">${typeName(t)}</span>
      <div class="rr-arrow"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg></div>
    </a>`;
  }).join('');
}

async function loadReports() {
  try {
    const res = await fetch('/api/reports');
    const data = await res.json();
    allReports = data.reports || [];
    renderYearCal();
    renderRecentRows(allReports);
  } catch(e) {
    document.getElementById('recentRows').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><p>서버와 연결할 수 없어요.</p></div>';
  }
}

loadReports();
</script>

<script>
// ── 메모 패널 ─────────────────────────────────────────
(function(){
  var _memos=[],_open=false;
  function mpToggle(){_open=!_open;var p=document.getElementById('memoPanel');if(p)p.classList.toggle('open',_open);if(_open){mpLoad();var i=document.getElementById('mpInput');if(i)setTimeout(()=>i.focus(),200);}}
  window.mpToggle=mpToggle;
  function mpToast(msg){var t=document.getElementById('mpToast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
  function mpFmt(id){var d=new Date(id);if(isNaN(d))return id;return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function mpRender(){var list=document.getElementById('mpList'),badge=document.getElementById('mpBadge');if(!list)return;if(!_memos.length){list.innerHTML='<div class="mp-empty">아직 메모가 없어요</div>';if(badge)badge.classList.remove('show');return;}if(badge){badge.textContent=_memos.length>99?'99+':_memos.length;badge.classList.add('show');}list.innerHTML=[..._memos].reverse().map(function(m){return'<div class="mp-card"><div class="mp-card-text">'+m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px"><span class="mp-card-date">'+mpFmt(m.id)+'</span><button class="mp-del-btn" onclick="mpDel(\''+m.id+'\')">✕</button></div></div>';}).join('');}
  async function mpLoad(){try{var r=await fetch('/api/memo'),d=await r.json();_memos=d.memos||[];mpRender();}catch(e){var l=document.getElementById('mpList');if(l)l.innerHTML='<div class="mp-empty">불러오기 실패</div>';}}
  async function mpSave(){var inp=document.getElementById('mpInput'),btn=document.getElementById('mpSaveBtn');if(!inp||!inp.value.trim())return;var content=inp.value.trim();if(btn)btn.disabled=true;try{await fetch('/api/memo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content})});inp.value='';await mpLoad();mpToast('저장됐어요 ✓');}catch(e){mpToast('저장 실패');}finally{if(btn)btn.disabled=false;}}
  window.mpSave=mpSave;
  async function mpDel(id){if(!confirm('삭제할까요?'))return;try{await fetch('/api/memo/'+id,{method:'DELETE'});await mpLoad();mpToast('삭제됐어요');}catch(e){mpToast('삭제 실패');}}
  window.mpDel=mpDel;
  document.addEventListener('keydown',function(e){var inp=document.getElementById('mpInput');if(document.activeElement===inp&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();mpSave();}});
  document.addEventListener('click',function(e){var p=document.getElementById('memoPanel'),f=document.getElementById('memoFab');if(_open&&p&&f&&!p.contains(e.target)&&!f.contains(e.target)){_open=false;p.classList.remove('open');}});
  mpLoad();
})();
</script>
