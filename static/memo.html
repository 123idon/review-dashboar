<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>메모장 — 백년화편</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   백년화편 디자인 시스템 v3 — 토스 스타일
   퍼스널 컬러: 앰버-오렌지 (#F5820D)
   ═══════════════════════════════════════════════════ */

[data-theme="day"] {
  --bg:            #F9FAFB;
  --surface:       #FFFFFF;
  --surface2:      #F2F4F6;
  --border:        #E5E8EB;
  --border2:       #CDD1D8;
  --text:          #191F28;
  --text2:         #333D4B;
  --text3:         #6B7684;
  --text4:         #B0B8C1;
  --brand:         #F5820D;
  --brand-dark:    #D96E00;
  --brand-bg:      #FFF4E6;
  --brand-rgb:     245,130,13;
  --blue:          #3182F6;
  --blue-bg:       #EBF3FE;
  --blue-rgb:      49,130,246;
  --red:           #F04452;
  --red-bg:        #FFF0F0;
  --green:         #00A86B;
  --green-bg:      #E8FAF4;
  --purple:        #6C47FF;
  --purple-bg:     #F3F0FF;
  --teal:          #00BCD4;
  --teal-bg:       #E6F9FC;
  --amber:         #F59E0B;
  --amber-bg:      #FFFAEB;
  --sh-xs: 0 1px 2px rgba(0,0,0,.05);
  --sh-sm: 0 2px 8px rgba(0,0,0,.07);
  --sh-md: 0 4px 16px rgba(0,0,0,.09);
  --sh-lg: 0 8px 32px rgba(0,0,0,.11);
  --sh-xl: 0 20px 56px rgba(0,0,0,.13);
  --sh-brand: 0 4px 14px rgba(245,130,13,.3);
  --sh-blue:  0 4px 14px rgba(49,130,246,.28);
}
[data-theme="night"] {
  --bg:            #0E1117;
  --surface:       #1A2130;
  --surface2:      #212B3D;
  --border:        #2A3547;
  --border2:       #3A4A60;
  --text:          #F2F4F6;
  --text2:         #C8D0DA;
  --text3:         #7A8899;
  --text4:         #3F5068;
  --brand:         #FF9A30;
  --brand-dark:    #FFB558;
  --brand-bg:      rgba(255,154,48,.13);
  --brand-rgb:     255,154,48;
  --blue:          #4D9BFF;
  --blue-bg:       rgba(77,155,255,.13);
  --blue-rgb:      77,155,255;
  --red:           #FF6B75;
  --red-bg:        rgba(255,107,117,.13);
  --green:         #1FC791;
  --green-bg:      rgba(31,199,145,.13);
  --purple:        #8B6FFF;
  --purple-bg:     rgba(139,111,255,.13);
  --teal:          #22D3EE;
  --teal-bg:       rgba(34,211,238,.13);
  --amber:         #FBB928;
  --amber-bg:      rgba(251,185,40,.13);
  --sh-xs: 0 1px 2px rgba(0,0,0,.25);
  --sh-sm: 0 2px 8px rgba(0,0,0,.35);
  --sh-md: 0 4px 16px rgba(0,0,0,.45);
  --sh-lg: 0 8px 32px rgba(0,0,0,.55);
  --sh-xl: 0 20px 56px rgba(0,0,0,.65);
  --sh-brand: 0 4px 14px rgba(255,154,48,.3);
  --sh-blue:  0 4px 14px rgba(77,155,255,.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}

/* ── 공통 애니메이션 ── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
@keyframes spin     { to{transform:rotate(360deg)} }
@keyframes shimmer  { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.72)} }
@keyframes dotBlink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

.skeleton {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 400px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}

/* ── 프로그레스 바 ── */
.progress-wrap { position:fixed; top:0; left:0; width:100%; height:3px; z-index:9999; pointer-events:none; }
.progress-bar {
  height:100%; width:0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* ── 테마 버튼 ── */
.theme-toggle {
  position:fixed; bottom:22px; left:20px; z-index:999;
  width:40px; height:40px; border-radius:50%;
  border:1.5px solid var(--border); background:var(--surface);
  color:var(--text3); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sh-sm);
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 150ms ease;
  -webkit-tap-highlight-color:transparent;
}
.theme-toggle:hover  { transform:scale(1.1); box-shadow:var(--sh-md); }
.theme-toggle:active { transform:scale(0.92); }

/* ── 토스트 ── */
#toast {
  position:fixed; bottom:32px; left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--text); color:var(--bg);
  font-size:13px; font-weight:700;
  padding:10px 22px; border-radius:50px;
  opacity:0; pointer-events:none; z-index:9999;
  white-space:nowrap;
  transition: opacity 200ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── 메모 FAB & 패널 ── */
#memoFab {
  position:fixed; bottom:22px; right:22px; z-index:900;
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(135deg, var(--brand), #FF5E1A);
  color:#fff; border:none; cursor:pointer; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sh-brand);
  transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color:transparent;
}
#memoFab:hover  { transform:scale(1.1) rotate(-6deg); box-shadow:0 8px 24px rgba(var(--brand-rgb),.45); }
#memoFab:active { transform:scale(0.94); }
.mp-badge {
  position:absolute; top:5px; right:5px;
  min-width:17px; height:17px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9px; font-weight:800; border-radius:50px;
  border:2.5px solid var(--surface);
  display:none; align-items:center; justify-content:center;
}
.mp-badge.show { display:flex; }
#memoPanel {
  position:fixed; bottom:84px; right:22px; z-index:901;
  width:320px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:20px;
  box-shadow:var(--sh-xl); overflow:hidden;
  transform:scale(.88) translateY(14px); transform-origin:bottom right;
  opacity:0; pointer-events:none;
  transition: transform 280ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease;
}
#memoPanel.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }
.mp-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--border);
  font-size:14px; font-weight:700;
}
.mp-close-btn {
  width:26px; height:26px; border-radius:50%;
  border:none; background:var(--surface2); color:var(--text3);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-close-btn:hover { background:var(--border); color:var(--text); }
.mp-body { padding:14px 18px; }
.mp-input-row { display:flex; gap:8px; margin-bottom:12px; }
.mp-input {
  flex:1; padding:10px 12px;
  background:var(--surface2); border:1.5px solid var(--border);
  border-radius:12px; color:var(--text);
  font-family:inherit; font-size:13px; line-height:1.6;
  resize:none; outline:none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }
.mp-save-btn {
  height:36px; padding:0 14px; align-self:flex-end;
  border-radius:50px; border:none;
  background:var(--brand); color:#fff;
  font-family:inherit; font-size:12px; font-weight:700;
  cursor:pointer; flex-shrink:0;
  transition:all 150ms ease;
}
.mp-save-btn:hover   { background:var(--brand-dark); }
.mp-save-btn:active  { transform:scale(.96); }
.mp-save-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.mp-list { max-height:260px; overflow-y:auto; scrollbar-width:thin; }
.mp-card { padding:10px 0; border-bottom:1px solid var(--border); }
.mp-card:last-child  { border-bottom:none; }
.mp-card-text { font-size:12px; color:var(--text2); line-height:1.6; padding-right:28px; }
.mp-card-date { font-size:10px; color:var(--text4); margin-top:4px; font-variant-numeric:tabular-nums; }
.mp-del-btn {
  position:absolute; top:10px; right:0;
  width:22px; height:22px; border-radius:50%;
  border:none; background:transparent; color:var(--text4);
  cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease;
}
.mp-del-btn:hover { background:var(--red-bg); color:var(--red); }
.mp-empty { font-size:12px; color:var(--text4); text-align:center; padding:20px 0; }
.mp-toast {
  position:fixed; bottom:88px; right:80px; z-index:902;
  background:var(--text); color:var(--bg);
  font-size:12px; font-weight:700;
  padding:8px 16px; border-radius:50px;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:all 200ms ease;
}
.mp-toast.show { opacity:1; transform:translateY(0); }

@media (max-width:480px) {
  #memoPanel { width:calc(100vw - 28px); right:14px; bottom:78px; }
  #memoFab   { width:48px; height:48px; right:16px; bottom:18px; }
}


body { display:flex; flex-direction:column; }
.app-header { position:sticky; top:0; z-index:100; height:56px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:12px; box-shadow:var(--sh-xs); }
.app-header-left { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.back-link { display:inline-flex; align-items:center; gap:5px; height:32px; padding:0 12px; border-radius:50px; border:1.5px solid var(--border); background:transparent; font-size:12px; font-weight:600; color:var(--text3); text-decoration:none; transition:all 150ms ease; flex-shrink:0; }
.back-link:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-bg); }
.back-link svg { width:14px; height:14px; stroke:currentColor; }
.brand-mark { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--amber),var(--brand)); display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 2px 8px rgba(var(--brand-rgb),.3); }
.brand-name { font-size:15px; font-weight:800; letter-spacing:-.4px; }
.page-wrap { max-width:680px; margin:0 auto; padding:24px 20px 80px; }
/* 메모 입력 카드 */
.memo-input-card { background:var(--surface); border:1.5px solid var(--border); border-radius:18px; padding:20px; margin-bottom:14px; transition:border-color 150ms ease, box-shadow 150ms ease; }
.memo-input-card:focus-within { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg); }
.memo-input-area { width:100%; padding:10px 0; border:none; background:transparent; color:var(--text); font-family:inherit; font-size:15px; line-height:1.7; resize:none; outline:none; min-height:80px; }
.memo-input-area::placeholder { color:var(--text4); }
.memo-input-footer { display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:12px; border-top:1px solid var(--border); }
.char-cnt { font-size:11px; color:var(--text4); font-variant-numeric:tabular-nums; }
.save-status { font-size:12px; height:16px; }
.save-ok  { color:var(--green); }
.save-err { color:var(--red); }
.memo-save { height:38px; padding:0 20px; border-radius:50px; border:none; background:var(--brand); color:#fff; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; box-shadow:var(--sh-brand); transition:all 150ms ease; }
.memo-save:hover   { background:var(--brand-dark); transform:translateY(-1px); }
.memo-save:active  { transform:scale(.97); }
.memo-save:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
/* 메모 목록 */
.list-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.list-title { font-size:13px; font-weight:700; color:var(--text2); }
.list-cnt   { font-size:12px; color:var(--text4); font-variant-numeric:tabular-nums; }
.memo-list { display:flex; flex-direction:column; }
.memo-card { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:10px; transition:border-color .2s ease, box-shadow .2s ease; animation:fadeUp 250ms cubic-bezier(0.16,1,0.3,1) both; }
.memo-card:hover { border-color:var(--border2); box-shadow:var(--sh-sm); }
.memo-card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.memo-time { font-size:11px; color:var(--text4); font-variant-numeric:tabular-nums; }
.memo-del  { height:26px; padding:0 11px; border-radius:50px; border:1.5px solid var(--border); background:transparent; font-size:11px; font-weight:700; color:var(--text4); cursor:pointer; transition:all 150ms ease; }
.memo-del:hover { border-color:var(--red); color:var(--red); background:var(--red-bg); }
.memo-body { font-size:14px; color:var(--text2); line-height:1.7; white-space:pre-wrap; }
.memo-empty-state { text-align:center; padding:60px 20px; }
.memo-empty-emoji { font-size:36px; margin-bottom:14px; }
.memo-empty-text  { font-size:14px; color:var(--text3); }
/* toast */
.toast-msg { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--text); color:var(--bg); font-size:13px; font-weight:700; padding:10px 22px; border-radius:50px; opacity:0; pointer-events:none; z-index:9999; white-space:nowrap; transition:opacity 200ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1); }
.toast-msg.show { opacity:1; transform:translateX(-50%) translateY(0); }
.theme-btn { position:fixed; bottom:22px; left:20px; z-index:999; width:40px; height:40px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); color:var(--text3); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; box-shadow:var(--sh-sm); transition:transform 220ms cubic-bezier(0.34,1.56,0.64,1),box-shadow 150ms ease; -webkit-tap-highlight-color:transparent; }
.theme-btn:hover { transform:scale(1.1); box-shadow:var(--sh-md); }
@media (max-width:600px) { .page-wrap{padding:18px 14px 80px;} }

</style>
<script>(function(){var DS=6,DE=20;function auto(){var h=new Date().getHours();return(h>=DS&&h<DE)?'day':'night';}function apply(m,save){document.documentElement.setAttribute('data-theme',m);var b=document.getElementById('themeToggle')||document.getElementById('themeBtn');if(b)b.textContent=m==='night'?'☀️':'🌙';if(save){try{localStorage.setItem('bnh_theme',m);}catch(e){}}}window.__toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme')||'day';apply(c==='day'?'night':'day',true);};setInterval(function(){try{if(!localStorage.getItem('bnh_theme'))apply(auto(),false);}catch(e){}},60000);(function(){var m=null;try{m=localStorage.getItem('bnh_theme');}catch(e){}apply(m||auto(),false);})();})();
})();</script>
</head>
<body>

<header class="app-header">
  <div class="app-header-left">
    <a href="/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      메인
    </a>
    <div class="brand-mark">📝</div>
    <div>
      <div class="brand-name">메모장</div>
    </div>
  </div>
</header>

<div class="page-wrap">

  <div class="memo-input-card anim-up">
    <textarea class="memo-input-area" id="memoInput" placeholder="지금 떠오른 아이디어, 할 일, 참고사항을 자유롭게 기록하세요..." oninput="updateCount()"></textarea>
    <div class="memo-input-footer">
      <div>
        <span class="char-cnt" id="charCnt">0자</span>
        <span class="save-status" id="saveStatus"></span>
      </div>
      <button class="memo-save" id="memoSaveBtn" onclick="saveMemo()">저장</button>
    </div>
  </div>

  <div id="memoListWrap"></div>

</div>

<div id="toast" class="toast-msg"></div>
<button class="theme-btn" id="themeBtn" onclick="__toggleTheme()">🌙</button>

<script>

let memos = [];

function updateCount(){
  const v = document.getElementById('memoInput').value;
  document.getElementById('charCount').textContent = v.length + '자';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function formatDate(id){
  const d = new Date(id);
  if(isNaN(d)) return id;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function render(){
  const el = document.getElementById('memoList');
  const cnt = document.getElementById('memoCount');
  cnt.textContent = memos.length ? `총 ${memos.length}개` : '';
  if(!memos.length){
    el.innerHTML = '<div class="empty"><div class="icon">📝</div><p>아직 메모가 없어요.<br>위에서 첫 메모를 작성해보세요.</p></div>';
    return;
  }
  el.innerHTML = [...memos].reverse().map(m=>`
    <div class="memo-card">
      <button class="del-btn" onclick="deleteMemo('${m.id}')" title="삭제">×</button>
      <div class="memo-content">${m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <div class="memo-footer">
        <span class="memo-date">${formatDate(m.id)}</span>
      </div>
    </div>`).join('');
}

async function loadMemos(){
  try{
    const r = await fetch('/api/memo');
    const d = await r.json();
    memos = d.memos || [];
    render();
  }catch(e){
    document.getElementById('memoList').innerHTML='<div class="empty"><div class="icon">⚠️</div><p>불러오기 실패</p></div>';
  }
}

async function saveMemo(){
  const inp = document.getElementById('memoInput');
  const content = inp.value.trim();
  if(!content) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try{
    await fetch('/api/memo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
    inp.value = ''; updateCount();
    await loadMemos();
    showToast('저장됐어요 ✓');
  }catch(e){ showToast('저장 실패'); }
  finally{ btn.disabled = false; }
}

async function deleteMemo(id){
  if(!confirm('삭제할까요?')) return;
  try{
    await fetch(`/api/memo/${id}`,{method:'DELETE'});
    await loadMemos();
    showToast('삭제됐어요');
  }catch(e){ showToast('삭제 실패'); }
}

// Enter(Shift+Enter 줄바꿈, Ctrl+Enter 저장)
document.getElementById('memoInput').addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); saveMemo(); }
});

loadMemos();

</script>
</body>
</html>
