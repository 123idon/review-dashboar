<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>메모장 — 백년화편</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   토스 디자인 시스템 — 백년화편 퍼스널 컬러
   퍼스널 컬러: 따뜻한 떡 브랜드 → 오렌지/앰버 계열 accent
   ═══════════════════════════════════════════════════════════ */

/* ── 라이트 모드 ── */
[data-theme="day"] {
  --bg:           #F9FAFB;
  --bg2:          #F2F4F6;
  --surface:      #FFFFFF;
  --surface2:     #F9FAFB;
  --border:       #E5E8EB;
  --border2:      #CDD1D8;

  --text:         #191F28;
  --text2:        #333D4B;
  --text3:        #6B7684;
  --text4:        #B0B8C1;

  /* 퍼스널 컬러: 백년화편 = 따뜻한 앰버/오렌지 */
  --brand:        #F5820D;
  --brand-light:  #FFF4E6;
  --brand-dark:   #D96E00;
  --brand-rgb:    245,130,13;

  --blue:         #3182F6;
  --blue-light:   #EBF3FE;
  --blue-rgb:     49,130,246;

  --red:          #F04452;
  --red-light:    #FFF0F0;
  --green:        #00A86B;
  --green-light:  #E8FAF4;
  --purple:       #6C47FF;
  --purple-light: #F3F0FF;
  --teal:         #00BCD4;
  --teal-light:   #E6F9FC;
  --amber:        #F59E0B;
  --amber-light:  #FFFAEB;

  --shadow-xs: 0 1px 2px rgba(0,0,0,.05);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.10), 0 4px 12px rgba(0,0,0,.06);
  --shadow-xl: 0 20px 60px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08);
  --shadow-brand: 0 4px 16px rgba(var(--brand-rgb),.25);
  --shadow-blue:  0 4px 16px rgba(var(--blue-rgb),.25);
}

/* ── 다크 모드 ── */
[data-theme="night"] {
  --bg:           #0E1117;
  --bg2:          #161B25;
  --surface:      #1A2130;
  --surface2:     #212B3D;
  --border:       #2A3547;
  --border2:      #3A4A60;

  --text:         #F2F4F6;
  --text2:        #C8D0DA;
  --text3:        #7A8899;
  --text4:        #3F5068;

  --brand:        #FF9A30;
  --brand-light:  rgba(255,154,48,.14);
  --brand-dark:   #FFB558;
  --brand-rgb:    255,154,48;

  --blue:         #4D9BFF;
  --blue-light:   rgba(77,155,255,.14);
  --blue-rgb:     77,155,255;

  --red:          #FF6B75;
  --red-light:    rgba(255,107,117,.14);
  --green:        #1FC791;
  --green-light:  rgba(31,199,145,.14);
  --purple:       #8B6FFF;
  --purple-light: rgba(139,111,255,.14);
  --teal:         #22D3EE;
  --teal-light:   rgba(34,211,238,.14);
  --amber:        #FBB928;
  --amber-light:  rgba(251,185,40,.14);

  --shadow-xs: 0 1px 2px rgba(0,0,0,.2);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.5);
  --shadow-xl: 0 20px 60px rgba(0,0,0,.6);
  --shadow-brand: 0 4px 16px rgba(var(--brand-rgb),.3);
  --shadow-blue:  0 4px 16px rgba(var(--blue-rgb),.3);
}

/* ── 기본 리셋 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s ease, color 0.2s ease;
}

/* ── 타이포 스케일 ── */
.t-hero  { font-size: clamp(28px,5vw,42px); font-weight: 800; letter-spacing: -1.4px; line-height: 1.15; }
.t-title { font-size: 22px; font-weight: 800; letter-spacing: -.7px; }
.t-head  { font-size: 17px; font-weight: 700; letter-spacing: -.4px; }
.t-body  { font-size: 14px; font-weight: 400; line-height: 1.7; }
.t-label { font-size: 12px; font-weight: 600; }
.t-caption{ font-size: 11px; color: var(--text3); }
.t-mono  { font-family: 'SF Mono','JetBrains Mono','Fira Code',monospace; }
.t-num   { font-variant-numeric: tabular-nums; }

/* ── 토스 스탯 숫자 ── */
.stat-num {
  font-size: 32px; font-weight: 800;
  letter-spacing: -1.8px; line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* ── 레이아웃 ── */
.page-wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
.section   { margin-bottom: 24px; }
.grid-2    { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3    { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.grid-4    { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

/* ── 카드 ── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  transition:
    border-color 200ms ease,
    box-shadow 200ms ease,
    transform 200ms cubic-bezier(0.34,1.56,0.64,1);
}
.card:hover {
  border-color: var(--border2);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.card-title {
  font-size: 13px; font-weight: 700;
  color: var(--text2); margin-bottom: 14px; letter-spacing: -.2px;
}

/* ── 버튼 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 22px;
  border-radius: 50px; border: none;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: all 150ms cubic-bezier(0.16,1,0.3,1);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--brand); color: #fff;
  box-shadow: var(--shadow-brand);
}
.btn-primary:hover { background: var(--brand-dark); box-shadow: 0 6px 20px rgba(var(--brand-rgb),.4); transform: translateY(-1px); }
.btn-blue { background: var(--blue); color: #fff; box-shadow: var(--shadow-blue); }
.btn-blue:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
.btn-ghost:hover { border-color: var(--border2); background: var(--surface2); }
.btn-sm { height: 32px; padding: 0 14px; font-size: 12px; border-radius: 50px; }
.btn-xs { height: 26px; padding: 0 10px; font-size: 11px; border-radius: 50px; }

/* ── 입력 ── */
.input {
  width: 100%; height: 48px; padding: 0 14px;
  background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
.input-sm { height: 36px; font-size: 13px; border-radius: 10px; }
textarea.input { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.6; }

/* ── 배지/칩 ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 9px; border-radius: 50px;
  font-size: 10px; font-weight: 700; letter-spacing: .4px;
}
.badge-brand  { background: var(--brand-light);  color: var(--brand); }
.badge-blue   { background: var(--blue-light);   color: var(--blue); }
.badge-green  { background: var(--green-light);  color: var(--green); }
.badge-red    { background: var(--red-light);    color: var(--red); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-amber  { background: var(--amber-light);  color: var(--amber); }
.badge-teal   { background: var(--teal-light);   color: var(--teal); }
.badge-gray   { background: var(--surface2);     color: var(--text3); }

/* ── 라이브 배지 ── */
.live-dot {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 9px; border-radius: 50px;
  background: var(--green-light); color: var(--green);
  font-size: 10px; font-weight: 700;
}
.live-dot::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.5; transform:scale(.75); }
}

/* ── 공통 네비 헤더 ── */
.app-header {
  position: sticky; top: 0; z-index: 200;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  box-shadow: var(--shadow-xs);
  transition: background .2s ease, border-color .2s ease;
}
.app-header-left  { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.app-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  box-shadow: 0 2px 8px rgba(var(--brand-rgb),.35);
}
.brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.4px; }
.brand-sub  { font-size: 10px; color: var(--text4); letter-spacing: .5px; text-transform: uppercase; }

/* 뒤로가기 버튼 */
.back-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 12px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-size: 12px; font-weight: 600; color: var(--text3);
  text-decoration: none; cursor: pointer;
  transition: all 150ms ease;
  flex-shrink: 0;
}
.back-link:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
.back-link svg { width: 14px; height: 14px; stroke: currentColor; flex-shrink: 0; }

/* ── 탭 ── */
.tab-group {
  display: flex; background: var(--bg2);
  border-radius: 10px; padding: 3px; gap: 2px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-group::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; height: 30px; padding: 0 14px;
  border-radius: 8px; border: none; background: transparent;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--text3); cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}
.tab:hover { color: var(--text2); }
.tab.active {
  background: var(--surface); color: var(--brand);
  box-shadow: var(--shadow-sm);
}

/* ── 필터 바 ── */
.filter-pill {
  height: 30px; padding: 0 13px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--text3); cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}
.filter-pill:hover { border-color: var(--brand); color: var(--brand); }
.filter-pill.active {
  background: var(--brand); border-color: var(--brand); color: #fff;
  box-shadow: var(--shadow-brand);
}

/* ── 토스트 ── */
.toast-msg {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg);
  font-size: 13px; font-weight: 600;
  padding: 11px 22px; border-radius: 50px;
  opacity: 0; pointer-events: none; z-index: 9999;
  white-space: nowrap;
  transition: opacity 200ms ease, transform 200ms cubic-bezier(0.34,1.56,0.64,1);
}
.toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 테마 버튼 ── */
.theme-btn {
  position: fixed; bottom: 22px; left: 20px; z-index: 999;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text3);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: transform 200ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 150ms ease;
  -webkit-tap-highlight-color: transparent;
}
.theme-btn:hover  { transform: scale(1.1); box-shadow: var(--shadow-md); }
.theme-btn:active { transform: scale(0.93); }

/* ── 플로팅 메모 버튼 ── */
.memo-fab {
  position: fixed; bottom: 22px; right: 22px; z-index: 900;
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), #FF5E1A);
  color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-brand);
  transition: transform 250ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
  -webkit-tap-highlight-color: transparent;
}
.memo-fab:hover  { transform: scale(1.08) rotate(-5deg); box-shadow: 0 8px 24px rgba(var(--brand-rgb),.45); }
.memo-fab:active { transform: scale(0.94); }
.mp-badge {
  position: absolute; top: 5px; right: 5px;
  min-width: 17px; height: 17px; padding: 0 4px;
  background: var(--red); color: #fff;
  font-size: 9px; font-weight: 800; border-radius: 50px;
  border: 2.5px solid var(--surface);
  display: none; align-items: center; justify-content: center;
}
.mp-badge.show { display: flex; }

/* ── 메모 패널 ── */
.memo-panel {
  position: fixed; bottom: 84px; right: 22px; z-index: 901;
  width: 340px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-xl);
  overflow: hidden;
  transform: scale(.88) translateY(14px);
  transform-origin: bottom right;
  opacity: 0; pointer-events: none;
  transition:
    transform 280ms cubic-bezier(0.34,1.56,0.64,1),
    opacity 200ms ease;
}
.memo-panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
.mp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.mp-title { font-size: 14px; font-weight: 700; letter-spacing: -.3px; }
.mp-close {
  width: 26px; height: 26px; border-radius: 50%;
  border: none; background: var(--bg2); color: var(--text3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 150ms ease;
}
.mp-close:hover { background: var(--border); color: var(--text); }
.mp-body { padding: 14px 18px; }
.mp-textarea {
  width: 100%; padding: 11px 13px;
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-family: inherit; font-size: 13px; line-height: 1.6;
  resize: none; outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.mp-textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
.mp-save {
  width: 100%; height: 38px; margin-top: 8px;
  border-radius: 50px; border: none;
  background: var(--brand); color: #fff;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: all 150ms ease;
}
.mp-save:hover   { background: var(--brand-dark); }
.mp-save:active  { transform: scale(.98); }
.mp-save:disabled{ opacity: .5; cursor: not-allowed; }
.mp-list { max-height: 260px; overflow-y: auto; margin-top: 10px; scrollbar-width: thin; }
.mp-card { padding: 10px 0; border-bottom: 1px solid var(--border); }
.mp-card:last-child { border-bottom: none; }
.mp-card-text  { font-size: 13px; color: var(--text2); line-height: 1.6; }
.mp-card-footer{ display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
.mp-card-date  { font-size: 10px; color: var(--text4); font-variant-numeric: tabular-nums; }
.mp-del-btn {
  height: 22px; padding: 0 9px; border-radius: 50px;
  border: 1.5px solid var(--border); background: transparent;
  font-size: 10px; font-weight: 600; color: var(--text4); cursor: pointer;
  transition: all 150ms ease;
}
.mp-del-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
.mp-empty { font-size: 12px; color: var(--text4); text-align: center; padding: 20px 0; }
.mp-toast {
  position: fixed; bottom: 88px; right: 80px; z-index: 902;
  background: var(--text); color: var(--bg);
  font-size: 12px; font-weight: 700;
  padding: 8px 16px; border-radius: 50px;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: all 200ms ease;
}
.mp-toast.show { opacity: 1; transform: translateY(0); }

/* ── 스켈레톤 ── */
.skeleton {
  border-radius: 8px;
  background: linear-gradient(
    90deg,
    var(--surface2) 25%,
    var(--border) 50%,
    var(--surface2) 75%
  );
  background-size: 400px 100%;
  animation: skeleton-shine 1.4s ease-in-out infinite;
}
@keyframes skeleton-shine {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}

/* ── 프로그레스 바 ── */
.progress-rail { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 9999; pointer-events: none; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--brand), var(--blue));
  box-shadow: 0 0 8px var(--brand);
  transition: width .3s ease;
}

/* ── 분리선 ── */
.divider { height: 1px; background: var(--border); margin: 0; }

/* ── 공통 애니메이션 ── */
@keyframes fade-up   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-down { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-in   { from { opacity:0; } to { opacity:1; } }
@keyframes scale-in  { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:scale(1); } }
@keyframes spin      { to { transform: rotate(360deg); } }

.anim-up   { animation: fade-up   280ms cubic-bezier(0.16,1,0.3,1) both; }
.anim-down { animation: fade-down 280ms cubic-bezier(0.16,1,0.3,1) both; }
.anim-in   { animation: fade-in   220ms ease both; }

/* 순차 딜레이 */
.d1 { animation-delay: .06s; }
.d2 { animation-delay: .12s; }
.d3 { animation-delay: .18s; }
.d4 { animation-delay: .24s; }
.d5 { animation-delay: .30s; }

/* ── 스피너 ── */
.spinner {
  width: 24px; height: 24px;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* ── 모바일 공통 ── */
@media (max-width: 480px) {
  .memo-panel { width: calc(100vw - 28px); right: 14px; bottom: 78px; }
  .memo-fab   { width: 48px; height: 48px; right: 16px; bottom: 18px; }
  .page-wrap  { padding: 16px 14px 80px; }
}


/* memo 전용 */
.page-wrap { max-width: 680px; }
.memo-input-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 14px; transition: box-shadow .2s ease; }
.memo-input-card:focus-within { box-shadow: var(--shadow-md); border-color: var(--brand); }
.memo-input-area {
  width: 100%; padding: 12px 0; border: none; background: transparent;
  color: var(--text); font-family: inherit; font-size: 15px;
  line-height: 1.7; resize: none; outline: none; min-height: 80px;
}
.memo-input-area::placeholder { color: var(--text4); }
.memo-input-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--border); }
.char-cnt { font-size: 11px; color: var(--text4); font-variant-numeric: tabular-nums; }
.memo-save { height: 38px; padding: 0 20px; border-radius: 50px; border: none; background: var(--brand); color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-brand); transition: all 150ms ease; }
.memo-save:hover { background: var(--brand-dark); transform: translateY(-1px); }
.memo-save:active { transform: scale(.97); }
.memo-save:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.save-status { font-size: 12px; height: 16px; }
.save-ok  { color: var(--green); }
.save-err { color: var(--red); }

.list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.list-title { font-size: 13px; font-weight: 700; color: var(--text2); }
.list-cnt   { font-size: 12px; color: var(--text4); font-variant-numeric: tabular-nums; }

.memo-list { display: flex; flex-direction: column; }
.memo-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 16px; padding: 18px 20px; margin-bottom: 10px;
  transition: border-color .2s ease, box-shadow .2s ease;
  animation: fade-up 250ms cubic-bezier(0.16,1,0.3,1) both;
}
.memo-card:hover { border-color: var(--border2); box-shadow: var(--shadow-sm); }
.memo-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.memo-time { font-size: 11px; color: var(--text4); font-variant-numeric: tabular-nums; }
.memo-del  { height: 26px; padding: 0 11px; border-radius: 50px; border: 1.5px solid var(--border); background: transparent; font-size: 11px; font-weight: 700; color: var(--text4); cursor: pointer; transition: all 150ms ease; }
.memo-del:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
.memo-body { font-size: 14px; color: var(--text2); line-height: 1.7; white-space: pre-wrap; }
.memo-empty-state { text-align: center; padding: 60px 20px; }
.memo-empty-emoji { font-size: 36px; margin-bottom: 14px; }
.memo-empty-text  { font-size: 14px; color: var(--text3); }

</style>
<script>(function(){
  var DS=6,DE=20;
  function auto(){var h=new Date().getHours();return(h>=DS&&h<DE)?'day':'night';}
  function apply(m,save){
    document.documentElement.setAttribute('data-theme',m);
    var b=document.getElementById('themeBtn');
    if(b)b.textContent=m==='night'?'☀️':'🌙';
    if(save){try{localStorage.setItem('bnh_theme',m);}catch(e){}}
  }
  window.__toggleTheme=function(){
    var c=document.documentElement.getAttribute('data-theme')||'day';
    apply(c==='day'?'night':'day',true);
  };
  setInterval(function(){try{if(!localStorage.getItem('bnh_theme'))apply(auto(),false);}catch(e){}},60000);
  (function(){var m=null;try{m=localStorage.getItem('bnh_theme');}catch(e){}apply(m||auto(),false);})();
})();</script>
</head>
<body>

<header class="app-header">
  <div class="app-header-left">
    <a href="/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      메인
    </a>
    <div class="brand-mark">📝</div>
    <div>
      <div class="brand-name">메모장</div>
    </div>
  </div>
</header>

<div class="page-wrap">

  <div class="memo-input-card anim-up">
    <textarea class="memo-input-area" id="memoInput" placeholder="지금 떠오른 아이디어, 할 일, 참고사항을 자유롭게 기록하세요..." oninput="updateCount()"></textarea>
    <div class="memo-input-footer">
      <div>
        <span class="char-cnt" id="charCnt">0자</span>
        <span class="save-status" id="saveStatus"></span>
      </div>
      <button class="memo-save" id="memoSaveBtn" onclick="saveMemo()">저장</button>
    </div>
  </div>

  <div id="memoListWrap"></div>

</div>

<div id="toast" class="toast-msg"></div>
<button class="theme-btn" id="themeBtn" onclick="__toggleTheme()">🌙</button>

<script>

let memos = [];

function updateCount(){
  const v = document.getElementById('memoInput').value;
  document.getElementById('charCount').textContent = v.length + '자';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function formatDate(id){
  const d = new Date(id);
  if(isNaN(d)) return id;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function render(){
  const el = document.getElementById('memoList');
  const cnt = document.getElementById('memoCount');
  cnt.textContent = memos.length ? `총 ${memos.length}개` : '';
  if(!memos.length){
    el.innerHTML = '<div class="empty"><div class="icon">📝</div><p>아직 메모가 없어요.<br>위에서 첫 메모를 작성해보세요.</p></div>';
    return;
  }
  el.innerHTML = [...memos].reverse().map(m=>`
    <div class="memo-card">
      <button class="del-btn" onclick="deleteMemo('${m.id}')" title="삭제">×</button>
      <div class="memo-content">${m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <div class="memo-footer">
        <span class="memo-date">${formatDate(m.id)}</span>
      </div>
    </div>`).join('');
}

async function loadMemos(){
  try{
    const r = await fetch('/api/memo');
    const d = await r.json();
    memos = d.memos || [];
    render();
  }catch(e){
    document.getElementById('memoList').innerHTML='<div class="empty"><div class="icon">⚠️</div><p>불러오기 실패</p></div>';
  }
}

async function saveMemo(){
  const inp = document.getElementById('memoInput');
  const content = inp.value.trim();
  if(!content) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try{
    await fetch('/api/memo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
    inp.value = ''; updateCount();
    await loadMemos();
    showToast('저장됐어요 ✓');
  }catch(e){ showToast('저장 실패'); }
  finally{ btn.disabled = false; }
}

async function deleteMemo(id){
  if(!confirm('삭제할까요?')) return;
  try{
    await fetch(`/api/memo/${id}`,{method:'DELETE'});
    await loadMemos();
    showToast('삭제됐어요');
  }catch(e){ showToast('삭제 실패'); }
}

// Enter(Shift+Enter 줄바꿈, Ctrl+Enter 저장)
document.getElementById('memoInput').addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); saveMemo(); }
});

loadMemos();

</script>
</body>
</html>
