<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>메모장 — 백년화편</title>
  <style>
:root {
  /* ── 토스 컬러 시스템 ── */
  --bg:        #f9fafb;
  --surface:   #ffffff;
  --surface2:  #f2f4f6;
  --border:    #e5e8eb;
  --border2:   #d1d6db;

  --text:      #191f28;
  --text2:     #333d4b;
  --text3:     #6b7684;
  --text4:     #b0b8c1;

  --primary:        #3182f6;
  --primary-light:  #ebf3fe;
  --primary-dark:   #1b64da;

  --red:        #f04452;
  --red-light:  #fff0f0;
  --green:      #00a86b;
  --green-light:#e8faf4;
  --orange:     #ff6b00;
  --orange-light:#fff4eb;
  --yellow:     #f5a623;
  --yellow-light:#fffaeb;
  --purple:     #6c47ff;
  --purple-light:#f3f0ff;
  --teal:       #00bcd4;
  --teal-light: #e6f9fc;

  /* ── 그림자 ── */
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md:  0 4px 16px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
  --shadow-xl:  0 16px 48px rgba(0,0,0,.14), 0 8px 24px rgba(0,0,0,.08);

  /* ── 반경 ── */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-pill:50px;

  /* ── 폰트 ── */
  --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* ── 애니메이션 ── */
  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-in-out: cubic-bezier(0.45,0,0.55,1);
  --duration-fast:  150ms;
  --duration-base:  220ms;
  --duration-slow:  350ms;
}

html.night {
  --bg:        #131820;
  --surface:   #1c2330;
  --surface2:  #242e3d;
  --border:    #2d3a4a;
  --border2:   #3d4e62;
  --text:      #f2f4f6;
  --text2:     #d0d7e0;
  --text3:     #8b95a1;
  --text4:     #4e5968;
  --primary:        #4593fc;
  --primary-light:  rgba(69,147,252,0.15);
  --primary-dark:   #6aadff;
  --red:        #ff6b6b;
  --red-light:  rgba(240,68,82,0.15);
  --green:      #20c997;
  --green-light:rgba(0,168,107,0.15);
  --shadow-sm:  0 1px 4px rgba(0,0,0,.3);
  --shadow-md:  0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.5);
}

    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

    header{
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:0 20px; display:flex; align-items:center; justify-content:space-between;
      height:56px; position:sticky; top:0; z-index:100;
      box-shadow:var(--shadow-sm); gap:12px;
    }
    .header-left{display:flex;align-items:center;gap:10px;}
    .logo-icon{
      width:32px;height:32px;background:linear-gradient(135deg,var(--yellow),var(--orange));
      border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;
    }
    .page-title{font-size:15px;font-weight:800;letter-spacing:-.4px;}
    .back-btn{
      display:flex;align-items:center;gap:5px;
      font-size:12px;font-weight:600;color:var(--text3);
      text-decoration:none;padding:6px 12px;border-radius:var(--r-pill);
      border:1.5px solid var(--border);background:var(--surface);
      transition:all var(--duration-fast) var(--ease-out);
    }
    .back-btn:hover{border-color:var(--primary);color:var(--primary);}

    .main{max-width:680px;margin:0 auto;padding:28px 20px 64px;}

    .card{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:var(--r-lg);padding:20px;margin-bottom:14px;
      transition:box-shadow var(--duration-base) var(--ease-out);
    }
    .card-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;letter-spacing:-.2px;}

    .char-count{font-size:11px;color:var(--text4);font-family:var(--mono);}
    .memo-textarea{
      width:100%;padding:14px;border:1.5px solid var(--border);
      border-radius:var(--r-md);background:var(--surface);
      color:var(--text);font-family:var(--font);font-size:14px;
      line-height:1.65;resize:vertical;min-height:110px;outline:none;
      transition:border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
    }
    .memo-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .memo-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
    .save-btn{
      height:40px;padding:0 22px;border-radius:var(--r-pill);border:none;
      background:var(--primary);font-size:13px;font-weight:700;color:#fff;
      cursor:pointer;font-family:var(--font);
      transition:all var(--duration-fast) var(--ease-out);
      box-shadow:0 2px 8px rgba(49,130,246,.25);
    }
    .save-btn:hover{background:var(--primary-dark);box-shadow:0 4px 16px rgba(49,130,246,.35);transform:translateY(-1px);}
    .save-btn:active{transform:scale(.97);}
    .save-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .toast-msg{font-size:12px;color:var(--green);font-weight:600;}

    .list-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:14px;
    }
    .list-count{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:-.2px;}

    .memo-list{display:flex;flex-direction:column;gap:0;}
    .memo-item{
      padding:14px 0;border-bottom:1px solid var(--border);
      animation:fadeSlideUp var(--duration-base) var(--ease-out) both;
    }
    .memo-item:last-child{border-bottom:none;}
    .item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
    .item-date{font-size:11px;color:var(--text4);font-family:var(--mono);}
    .del-btn{
      height:26px;padding:0 11px;border-radius:var(--r-pill);
      border:1.5px solid var(--border);background:transparent;
      font-size:11px;color:var(--text4);cursor:pointer;font-family:var(--font);
      transition:all var(--duration-fast) var(--ease-out);
    }
    .del-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-light);}
    .item-content{font-size:14px;color:var(--text2);line-height:1.7;white-space:pre-wrap;}
    .empty-state{
      text-align:center;padding:40px 20px;
      font-size:14px;color:var(--text3);
    }
    .empty-state .emoji{font-size:32px;display:block;margin-bottom:12px;}

    .theme-toggle{
      position:fixed;bottom:20px;left:20px;width:40px;height:40px;border-radius:50%;
      border:1.5px solid var(--border);background:var(--surface);color:var(--text3);
      cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;
      z-index:999;box-shadow:var(--shadow-sm);
      transition:transform var(--duration-fast) var(--spring), box-shadow var(--duration-fast) var(--ease-out);
      -webkit-tap-highlight-color:transparent;
    }
    .theme-toggle:hover{transform:scale(1.08);box-shadow:var(--shadow-md);}
    .theme-toggle:active{transform:scale(.92);}

    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @media(max-width:600px){.main{padding:20px 16px 64px;}}

</style>
<script>
(function() {
  var DAY_START = 7, DAY_END = 19;
  function getAutoTheme() {
    var h = new Date().getHours();
    return (h >= DAY_START && h < DAY_END) ? 'day' : 'night';
  }
  function applyTheme(mode, manual) {
    document.documentElement.classList.remove('day','night');
    document.documentElement.classList.add(mode);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = mode === 'night' ? '☀️' : '🌙';
    if (manual) { try { localStorage.setItem('bnh_theme', mode); } catch(e){} }
  }
  window.__toggleTheme = function() {
    var cur = document.documentElement.classList.contains('day') ? 'day' : 'night';
    var next = cur === 'day' ? 'night' : 'day';
    applyTheme(next, true);
  };
  setInterval(function() {
    try { if (!localStorage.getItem('bnh_theme')) applyTheme(getAutoTheme(), false); } catch(e){}
  }, 60000);
  (function init() {
    var manual = null;
    try { manual = localStorage.getItem('bnh_theme'); } catch(e){}
    applyTheme(manual || getAutoTheme(), false);
  })();
})();
</script>
</head>
<body>
<header>
  <div class="header-left">
    <div class="logo-icon">🍡</div>
    <div>
      <div class="brand-name">백년화편</div>
      <div class="brand-sub">Management System</div>
    </div>
  </div>
  <a href="/" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    메인으로
  </a>
</header>

<div class="wrap">
  <div class="page-badge">📝 Memo</div>
  <h1>메모장</h1>
  <p class="subtitle">아이디어, 할 일, 참고사항을 자유롭게 기록하세요.</p>

  <div class="input-box">
    <textarea id="memoInput" placeholder="메모를 입력하세요..." oninput="updateCount()"></textarea>
    <div class="input-footer">
      <span class="char-count" id="charCount">0자</span>
      <button class="save-btn" id="saveBtn" onclick="saveMemo()">저장</button>
    </div>
  </div>

  <div class="memo-count" id="memoCount"></div>
  <div class="memo-list" id="memoList">
    <div class="empty"><div class="icon">📭</div><p>불러오는 중…</p></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let memos = [];

function updateCount(){
  const v = document.getElementById('memoInput').value;
  document.getElementById('charCount').textContent = v.length + '자';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function formatDate(id){
  const d = new Date(id);
  if(isNaN(d)) return id;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function render(){
  const el = document.getElementById('memoList');
  const cnt = document.getElementById('memoCount');
  cnt.textContent = memos.length ? `총 ${memos.length}개` : '';
  if(!memos.length){
    el.innerHTML = '<div class="empty"><div class="icon">📝</div><p>아직 메모가 없어요.<br>위에서 첫 메모를 작성해보세요.</p></div>';
    return;
  }
  el.innerHTML = [...memos].reverse().map(m=>`
    <div class="memo-card">
      <button class="del-btn" onclick="deleteMemo('${m.id}')" title="삭제">×</button>
      <div class="memo-content">${m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <div class="memo-footer">
        <span class="memo-date">${formatDate(m.id)}</span>
      </div>
    </div>`).join('');
}

async function loadMemos(){
  try{
    const r = await fetch('/api/memo');
    const d = await r.json();
    memos = d.memos || [];
    render();
  }catch(e){
    document.getElementById('memoList').innerHTML='<div class="empty"><div class="icon">⚠️</div><p>불러오기 실패</p></div>';
  }
}

async function saveMemo(){
  const inp = document.getElementById('memoInput');
  const content = inp.value.trim();
  if(!content) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try{
    await fetch('/api/memo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
    inp.value = ''; updateCount();
    await loadMemos();
    showToast('저장됐어요 ✓');
  }catch(e){ showToast('저장 실패'); }
  finally{ btn.disabled = false; }
}

async function deleteMemo(id){
  if(!confirm('삭제할까요?')) return;
  try{
    await fetch(`/api/memo/${id}`,{method:'DELETE'});
    await loadMemos();
    showToast('삭제됐어요');
  }catch(e){ showToast('삭제 실패'); }
}

// Enter(Shift+Enter 줄바꿈, Ctrl+Enter 저장)
document.getElementById('memoInput').addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); saveMemo(); }
});

loadMemos();
</script>

<button class="theme-toggle" id="themeToggle" onclick="__toggleTheme()" title="주간/야간 전환">🌙</button>
</body>
</html>
