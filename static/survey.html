<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>고객만족 설문 분석 · 백년화편</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F9FAFB;--bg2:#F2F4F6;--surface:#fff;--surface2:#F2F4F6;
  --border:#E5E8EB;
  --text:#191F28;--text2:#333D4B;--text3:#6B7684;--text4:#B0B8C1;
  --accent:#b5651d;--accent-soft:#f3e9dd;
  --green:#10B981;--red:#EF4444;--blue:#3B82F6;--amber:#F59E0B;--purple:#8B5CF6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:60px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}

#loading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-text{font-size:13px;color:var(--text3)}

.hdr{display:flex;align-items:center;gap:12px;padding:20px 0 14px}
.back-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text2);font-size:18px;transition:all 150ms ease;flex-shrink:0}
.back-btn:hover{background:var(--surface2)}
.hdr-titles{flex:1}
.page-title{font-size:18px;font-weight:800;letter-spacing:-.4px}
.page-sub{font-size:11px;color:var(--text4);margin-top:2px}
.last-upd{font-size:11px;color:var(--text4);font-variant-numeric:tabular-nums;text-align:right}

.notice{background:var(--accent-soft);border:1px solid #e8d5bf;border-radius:12px;padding:11px 14px;font-size:12px;color:#7a4a13;line-height:1.6;margin-bottom:16px;display:none}
.notice.show{display:block}

.date-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:18px}
.date-presets{display:flex;gap:6px;flex-wrap:wrap}
.date-preset{height:30px;padding:0 12px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all 150ms ease}
.date-preset:hover{border-color:var(--accent);color:var(--accent)}
.date-preset.active{background:var(--accent);border-color:var(--accent);color:#fff}
.date-inputs{display:flex;align-items:center;gap:8px}
.date-input{height:30px;padding:0 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:12px;color:var(--text);outline:none;font-variant-numeric:tabular-nums}
.date-input:focus{border-color:var(--accent)}
.date-sep{color:var(--text4);font-size:12px}
.date-apply{height:30px;padding:0 14px;border-radius:50px;border:none;background:var(--text);color:var(--surface);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.date-apply:hover{opacity:.85}
@media(max-width:600px){.date-bar{flex-direction:column;align-items:stretch}.date-inputs{justify-content:space-between}.date-input{flex:1}}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.kpi-label{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:8px}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpi-value small{font-size:13px;font-weight:600;color:var(--text4)}
.kpi-sub{font-size:11px;color:var(--text4);margin-top:4px}
.stars{color:var(--amber);font-size:15px;letter-spacing:1px}

.section-title{font-size:11px;font-weight:700;color:var(--text4);letter-spacing:1.2px;text-transform:uppercase;margin:8px 0 12px}

.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.chart-title{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:-.2px;margin-bottom:14px}
.chart-box{position:relative;height:230px}

/* 응답 카드 리스트 */
.table-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search-box{flex:1;min-width:160px;height:34px;padding:0 14px;border-radius:50px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:13px;color:var(--text);outline:none}
.search-box:focus{border-color:var(--accent)}
.filter-sel{height:34px;padding:0 12px;border-radius:50px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;outline:none}

.field-toggle{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.field-toggle-label{font-size:12px;font-weight:700;color:var(--text4);margin-right:4px}
.field-btn{height:30px;padding:0 13px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all 150ms ease}
.field-btn:hover{border-color:var(--accent);color:var(--accent)}
.field-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.resp-list{display:flex;flex-direction:column;gap:12px}
.resp-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.resp-card.low{border-color:#fecaca;background:#fffafa}
.resp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.resp-stars{color:var(--amber);font-size:14px;letter-spacing:1px}
.badge{display:inline-block;padding:2px 9px;border-radius:50px;font-size:11px;font-weight:700}
.b-sat5{background:#dcfce7;color:#15803d}.b-sat4{background:#dbeafe;color:#1d4ed8}
.b-sat3{background:#fef9c3;color:#a16207}.b-sat12{background:#fee2e2;color:#b91c1c}
.resp-date{font-size:12px;color:var(--text4);font-variant-numeric:tabular-nums}
.resp-product{font-size:13px;font-weight:700;color:var(--text);background:var(--accent-soft);padding:2px 10px;border-radius:50px}
.resp-tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.resp-tag{font-size:11px;color:var(--text3);background:var(--bg2);padding:2px 9px;border-radius:50px}
.resp-qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.resp-qa.single{grid-template-columns:1fr}
.resp-noqa{font-size:12px;color:var(--text4);font-style:italic}
.qa-item{display:flex;flex-direction:column;gap:3px}
.qa-label{font-size:11px;font-weight:700;color:var(--text4)}
.qa-text{font-size:13px;color:var(--text2);line-height:1.6;word-break:break-word}
.qa-empty{color:var(--text4)}
.resp-foot{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text4)}
.resp-foot b{color:var(--text3);font-weight:600}

.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.pg-btn{min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:40px 0;color:var(--text4);font-size:13px}
@media(max-width:600px){.page-title{font-size:16px}.kpi-value{font-size:22px}.resp-qa{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div class="ld-text">설문 데이터 불러오는 중…</div></div>

<div class="wrap">
  <div class="hdr">
    <a href="/" class="back-btn">←</a>
    <div class="hdr-titles">
      <div class="page-title">고객만족 설문 분석</div>
      <div class="page-sub">백년화편 고객만족 설문조사 응답 집계</div>
    </div>
    <div class="last-upd" id="lastUpd"></div>
  </div>

  <div class="notice" id="notice"></div>

  <!-- 기간 필터 -->
  <div class="date-bar" id="dateBar">
    <div class="date-presets">
      <button class="date-preset" data-days="7">최근 7일</button>
      <button class="date-preset active" data-days="14">최근 14일</button>
      <button class="date-preset" data-days="30">최근 30일</button>
      <button class="date-preset" data-days="90">최근 90일</button>
      <button class="date-preset" data-days="0">전체</button>
    </div>
    <div class="date-inputs">
      <input type="date" id="dateFrom" class="date-input">
      <span class="date-sep">~</span>
      <input type="date" id="dateTo" class="date-input">
      <button class="date-apply" id="dateApply">적용</button>
    </div>
  </div>

  <!-- 영역 1: KPI -->
  <div class="kpi-row" id="kpiRow"></div>

  <!-- 영역 1: 차트 -->
  <div class="section-title">응답 분포</div>
  <div class="chart-grid">
    <div class="card"><div class="chart-title">만족도 분포</div><div class="chart-box"><canvas id="chSat"></canvas></div></div>
    <div class="card"><div class="chart-title">인지 경로 (어떻게 알게 되었나)</div><div class="chart-box"><canvas id="chChannel"></canvas></div></div>
    <div class="card"><div class="chart-title">주문 경로</div><div class="chart-box"><canvas id="chOrder"></canvas></div></div>
    <div class="card"><div class="chart-title">연령대</div><div class="chart-box"><canvas id="chAge"></canvas></div></div>
    <div class="card"><div class="chart-title">성별</div><div class="chart-box"><canvas id="chGender"></canvas></div></div>
    <div class="card"><div class="chart-title">추천 의향</div><div class="chart-box"><canvas id="chRec"></canvas></div></div>
  </div>

  <!-- 영역 2: 응답 원본 (카드형) -->
  <div class="section-title">응답 원본 <span style="color:var(--text4);font-weight:400;text-transform:none;letter-spacing:0">· 휴대폰번호는 보호를 위해 마스킹 표시됩니다</span></div>
  <div class="table-controls">
    <input class="search-box" id="searchBox" placeholder="응답 내용 검색…">
    <select class="filter-sel" id="filSat"><option value="">만족도 전체</option><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option></select>
    <select class="filter-sel" id="filGender"><option value="">성별 전체</option></select>
    <select class="filter-sel" id="filPath"><option value="">주문경로 전체</option></select>
  </div>
  <div class="field-toggle" id="fieldToggle">
    <span class="field-toggle-label">주관식 보기</span>
    <button class="field-btn active" data-f="all">전체</button>
    <button class="field-btn" data-f="reason">만족 이유</button>
    <button class="field-btn" data-f="improve_product">상품 개선점</button>
    <button class="field-btn" data-f="improve_order">주문과정 개선점</button>
    <button class="field-btn" data-f="wish_product">출시 희망 상품</button>
  </div>
  <div class="resp-list" id="respList"></div>
  <div class="pager" id="pager"></div>
</div>

<script>
const PALETTE=['#b5651d','#3B82F6','#10B981','#F59E0B','#8B5CF6','#EF4444','#06B6D4','#EC4899','#84CC16','#6366F1'];
let RAW=null, STATS=null, charts={}, curPage=1, curField='all';
let curFrom='', curTo='';   // 현재 적용된 날짜 범위 (YYYY-MM-DD)
const PER=10;

function fmtDate(s){if(!s)return'';return s.replace(/-/g,'.');}
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function setRangeDays(days){
  // days=0 → 전체 (빈 범위)
  if(!days){ curFrom=''; curTo=''; }
  else{
    const to=new Date();
    const from=new Date(); from.setDate(from.getDate()-(days-1));
    curFrom=toISO(from); curTo=toISO(to);
  }
  document.getElementById('dateFrom').value=curFrom;
  document.getElementById('dateTo').value=curTo;
}

async function load(){
  try{
    const qs = (curFrom||curTo) ? `?date_from=${curFrom}&date_to=${curTo}` : '';
    const [rs, rd] = await Promise.all([
      fetch('/api/survey'+qs).then(r=>r.json()),
      fetch('/api/survey/records').then(r=>r.json())
    ]);
    STATS = rs; RAW = rd.records||[];
    if(rs.error){ showNotice(rs.error); }
    render();
  }catch(e){
    showNotice('데이터를 불러오지 못했습니다: '+e.message);
  }finally{
    document.getElementById('loading').style.opacity=0;
    setTimeout(()=>document.getElementById('loading').style.display='none',300);
  }
}
function showNotice(msg){const n=document.getElementById('notice');n.textContent=msg;n.classList.add('show');}

// ── 날짜 컨트롤 이벤트 ──
document.querySelectorAll('.date-preset').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.date-preset').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    setRangeDays(parseInt(b.dataset.days,10));
    curPage=1; reloadStats();
  });
});
document.getElementById('dateApply').addEventListener('click',()=>{
  const f=document.getElementById('dateFrom').value, t=document.getElementById('dateTo').value;
  curFrom=f; curTo=t;
  document.querySelectorAll('.date-preset').forEach(x=>x.classList.remove('active'));
  curPage=1; reloadStats();
});

// 주관식 항목 토글 (전체 / 항목 하나만)
document.getElementById('fieldToggle').addEventListener('click',e=>{
  const b=e.target.closest('.field-btn'); if(!b) return;
  document.querySelectorAll('.field-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  curField=b.dataset.f;
  curPage=1;
  if(RAW) renderCards();
});

async function reloadStats(){
  // 통계만 다시 받아 다시 그림 (records는 이미 보유)
  const qs = (curFrom||curTo) ? `?date_from=${curFrom}&date_to=${curTo}` : '';
  try{
    STATS = await fetch('/api/survey'+qs).then(r=>r.json());
    render();
  }catch(e){ showNotice('기간 적용 실패: '+e.message); }
}

function render(){
  const totalAll = STATS ? (STATS.total_all ?? STATS.total) : 0;
  if(!STATS || STATS.total===0){
    let msg;
    if(totalAll>0){
      const fp=STATS.full_period||{};
      msg=`선택한 기간에 응답이 없습니다. 전체 데이터 범위: ${fmtDate(fp.from)} ~ ${fmtDate(fp.to)}`;
    }else{
      msg='아직 수집된 응답이 없습니다';
    }
    document.getElementById('kpiRow').innerHTML=`<div class="kpi"><div class="kpi-label">응답</div><div class="kpi-value">0<small> 건</small></div><div class="kpi-sub">${msg}</div></div>`;
    destroyCharts();
    if(RAW){ setupFilters(); renderCards(); }
    return;
  }
  document.getElementById('lastUpd').textContent = STATS.last_updated ? '갱신 '+fmtDate(STATS.last_updated.slice(0,10)) : '';
  renderKpi();
  renderCharts();
  setupFilters();
  renderCards();
}

function renderKpi(){
  const s=STATS, p=s.period||{};
  const avg=s.avg_satisfaction;
  const stars = avg ? '★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg)) : '';
  const recAgree = (s.recommend_dist||[]).reduce((a,b)=>a+(b.label.includes('동의')?b.count:0),0);
  const recRate = s.total? Math.round(recAgree/s.total*100):0;
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi"><div class="kpi-label">총 응답</div><div class="kpi-value">${s.total.toLocaleString()}<small> 건</small></div><div class="kpi-sub">${fmtDate(p.from)} ~ ${fmtDate(p.to)}</div></div>
    <div class="kpi"><div class="kpi-label">평균 만족도</div><div class="kpi-value">${avg??'-'}<small> / 5</small></div><div class="kpi-sub stars">${stars}</div></div>
    <div class="kpi"><div class="kpi-label">추천 의향 동의</div><div class="kpi-value">${recRate}<small>%</small></div><div class="kpi-sub">${recAgree.toLocaleString()}명 동의</div></div>
  `;
}

function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};}
function donutOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12,padding:8,color:getCss('--text3')}}}};}
function barOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:11},color:getCss('--text3')},grid:{display:false}},y:{ticks:{font:{size:11},color:getCss('--text3'),precision:0},grid:{color:getCss('--border')}}}};}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#999';}

function renderCharts(){
  destroyCharts();
  const s=STATS;
  // 만족도 (막대)
  const sat=s.satisfaction_dist||[];
  charts.sat=new Chart(document.getElementById('chSat'),{type:'bar',
    data:{labels:sat.map(x=>x.score+'점'),datasets:[{data:sat.map(x=>x.count),backgroundColor:['#EF4444','#F59E0B','#FbbF24','#60A5FA','#10B981'],borderRadius:6}]},
    options:barOpts()});
  // 인지경로 (도넛)
  donut('chChannel',s.channel_dist);
  // 주문경로 (도넛)
  donut('chOrder',s.order_path_dist);
  // 연령 (막대)
  const age=(s.age_dist||[]).slice().sort((a,b)=>a.label.localeCompare(b.label));
  charts.age=new Chart(document.getElementById('chAge'),{type:'bar',
    data:{labels:age.map(x=>x.label),datasets:[{data:age.map(x=>x.count),backgroundColor:'#b5651d',borderRadius:6}]},
    options:barOpts()});
  // 성별 (도넛)
  donut('chGender',s.gender_dist);
  // 추천의향 (도넛)
  donut('chRec',s.recommend_dist);
}
function donut(id,dist){
  dist=dist||[];
  charts[id]=new Chart(document.getElementById(id),{type:'doughnut',
    data:{labels:dist.map(x=>x.label.length>16?x.label.slice(0,15)+'…':x.label),datasets:[{data:dist.map(x=>x.count),backgroundColor:PALETTE,borderWidth:2,borderColor:getCss('--surface')}]},
    options:donutOpts()});
}

let _filtersReady=false;
function setupFilters(){
  if(_filtersReady)return;
  _filtersReady=true;
  const gsel=document.getElementById('filGender'), psel=document.getElementById('filPath');
  const seenG=new Set(), seenP=new Set();
  (STATS.gender_dist||[]).forEach(g=>{if(seenG.has(g.label))return;seenG.add(g.label);const o=document.createElement('option');o.value=g.label;o.textContent=g.label;gsel.appendChild(o);});
  (STATS.order_path_dist||[]).forEach(p=>{if(seenP.has(p.label))return;seenP.add(p.label);const o=document.createElement('option');o.value=p.label;o.textContent=p.label;psel.appendChild(o);});
  ['searchBox','filSat','filGender','filPath'].forEach(id=>{
    document.getElementById(id).addEventListener('input',()=>{curPage=1;renderCards();});
    document.getElementById(id).addEventListener('change',()=>{curPage=1;renderCards();});
  });
}

function filteredRows(){
  const q=document.getElementById('searchBox').value.trim();
  const fs=document.getElementById('filSat').value;
  const fg=document.getElementById('filGender').value;
  const fp=document.getElementById('filPath').value;
  return RAW.filter(r=>{
    const ts=r.ts||'';
    if(curFrom && ts<curFrom)return false;
    if(curTo && ts>curTo)return false;
    if(fs && String(r.satisfaction)!==fs)return false;
    if(fg && r.gender!==fg)return false;
    if(fp && r.order_path!==fp)return false;
    // 특정 주관식 항목 선택 시: 그 항목이 비어있는 응답은 제외
    if(curField!=='all' && !(r[curField]||'').trim())return false;
    if(q){
      const blob=[r.reason,r.improve_product,r.improve_order,r.wish_product,r.product,r.channel].join(' ');
      if(!blob.includes(q))return false;
    }
    return true;
  });
}

function satBadge(s){
  if(s===5)return'<span class="badge b-sat5">5</span>';
  if(s===4)return'<span class="badge b-sat4">4</span>';
  if(s===3)return'<span class="badge b-sat3">3</span>';
  if(s===2||s===1)return`<span class="badge b-sat12">${s}</span>`;
  return'-';
}
function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function starStr(s){s=Number(s)||0;return '★'.repeat(s)+'☆'.repeat(Math.max(0,5-s));}
function qaItem(label,val){
  const v=(val||'').trim();
  if(!v) return '';  // 비어있으면 칸 자체를 표시하지 않음
  return `<div class="qa-item"><span class="qa-label">${label}</span><span class="qa-text">${esc(v)}</span></div>`;
}

function renderCards(){
  const rows=filteredRows().slice().reverse(); // 최신순
  const el=document.getElementById('respList');
  if(!rows.length){el.innerHTML='<div class="empty">조건에 맞는 응답이 없습니다</div>';document.getElementById('pager').innerHTML='';return;}
  const totalPg=Math.ceil(rows.length/PER);
  if(curPage>totalPg)curPage=totalPg;
  const slice=rows.slice((curPage-1)*PER,curPage*PER);
  const FIELDS={reason:'만족 이유',improve_product:'상품 개선점',improve_order:'주문과정 개선점',wish_product:'출시 희망 상품'};
  el.innerHTML=slice.map(r=>{
    const s=r.satisfaction;
    const isLow = s>0 && s<=3;
    let qaHtml;
    if(curField==='all'){
      qaHtml = Object.entries(FIELDS).map(([k,lbl])=>qaItem(lbl,r[k])).join('');
    }else{
      qaHtml = qaItem(FIELDS[curField], r[curField]);
    }
    const qaBlock = qaHtml
      ? `<div class="resp-qa ${curField==='all'?'':'single'}">${qaHtml}</div>`
      : `<div class="resp-noqa">주관식 응답 없음</div>`;
    return `<div class="resp-card ${isLow?'low':''}">
      <div class="resp-top">
        ${satBadge(s)}
        <span class="resp-stars">${starStr(s)}</span>
        ${r.product?`<span class="resp-product">${esc(r.product)}</span>`:''}
        <span class="resp-tags">
          ${r.order_path?`<span class="resp-tag">${esc(r.order_path)}</span>`:''}
          ${r.channel?`<span class="resp-tag">${esc(r.channel)}</span>`:''}
        </span>
      </div>
      ${qaBlock}
      <div class="resp-foot">
        <span><b>날짜</b> ${fmtDate(r.ts)}</span>
        ${r.gender?`<span><b>성별</b> ${esc(r.gender)}</span>`:''}
        ${r.age?`<span><b>연령</b> ${esc(r.age)}</span>`:''}
        ${r.recommend?`<span><b>추천</b> ${esc(r.recommend)}</span>`:''}
        <span><b>연락처</b> ${esc(r.phone)}</span>
      </div>
    </div>`;
  }).join('');
  renderPager(totalPg,rows.length);
}
function renderPager(total,count){
  if(total<=1){document.getElementById('pager').innerHTML=`<span style="font-size:11px;color:var(--text4)">${count}건</span>`;return;}
  let h=`<button class="pg-btn" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`;
  const win=2;let start=Math.max(1,curPage-win),end=Math.min(total,curPage+win);
  if(start>1)h+=`<button class="pg-btn" onclick="goPage(1)">1</button>`+(start>2?'<span style="color:var(--text4)">…</span>':'');
  for(let i=start;i<=end;i++)h+=`<button class="pg-btn ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if(end<total)h+=(end<total-1?'<span style="color:var(--text4)">…</span>':'')+`<button class="pg-btn" onclick="goPage(${total})">${total}</button>`;
  h+=`<button class="pg-btn" onclick="goPage(${curPage+1})" ${curPage===total?'disabled':''}>›</button>`;
  h+=`<span style="font-size:11px;color:var(--text4);margin-left:8px">총 ${count.toLocaleString()}건</span>`;
  document.getElementById('pager').innerHTML=h;
}
function goPage(p){curPage=p;renderCards();window.scrollTo({top:document.querySelector('.table-controls').offsetTop-20,behavior:'smooth'});}

setRangeDays(14);  // 기본값: 최근 14일
load();
</script>
